<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zion App Network Catalog | Zion Tech Group</title><meta name="description" content="Catalog of 200+ free AI and IT apps in the Zion App Network, with live links and open-source GitHub repositories."><link rel="canonical" href="https://ziontechgroup.com/apps/catalog.html"><style>body{font-family:system-ui,sans-serif;background:#0b1020;color:#e8ecf8;margin:0;line-height:1.6}header{padding:3rem 1.5rem;text-align:center;background:linear-gradient(135deg,#101a3a,#0b1020)}h1{font-size:2.2rem;margin:.2rem 0}header p{color:#9aa5c4;max-width:760px;margin:0 auto}a{color:#4f8cff}nav{margin-top:1rem}nav a{margin:0 .7rem;text-decoration:none;font-weight:700}input{display:block;margin:1.5rem auto 0;padding:.75rem 1rem;width:min(90%,520px);background:#141b33;border:1px solid #2a3560;color:#e8ecf8;border-radius:8px}.wrap{max-width:1120px;margin:auto;padding:2rem 1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}.card{background:#141b33;border:1px solid #2a3560;border-radius:12px;padding:1rem}.card:hover{border-color:#4f8cff}.card h3{font-size:1rem;margin:0 0 .35rem;word-break:break-word}.card p{color:#9aa5c4;font-size:.9rem;min-height:3.2rem}.card a{font-size:.86rem;margin-right:.8rem;text-decoration:none;font-weight:700}.cat{color:#4f8cff;margin-top:2rem;border-bottom:1px solid #2a3560;padding-bottom:.3rem}footer{text-align:center;color:#9aa5c4;border-top:1px solid #2a3560;padding:2rem}</style></head><body><header><h1>🕸 Zion App Network Catalog</h1><p>All public Zion App Network apps — open source on GitHub and interlinked across ziontechgroup.com.</p><nav><a href="https://ziontechgroup.com">Home</a><a href="/apps/">Explorer</a><a href="/app-network/">About</a><a href="/blog/zion-app-network-200-apps.html">Announcement</a><a href="https://github.com/Zion-support">GitHub Org</a></nav><input id="q" placeholder="Search apps by name or description…"></header><main class="wrap"><p id="stats">Loading app catalog…</p><div id="root"></div></main><footer>© 2026 Zion Tech Group · <a href="mailto:commercial@ziontechgroup.com">commercial@ziontechgroup.com</a><br>Need custom AI or field-service support? <a href="https://ziontechgroup.com/contact/">Contact us</a>.</footer><script>const CATS=[['Security & Compliance',['compliance','security','secret','phishing','audit','policy','risk','deepfake','ssl','offboarding']],['FinOps & ROI',['cost','finops','roi','billing','budget','price','quote','invoice','depreciation','arbitrage','crypto']],['AI Agents & Automation',['agent','swarm','orchestr','workflow','automation']],['Data & ML',['data','pipeline','ml-','model','rag','llm','eval','benchmark','synthetic','chart','labeling']],['Content & Marketing',['content','seo','marketing','social','caption','image','audio','avatar','advertising','growth']],['HR & Education',['hr','talent','recruit','interview','onboard','resume','coach','education','tutor','assessment']],['Field Services & Ops',['field','dispatch','site-survey','spare','rma','warranty','sla','incident','depot','technician','capacity','backup']],['Industry Platforms',['banking','healthcare','retail','agriculture','financial-services','industry','legal','carbon','energy']]];const cat=n=>{for(const[c,ks]of CATS)if(ks.some(k=>n.includes(k)))return c;return'AI & IT Tools'};let R=[];async function load(){let p=1,a=[];while(p<6){const r=await fetch(`https://api.github.com/users/Zion-support/repos?per_page=100&page=${p}`);const b=await r.json();if(!Array.isArray(b)||!b.length)break;a=a.concat(b);p++}R=a.filter(x=>x.name!=='zion-support.github.io').map(x=>({n:x.name,d:(x.description||'Zion App Network app').split('. Live')[0],h:x.homepage||`https://ziontechgroup.com/${x.name}/`,g:x.html_url,c:cat(x.name)}));render()}const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function render(){const q=document.getElementById('q').value.toLowerCase(),list=R.filter(x=>!q||x.n.includes(q)||x.d.toLowerCase().includes(q));document.getElementById('stats').textContent=`Showing ${list.length} of ${R.length} apps`;const groups={};list.forEach(x=>(groups[x.c] ||= []).push(x));document.getElementById('root').innerHTML=Object.keys(groups).sort().map(c=>`<h2 class="cat">${c} (${groups[c].length})</h2><div class="grid">${groups[c].sort((a,b)=>a.n.localeCompare(b.n)).map(x=>`<div class="card"><h3>${esc(x.n)}</h3><p>${esc(x.d)}</p><a href="${x.h}" target="_blank" rel="noopener">▶ Live app</a><a href="${x.g}" target="_blank" rel="noopener">GitHub</a></div>`).join('')}</div>`).join('')}document.getElementById('q').oninput=render;load().catch(()=>document.getElementById('stats').textContent='Catalog temporarily unavailable — visit github.com/Zion-support');</script></body></html>
