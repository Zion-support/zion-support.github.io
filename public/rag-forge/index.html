<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RAG Forge | Zion Tech Group</title><meta name="description" content="Plan a retrieval pipeline and a review checklist. The brief stays in your browser."><link rel="canonical" href="https://ziontechgroup.com/rag-forge/"><meta name="robots" content="index,follow"><style>body{margin:0;background:#0b1120;color:#cbd5e1;font:16px/1.6 system-ui,sans-serif}a{color:#38bdf8}.wrap{max-width:880px;margin:0 auto;padding:24px}nav a{color:#e2e8f0;margin-right:12px;text-decoration:none}h1{color:#fff;letter-spacing:-.03em}label{display:block;margin:12px 0 6px;color:#94a3b8}input,textarea{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #1e293b;background:#111c33;color:#fff}button{margin-top:14px;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700}pre{white-space:pre-wrap;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:14px}footer{margin-top:28px;color:#94a3b8}</style></head><body><div class="wrap"><nav><a href="/">Zion Tech Group</a><a href="/apps/">Apps</a><a href="/solutions/">Solutions</a><a href="/discovery/">Discovery $99</a></nav><h1>RAG Forge</h1><p>Name the corpus and the question. This writes a pipeline brief. It does not index documents or call a model.</p><label>Sources</label><input id="src" placeholder="Policies, closed tickets, manuals"><label>Question</label><textarea id="ask" rows="3"></textarea><label>Chunk tokens</label><input id="chunk" value="800"><button type="button" onclick="forge()">Build brief</button><pre id="out" hidden></pre><p>Related: <a href="/rag-quality-check/">RAG evaluator</a> · <a href="/prompt-studio/">Prompt Forge</a> · <a href="/discovery/">Discovery</a></p><script>function forge(){const g=id=>document.getElementById(id).value.trim();const t=['RAG brief','Sources: '+(g('src')||'(not named)'),'Question: '+(g('ask')||'(not named)'),'Chunk: '+(g('chunk')||'800')+' tokens','','1. Ingest only the named sources and record the refresh cadence.','2. Split on headings, then to the chunk size.','3. If retrieval is empty, say so. Do not invent a citation.','4. A person reviews answers that change a customer, a price, or a control.'].join(String.fromCharCode(10));const o=document.getElementById('out');o.hidden=false;o.textContent=t;}</script><footer><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a> · <a href="/contact/">Contact</a></footer></div></body></html>
