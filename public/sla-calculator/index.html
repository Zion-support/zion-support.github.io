<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLA Calculator · Zion Tech Group</title>
<meta name="description" content="Free SLA calculator: allowed downtime per period and penalty exposure for IT service contracts.">
<link rel="canonical" href="https://ziontechgroup.com/sla-calculator/">
<link rel="stylesheet" href="/assets/css/apps-network.css">
<style>:root{--bg:#0b1220;--card:#121a2b;--ink:#e8eef8;--muted:#9aa8bd;--line:#243049;--accent:#7dd3fc}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 72px}a{color:var(--accent);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h2{margin:0 0 8px;font-size:1.1rem}.muted{color:var(--muted)}
.btn{display:inline-block;margin-top:10px;color:#042033;background:var(--accent);padding:8px 12px;border-radius:999px;font-weight:700}
input,select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px;width:100%;margin:4px 0}
label{font-size:.85rem;color:var(--muted)}
.result{font-size:1.4rem;font-weight:800;color:var(--accent);margin-top:10px}
li{margin:6px 0}</style>
</head>
<body>
<div class="wrap">
<nav class="apps-nav" data-apps-nav></nav>
<h1>SLA Calculator</h1>
<p class="muted">Free SLA calculator: allowed downtime per period and penalty exposure for IT service contracts.</p>
<div class="card">
<label>Uptime SLA (%) <input id="u" type="number" value="99.9" step="0.001"></label>
<label>Period (days) <input id="d" type="number" value="30"></label>
<label>Monthly service fee (US$) <input id="f" type="number" value="2500"></label>
<label>Penalty per hour over allowance (%) <input id="p" type="number" value="5"></label>
<button class="btn" onclick="calc()" style="border:0;cursor:pointer">Calculate</button>
<div id="out"></div>
</div>
<p class="muted">Also: <a href="/incident-cost/">incident cost</a> · <a href="/patch-window/">patch window</a>.</p>
<h2>More free tools from the network</h2>
<div class="grid" data-apps-related></div>
<p class="muted">Need hands-on help? <a href="/discovery/">Book a $99 Discovery</a> or <a href="/en/plans/">see official plans</a>.</p>
</div>
<script src="/assets/js/apps-network.js" defer></script>
<script>function calc(){var u=parseFloat(document.getElementById('u').value),d=parseFloat(document.getElementById('d').value),f=parseFloat(document.getElementById('f').value),p=parseFloat(document.getElementById('p').value);
var mins=d*24*60*(1-u/100);var h=mins/60;var pen=f*(p/100)*Math.max(0,h);
document.getElementById('out').innerHTML='<div class="result">Allowed downtime: '+h.toFixed(2)+' h ('+Math.round(mins)+' min)</div><p class="muted">Estimated penalty exposure if exceeded: US$ '+pen.toFixed(2)+' per hour over allowance.</p>';}</script>
</body>
</html>
