<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Waste Sketch · Zion Apps Network</title>
<meta name="description" content="Quick idle-spend and rightsizing sketch for cloud + model lines. Interlinked with FinOps estimator and FinOps Autopilot.">
<link rel="canonical" href="https://ziontechgroup.com/cloud-waste/">
<link rel="stylesheet" href="/assets/css/apps-network.css">
<style>
:root{--bg:#0b1220;--card:#121a2b;--ink:#e8eef8;--muted:#9aa8bd;--line:#243049;--accent:#7dd3fc}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 72px}a{color:var(--accent);text-decoration:none}
label{display:block;margin:14px 0 6px;color:var(--muted);font-size:.9rem}
input{width:100%;background:#0a1220;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
.btn{display:inline-block;margin-top:14px;color:#042033;background:var(--accent);padding:10px 14px;border-radius:999px;font-weight:700;border:0;cursor:pointer}
.muted{color:var(--muted)}.score{font-size:1.6rem;font-weight:800;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<nav class="apps-nav" data-apps-nav aria-label="Apps network"></nav>
<p class="muted" style="text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:800">Money · Zion Apps Network</p>
<h1>Cloud waste sketch</h1>
<p class="muted">Ballpark idle / over-provisioned spend. Not a quote. Continue with <a href="/finops-estimator/">FinOps estimator</a> or <a href="/finops-autopilot-desk/">FinOps Autopilot</a>.</p>
<div class="card">
  <div class="grid">
    <div><label for="compute">Monthly compute ($)</label><input id="compute" type="number" min="0" value="12000"></div>
    <div><label for="idle">Estimated idle %</label><input id="idle" type="number" min="0" max="90" value="28"></div>
    <div><label for="storage">Monthly storage ($)</label><input id="storage" type="number" min="0" value="2500"></div>
    <div><label for="model">Monthly model / LLM ($)</label><input id="model" type="number" min="0" value="1800"></div>
  </div>
  <button class="btn" type="button" id="go">Estimate waste</button>
  <div id="out" class="card" style="display:none;margin-top:16px">
    <div class="score" id="score"></div>
    <p id="blurb" class="muted"></p>
    <p><a href="/finops-estimator/">FinOps estimator →</a> · <a href="/token-cost/">Token cost</a> · <a href="/discovery/">Discovery $99</a></p>
  </div>
</div>
<section style="margin-top:28px">
  <h2>Related in the network</h2>
  <div data-apps-related data-limit="6" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"></div>
</section>
</div>
<script>
(function(){
  function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
  function run(){
    var c=+document.getElementById('compute').value||0;
    var idle=(+document.getElementById('idle').value||0)/100;
    var st=+document.getElementById('storage').value||0;
    var m=+document.getElementById('model').value||0;
    var waste=c*idle + st*0.15 + m*0.2;
    document.getElementById('out').style.display='block';
    document.getElementById('score').textContent='~'+money(waste)+' / mo recoverable';
    document.getElementById('blurb').textContent='Order-of-magnitude only. Use FinOps estimator for line items, then Discovery if you want a scoped rightsizing plan.';
  }
  document.getElementById('go').addEventListener('click',run);
})();
</script>
<script src="/assets/js/apps-network.js" defer></script>
</body>
</html>
