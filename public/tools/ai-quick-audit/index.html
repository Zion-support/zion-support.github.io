<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Quick Audit | Zion Tech Group</title>
<meta name="description" content="8-question AI readiness audit with maturity score and next steps."/>
<link rel="canonical" href="https://ziontechgroup.com/tools/ai-quick-audit/"/>
<style>
  :root{--bg:#0b1221;--panel:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#7c3aed}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 800px at 10% -10%,#1f1638,transparent),radial-gradient(900px 600px at 90% 10%,#0f2a3d,transparent),var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
  .logo{font-weight:800;background:linear-gradient(to right,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .badge{font-size:12px;color:#c4b5fd;background:#1c1630;border:1px solid #2b2440;padding:6px 10px;border-radius:999px}
  .card{background:linear-gradient(180deg,rgba(17,24,39,.85),rgba(15,23,42,.85));border:1px solid #243044;border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  h1{font-size:26px;margin:0 0 8px}
  p.lead{color:var(--muted);margin:0 0 18px}
  .q{margin:14px 0 18px}
  .q label{display:block;font-weight:600;margin-bottom:8px}
  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media (max-width: 640px){.options{grid-template-columns:1fr}}
  .opt{display:flex;align-items:center;gap:10px;background:#0f172a;border:1px solid #243044;padding:12px;border-radius:12px;cursor:pointer;transition:.15s border-color,.15s transform}
  .opt:hover{border-color:#334155;transform:translateY(-1px)}
  .opt input{accent-color:#7c3aed}
  .actions{display:flex;gap:12px;margin-top:8px}
  button{background:linear-gradient(to right,#7c3aed,#db2777);color:white;border:none;padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer}
  button.secondary{background:#0f172a;border:1px solid #243044;color:#e5e7eb}
  .result{display:none;margin-top:18px}
  .score{font-size:40px;font-weight:900;background:linear-gradient(to right,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:var(--muted)}
  a{color:#c4b5fd}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Zion Tech Group</div>
    <div class="badge">Free Tool</div>
  </header>
  <section class="card">
    <h1>AI Quick Audit</h1>
    <p class="lead">8 questions, ~2 minutes. Get a maturity score and next steps.</p>

    <form id="audit">
      <div class="q">
        <label>1) Do you have a current AI strategy or roadmap?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q1" value="3" required/> Yes, documented</label>
          <label class="opt"><input type="radio" name="q1" value="2"/> Informal ideas</label>
          <label class="opt"><input type="radio" name="q1" value="1"/> One-off projects</label>
          <label class="opt"><input type="radio" name="q1" value="0"/> None</label>
        </div>
      </div>
      <div class="q">
        <label>2) Are production AI/automation services monitored for reliability?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q2" value="3" required/> Yes, with SLOs</label>
          <label class="opt"><input type="radio" name="q2" value="2"/> Dashboards only</label>
          <label class="opt"><input type="radio" name="q2" value="1"/> Ad-hoc checks</label>
          <label class="opt"><input type="radio" name="q2" value="0"/> No monitoring</label>
        </div>
      </div>
      <div class="q">
        <label>3) Is sensitive data governed for AI usage?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q3" value="3" required/> Formal policy + controls</label>
          <label class="opt"><input type="radio" name="q3" value="2"/> Informal rules</label>
          <label class="opt"><input type="radio" name="q3" value="1"/> Partial awareness</label>
          <label class="opt"><input type="radio" name="q3" value="0"/> No policy</label>
        </div>
      </div>
      <div class="q">
        <label>4) How do you handle AI-related incidents or failures?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q4" value="3" required/> Runbook + retraining</label>
          <label class="opt"><input type="radio" name="q4" value="2"/> Incident review</label>
          <label class="opt"><input type="radio" name="q4" value="1"/> Ad-hoc fixes</label>
          <label class="opt"><input type="radio" name="q4" value="0"/> No process</label>
        </div>
      </div>
      <div class="q">
        <label>5) Are AI costs tracked by team/product?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q5" value="3" required/> Yes, automated</label>
          <label class="opt"><input type="radio" name="q5" value="2"/> Manual reports</label>
          <label class="opt"><input type="radio" name="q5" value="1"/> Visibility only</label>
          <label class="opt"><input type="radio" name="q5" value="0"/> No tracking</label>
        </div>
      </div>
      <div class="q">
        <label>6) Do teams integrate AI into existing workflows vs new isolated tools?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q6" value="3" required/> Integrated-first</label>
          <label class="opt"><input type="radio" name="q6" value="2"/> Mix of both</label>
          <label class="opt"><input type="radio" name="q6" value="1"/> Mostly isolated</label>
          <label class="opt"><input type="radio" name="q6" value="0"/> No integrations</label>
        </div>
      </div>
      <div class="q">
        <label>7) How is AI output validated before production?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q7" value="3" required/> Automated eval + human</label>
          <label class="opt"><input type="radio" name="q7" value="2"/> Human review</label>
          <label class="opt"><input type="radio" name="q7" value="1"/> Spot checks</label>
          <label class="opt"><input type="radio" name="q7" value="0"/> No validation</label>
        </div>
      </div>
      <div class="q">
        <label>8) Do you have executive sponsorship for AI scaling?</label>
        <div class="options">
          <label class="opt"><input type="radio" name="q8" value="3" required/> Budget + roadmap</label>
          <label class="opt"><input type="radio" name="q8" value="2"/> Sponsorship</label>
          <label class="opt"><input type="radio" name="q8" value="1"/> Interest only</label>
          <label class="opt"><input type="radio" name="q8" value="0"/> No sponsorship</label>
        </div>
      </div>
      <div class="actions">
        <button type="submit">Calculate maturity</button>
        <button type="button" class="secondary" onclick="location.href='/tools/'">Back to tools</button>
      </div>
    </form>

    <div id="result" class="result card">
      <div class="score" id="score"></div>
      <p class="muted" id="verdict"></p>
      <p>Next step: <a href="/contact/">Talk to a Zion AI consultant</a> or explore <a href="/services/">services</a>.</p>
    </div>
  </section>
</div>
<script>
const form=document.getElementById('audit');
const result=document.getElementById('result');
const scoreEl=document.getElementById('score');
const verdict=document.getElementById('verdict');
form.addEventListener('submit',e=>{
  e.preventDefault();
  const fd=new FormData(form);
  let s=0;
  for(let i=1;i<=8;i++) s+=Number(fd.get('q'+i)||0);
  scoreEl.textContent=s+'/24';
  let v='';
  if(s>=21) v='Advanced execution. Optimize scale, cost, and governance.';
  else if(s>=17) v='Strong foundation. Expand integrations and automation.';
  else if(s>=12) v='Emerging. Prioritize a narrow pilot with measurable outcomes.';
  else if(s>=7) v='Early stage. Start with 1-2 high-ROI use cases and data readiness.';
  else v='Foundational. Begin with strategy, data audit, and executive alignment.';
  verdict.textContent=v;
  result.style.display='block';
  result.scrollIntoView({behavior:'smooth',block:'start'});
});
</script>
</body>
</html>
