name: CI/CD Pipeline

# hero-carousel still carries a Next.js CI/CD that fails (build/webpack/JSON-LD).
# Production deploys from main via Simple Static Deploy (GitHub Pages).
# Keep this file as a no-op so GitHub does not keep failing scheduled/push runs
# against a stack we no longer ship.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Static Pages is the production path
        run: |
          echo "CI/CD Pipeline is retired."
          echo "Production: Simple Static Deploy on main (actions/deploy-pages)."
          echo "Do not re-enable Next.js build on this branch."
