name: Emergency Recovery - Minimal Build
"on":
  workflow_dispatch: null
  push:
    branches:
    - main
    paths-ignore:
    - '**/STATUS.md'
    - 'automation/reports/**'
jobs:
  recovery:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BUILD_WORKER_COUNT: '1'
      NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
      NEXT_TURBOPACK: '1'

    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
    - run: rm -rf node_modules .next node
    - run: npm ci --prefer-offline --no-audit --fund=false || npm install --force
    # Turbopack build (Next 16 default) uses a fraction of webpack's memory on this 135k-file tree;
    # webpack build OOMs even with 24GB heap + 16GB swap. Do NOT use `npm run build` (forces --webpack).
    - run: npx next build
    timeout-minutes: 25
