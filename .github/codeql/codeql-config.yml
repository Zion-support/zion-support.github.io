name: "Zion CodeQL config"
# Scope analysis to real application source only.
# This repo is a GitHub Pages site with 800+ generated page directories
# at the root (125k+ files); scanning everything exceeds hosted-runner
# resources and fails the 'Perform CodeQL Analysis' step (~10 min, exit 1).
paths:
  - app
  - api
  - backend
  - scripts
  - automation
  - __tests__
paths-ignore:
  - automation/reports
  - node_modules
  - .next
  - out
  - "**/*.min.js"
