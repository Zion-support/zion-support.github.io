name: Test Coverage Guard

# Real Jest coverage evidence, not a green placeholder. The former workflow
# swallowed Jest failures and treated missing HTML coverage as success.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '22 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Validate line-coverage contract without dependencies
        run: node --test scripts/checks/test-coverage-summary.test.cjs
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run Jest; no tests and test failures must fail
        run: ./node_modules/.bin/jest --ci --runInBand --watchAll=false --coverage --coverageReporters=json-summary --coverageDirectory=coverage
      - name: Enforce 60 percent line coverage from machine-readable counts
        run: node scripts/checks/test-coverage-summary.cjs coverage/coverage-summary.json 60
      - name: Save actual coverage evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verified-jest-coverage-${{ github.run_id }}
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7
