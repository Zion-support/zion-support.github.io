name: Test Coverage Guard
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 10 * * *
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public merge snapshot without stored credentials
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid checkout candidate SHA."
            exit 1
          fi
          workspace_entry="$(find . -mindepth 1 -maxdepth 1 -print -quit)"
          if [[ -n "$workspace_entry" ]]; then
            echo "::error::Checkout requires an empty workspace; existing files were not changed."
            exit 1
          fi
          git init --quiet
          git remote add origin https://github.com/Zion-support/zion-support.github.io.git
          git -c credential.helper= fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -c submodule.recurse=false checkout --detach FETCH_HEAD
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out revision differs from workflow candidate."
            exit 1
          fi
      - name: Verify checkout regression
        run: python3 scripts/checks/test-coverage-checkout.py
      - name: Setup pinned Node runtime
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Validate line-coverage contract without dependencies
        run: node --test scripts/checks/test-coverage-summary.test.cjs scripts/checks/test-coverage-runner.test.cjs scripts/checks/patch-jest-coverage-errors.test.cjs
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Verify real Jest coverage failure handling
        run: node --test scripts/checks/test-coverage-real-jest.test.cjs
      - name: Run Jest; no tests and test failures must fail
        env:
          # Leave memory for the runner and report generation; do not narrow coverage scope.
          NODE_OPTIONS: --max-old-space-size=6144
        run: bash scripts/checks/run-test-coverage.sh
      - name: Enforce 60 percent line coverage from machine-readable counts
        run: node scripts/checks/test-coverage-summary.cjs coverage/coverage-summary.json 60
      - name: Save actual coverage evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: verified-jest-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
