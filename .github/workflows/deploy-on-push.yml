name: Deploy on Push
permissions:
  contents: read
  pages: write
  id-token: write
"on":
  workflow_run:
    workflows:
    - CI/CD Pipeline
    types:
    - completed
    branches:
    - main
  push:
    branches:
    - main
    # Preserve the legacy STATUS-only filter for this diagnostics lane.
    # Publication is owned by gh-pages.yml; this workflow does not deploy.
    paths-ignore:
    - '**/STATUS.md'
  workflow_dispatch: null
jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ github.token }}
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --fund=false
    - name: Static site build
      # Preserve the existing best-effort Next.js diagnostic build.
      # prepare-pages-out.sh then rebuilds out/ as a diagnostic artifact only.
      # Its workspace and artifacts are never consumed by the publisher.
      continue-on-error: true
      env:
        NODE_OPTIONS: '--max-old-space-size=4096 --max-semi-space-size=64'
        NEXT_BUILD_WORKER_COUNT: '1'
      run: npm run build
    - name: Overlay docs pages onto out/
      run: bash scripts/prepare-pages-out.sh
    - name: Upload diagnostic static artifact
      uses: actions/upload-artifact@v4.4.0
      with:
        name: diagnostic-static-out-${{ github.run_id }}-${{ github.run_attempt }}
        path: out
    - name: Record diagnostic source (not deployed provenance)
      id: resolve-sha
      env:
        SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
    - name: Refresh automation health snapshot (build phase)
      if: always()
      continue-on-error: true
      run: node scripts/automation/generate-automation-health-snapshot.cjs
  smoke-tests:
    # Observes the live site independently; does not validate deployment of this build.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BASE_URL: https://ziontechgroup.com
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.build.outputs.sha }}
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --fund=false
    - name: Observe live site availability
      run: |
        echo "Waiting 30s before independent live-site diagnostics..."
        sleep 30
        set +e
        status=$(curl --silent --show-error --max-time 10 -o /dev/null -w "%{http_code}" "${BASE_URL}/" || echo "000")
        set -e
        if [ "$status" = "200" ]; then echo "Pages site is live (HTTP $status)"; else echo "Pages returned HTTP $status - smoke tests may report failures"; fi
    - name: Independent live-site smoke test
      continue-on-error: true
      run: |
        set -euo pipefail
        failed=0
        while IFS= read -r path; do
          if [ -z "$path" ] || [[ "$path" == \#* ]]; then continue; fi
          status=$(curl --silent --show-error --max-time 8 -o /dev/null -w "%{http_code}" "${BASE_URL}${path}" || echo "000")
          if [ "$status" = "200" ]; then echo "OK $path ($status)"; else echo "FAIL $path ($status)"; failed=1; fi
        done < config/smoke-routes.txt
        [ $failed -eq 0 ] || echo "::warning::Some pages failed smoke test"
    - name: Deploy watchdog
      continue-on-error: true
      env:
        DEPLOY_WATCHDOG_BASE_URL: ${{ env.BASE_URL }}
        DEPLOY_WATCHDOG_ROUTES_FILE: config/smoke-routes.txt
        DEPLOY_WATCHDOG_MAX_ROUTES: 15
        DEPLOY_WATCHDOG_ATTEMPTS: 3
        DEPLOY_WATCHDOG_INTERVAL_MS: 20000
      run: |
        set -euo pipefail
        npm run deploy:watchdog
    - name: Upload deploy watchdog report
      if: always()
      uses: actions/upload-artifact@v4.4.0
      with:
        name: deploy-watchdog-report
        path: automation/reports/deploy-watchdog-latest.json
        if-no-files-found: warn
    - name: Dispatch fingerprint digest after unhealthy deploy watchdog
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        enabled="${{ vars.AUTOMATION_FP_DIGEST_DISPATCH_ON_DEPLOY_FAILURE }}"
        if [ "$enabled" != "1" ] && [ "$enabled" != "true" ]; then echo "digest dispatch disabled"; exit 0; fi
        report="automation/reports/deploy-watchdog-latest.json"
        if [ ! -f "$report" ]; then echo "No report"; exit 0; fi
        unhealthy="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('$report','utf8'));const u=r.unhealthyCount;const h=r.healthy;const n=typeof u==='number'?u:(h===false?1:0);process.stdout.write(String(n));" 2>/dev/null || echo "0")"
        if [ "${unhealthy:-0}" = "0" ]; then echo "healthy"; exit 0; fi
        gh workflow run "AI Automation fingerprint incident digest" --ref main
    - name: Homepage promotion assertions
      continue-on-error: true
      run: |
        set -euo pipefail
        npm run routes:promotions:check
        homepage=$(curl --fail --silent --show-error --max-time 20 "${BASE_URL}/")
        for token in "Autonomous Conversion Copilot" "Autonomous Incident Commander" "Autonomous Backlog Prioritizer" "Autonomous Retention Playbook" "Autonomous Growth Intelligence"; do
          if printf "%s" "$homepage" | grep -Fq "$token"; then echo "OK $token"; else echo "::warning::missing $token"; fi
        done
    - name: Independent live-site UX diagnostics
      continue-on-error: true
      run: |
        set -euo pipefail
        node automation/ai-live-site-ux-audit-agent.cjs 2>/dev/null || true
    - name: Refresh automation health snapshot
      if: always()
      continue-on-error: true
      run: node scripts/automation/generate-automation-health-snapshot.cjs
