name: Queue Pressure Gate

permissions:
  actions: read
  contents: read

"on":
  workflow_call:
    inputs:
      bypass:
        description: "Allow a deliberate manual workflow to bypass queue pressure."
        required: false
        type: boolean
        default: false
      active_threshold:
        description: "Critical active-run threshold."
        required: false
        type: number
        default: 35
      oldest_minutes_threshold:
        description: "Critical oldest-active-run age in minutes."
        required: false
        type: number
        default: 45
      cancelled_60m_threshold:
        description: "Critical cancellation count in the last 60 minutes."
        required: false
        type: number
        default: 25
    outputs:
      proceed:
        description: "true when the caller may continue expensive optional work."
        value: ${{ jobs.gate.outputs.proceed }}
      reason:
        description: "Human-readable pressure evidence."
        value: ${{ jobs.gate.outputs.reason }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.pressure.outputs.proceed }}
      reason: ${{ steps.pressure.outputs.reason }}
    steps:
      - name: Evaluate repository Actions pressure
        id: pressure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BYPASS: ${{ inputs.bypass }}
          ACTIVE_THRESHOLD: ${{ inputs.active_threshold }}
          OLDEST_THRESHOLD: ${{ inputs.oldest_minutes_threshold }}
          CANCELLED_THRESHOLD: ${{ inputs.cancelled_60m_threshold }}
        run: |
          set -euo pipefail
          if [ "$BYPASS" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-bypass" >> "$GITHUB_OUTPUT"
            echo "## Queue pressure gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Decision: **proceed** (explicit caller bypass)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY'
          import datetime, json, os, urllib.request

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPOSITORY"]
          current=int(os.environ.get("RUN_ID") or 0)
          active_limit=int(os.environ["ACTIVE_THRESHOLD"])
          oldest_limit=float(os.environ["OLDEST_THRESHOLD"])
          cancel_limit=int(os.environ["CANCELLED_THRESHOLD"])

          try:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
                  headers={
                      "Accept":"application/vnd.github+json",
                      "Authorization":f"Bearer {token}",
                      "X-GitHub-Api-Version":"2022-11-28",
                      "User-Agent":"zion-queue-pressure-gate",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload=json.load(response)
          except Exception as exc:
              reason=f"api-unavailable:{type(exc).__name__}"
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
                  f.write("proceed=false\n")
                  f.write(f"reason={reason}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                  f.write("## Queue pressure gate\n\n")
                  f.write(f"- Decision: **skip optional work** ({reason}).\n")
                  f.write("- Telemetry failure is fail-closed but does not fail the workflow.\n")
              print(reason)
              raise SystemExit(0)

          now=datetime.datetime.now(datetime.timezone.utc)
          active_status={"queued","pending","in_progress","waiting","requested"}
          runs=[r for r in payload.get("workflow_runs",[]) if int(r.get("id") or 0)!=current]
          active=[r for r in runs if r.get("status") in active_status]

          def dt(value):
              return datetime.datetime.fromisoformat(value.replace("Z","+00:00")) if value else now

          oldest=max(((now-dt(r.get("created_at"))).total_seconds()/60 for r in active), default=0.0)
          recent=[r for r in runs if (now-dt(r.get("updated_at") or r.get("created_at"))).total_seconds() <= 3600]
          cancelled=[r for r in recent if r.get("conclusion")=="cancelled"]
          critical=len(active)>=active_limit or oldest>=oldest_limit or len(cancelled)>=cancel_limit
          reason=f"active={len(active)},oldest={oldest:.1f}m,cancelled60m={len(cancelled)}"
          proceed="false" if critical else "true"

          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"proceed={proceed}\n")
              f.write(f"reason={reason}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Queue pressure gate\n\n")
              f.write(f"- Active: **{len(active)}** / critical >= {active_limit}\n")
              f.write(f"- Oldest active: **{oldest:.1f}m** / critical >= {oldest_limit:.0f}m\n")
              f.write(f"- Cancelled in 60m: **{len(cancelled)}** / critical >= {cancel_limit}\n")
              f.write(f"- Decision: **{'skip optional work' if critical else 'proceed'}**\n")
          print(reason)
          PY
