name: Queue Pressure Gate

# Read-only reusable decision for OPTIONAL scheduled content publishing.
# Deliberate manual bypass remains available, but never bypasses release checks.
permissions:
  actions: read
  contents: read

"on":
  workflow_call:
    inputs:
      bypass:
        description: "Allow a deliberate manual workflow to bypass queue pressure."
        required: false
        type: boolean
        default: false
      active_threshold:
        description: "Critical active-run threshold."
        required: false
        type: number
        default: 35
      oldest_minutes_threshold:
        description: "Critical oldest-active-run age in minutes."
        required: false
        type: number
        default: 45
      cancelled_60m_threshold:
        description: "Critical cancellation count in the last 60 minutes."
        required: false
        type: number
        default: 25
    outputs:
      proceed:
        description: "true when the caller may continue expensive optional work."
        value: ${{ jobs.gate.outputs.proceed }}
      reason:
        description: "Human-readable pressure evidence."
        value: ${{ jobs.gate.outputs.reason }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.pressure.outputs.proceed }}
      reason: ${{ steps.pressure.outputs.reason }}
    steps:
      - name: Evaluate repository Actions pressure
        id: pressure
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BYPASS: ${{ inputs.bypass }}
          ACTIVE_THRESHOLD: ${{ inputs.active_threshold }}
          OLDEST_THRESHOLD: ${{ inputs.oldest_minutes_threshold }}
          CANCELLED_THRESHOLD: ${{ inputs.cancelled_60m_threshold }}
        run: |
          set -euo pipefail
          if [ "$BYPASS" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-bypass" >> "$GITHUB_OUTPUT"
            echo "## Queue pressure gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Decision: **proceed** (explicit caller bypass)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY'
          """Read-only, fail-closed GitHub Actions congestion gate.
          
          Only used for optional content generation. Never bypasses release/security checks.
          """
          from datetime import datetime, timedelta, timezone
          
          ACTIVE = ('queued', 'pending', 'in_progress', 'waiting', 'requested')
          
          class GateError(ValueError):
              pass
          
          
          def _utc(value):
              if not isinstance(value, str) or not value:
                  raise GateError('missing-timestamp')
              try:
                  instant = datetime.fromisoformat(value.replace('Z', '+00:00'))
              except ValueError:
                  raise GateError('invalid-timestamp') from None
              if instant.tzinfo is None:
                  raise GateError('naive-timestamp')
              return instant.astimezone(timezone.utc)
          
          
          def _parse(response, expected_status=None):
              if not isinstance(response, dict):
                  raise GateError('invalid-response')
              count = response.get('total_count')
              runs = response.get('workflow_runs')
              if type(count) is not int or count < 0 or not isinstance(runs, list):
                  raise GateError('invalid-schema')
              for run in runs:
                  if not isinstance(run, dict) or not isinstance(run.get('id'), int):
                      raise GateError('invalid-run')
              return count, runs
          
          
          def assess(fetch, now, current_run=0, active_limit=35, oldest_limit=45,
                     cancellation_limit=25):
              """fetch(status, per_page) returns decoded GET /actions/runs payload.
          
              Use status-filtered COUNT results first: newest-100 may miss old active runs.
              Only inspect full active samples when total active is safely below limit.
              """
              if now.tzinfo is None:
                  raise GateError('naive-clock')
              for limit in (active_limit, oldest_limit, cancellation_limit):
                  if not isinstance(limit, (int, float)) or limit <= 0:
                      raise GateError('invalid-threshold')
              counts = {}
              for status in ACTIVE:
                  count, _ = _parse(fetch(status, 1), status)
                  counts[status] = count
              active_count = sum(counts.values())
              if active_count >= active_limit:
                  return {'proceed': False, 'reason': f'active={active_count},status-count-pressure',
                          'active_count': active_count, 'oldest_minutes': None,
                          'cancelled_60m': None, 'counts': counts}
          
              # If the count fits below the limit, the complete active set fits in one
              # API page per status. Refuse any incomplete/malformed response.
              by_id = {}
              for status in ACTIVE:
                  if counts[status] == 0:
                      continue
                  if counts[status] > 100:
                      raise GateError('active-sample-truncated')
                  total, runs = _parse(fetch(status, 100), status)
                  if total > 100 or len(runs) < counts[status] or len(runs) < total:
                      raise GateError('active-sample-incomplete')
                  for run in runs:
                      if run['id'] != current_run:
                          by_id[run['id']] = run
              if len(by_id) >= active_limit:
                  return {'proceed': False, 'reason': 'active-count-changed',
                          'active_count': len(by_id), 'oldest_minutes': None,
                          'cancelled_60m': None, 'counts': counts}
          
              oldest = 0.0
              for run in by_id.values():
                  age = (now - _utc(run.get('created_at'))).total_seconds() / 60
                  oldest = max(oldest, age)
              oldest = max(0.0, oldest)
              # Read cancellations independently instead of relying on the newest-100
              # runs across ALL statuses, which can contain only skipped/queued runs.
              _, cancellations = _parse(fetch('cancelled', 100), 'cancelled')
              cancelled_60m = 0
              for run in cancellations:
                  cancel_time = _utc(run.get('updated_at') or run.get('created_at'))
                  if timedelta(0) <= now-cancel_time <= timedelta(minutes=60):
                      cancelled_60m += 1
              critical = oldest >= oldest_limit or cancelled_60m >= cancellation_limit
              reason = f'active={len(by_id)},oldest={oldest:.1f}m,cancelled60m={cancelled_60m}'
              return {'proceed': not critical, 'reason': reason,
                      'active_count': len(by_id), 'oldest_minutes': round(oldest, 1),
                      'cancelled_60m': cancelled_60m, 'counts': counts}
          
          
          def run_gate_from_environment():
              """Operational adapter; failures skip optional work with normal job success."""
              import json
              import os
              import urllib.parse
              import urllib.request
          
              reason = 'telemetry-error'
              report = None
              try:
                  token = os.environ['GH_TOKEN']
                  repository = os.environ['REPOSITORY']
                  if not repository or '/' not in repository:
                      raise GateError('invalid-repository')
                  current = int(os.environ.get('RUN_ID') or 0)
                  active_limit = int(os.environ['ACTIVE_THRESHOLD'])
                  oldest_limit = float(os.environ['OLDEST_THRESHOLD'])
                  cancel_limit = int(os.environ['CANCELLED_THRESHOLD'])
                  now = datetime.now(timezone.utc)
                  def fetch(status, per_page):
                      query = {'per_page': per_page}
                      if status is not None:
                          query['status'] = status
                      url = ('https://api.github.com/repos/' + repository + '/actions/runs?' +
                             urllib.parse.urlencode(query))
                      request = urllib.request.Request(url, headers={
                          'Accept': 'application/vnd.github+json',
                          'Authorization': 'Bearer ' + token,
                          'X-GitHub-Api-Version': '2022-11-28',
                          'User-Agent': 'zion-queue-pressure-gate',
                      })
                      with urllib.request.urlopen(request, timeout=10) as response:
                          return json.load(response)
                  report = assess(fetch, now, current_run=current,
                                  active_limit=active_limit, oldest_limit=oldest_limit,
                                  cancellation_limit=cancel_limit)
                  reason = report['reason']
              except Exception as e:
                  report = {'proceed': False, 'reason': 'telemetry-error:' + type(e).__name__,
                            'active_count': None, 'oldest_minutes': None,
                            'cancelled_60m': None, 'counts': {}}
                  reason = report['reason']
              proceed = 'true' if report['proceed'] else 'false'
              output = os.environ['GITHUB_OUTPUT']
              summary = os.environ['GITHUB_STEP_SUMMARY']
              with open(output, 'a', encoding='utf8') as f:
                  f.write(f'proceed={proceed}\nreason={reason}\n')
              with open(summary, 'a', encoding='utf8') as f:
                  f.write('## Queue pressure gate\n\n')
                  f.write('- Decision: **' + ('proceed' if report['proceed'] else 'skip optional work') + '**\n')
                  f.write('- Evidence: ' + reason + '\n')
                  f.write('- Counts: ' + json.dumps(report['counts'],sort_keys=True) + '\n')
                  f.write('- Status-filtered totals protect against newest-100 truncation.\n')
                  if reason.startswith('telemetry-error'):
                      f.write('- API/telemetry uncertainty is fail-closed.\n')
              print('queue gate: ' + proceed + ', ' + reason)
          
          
          if __name__ == '__main__':
              run_gate_from_environment()
          PY
