# Ensures Deploy on Push remains diagnostic and delegates publication to canonical Pages.
name: deploy on push smoke (weekly)
permissions:
  contents: read
"on":
  schedule:
    - cron: '2 11 * * 4' # Thursdays 11:02 UTC
  workflow_dispatch:
concurrency:
  group: deploy-on-push-smoke-weekly
  cancel-in-progress: true
jobs:
  deploy-on-push-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: deploy-on-push.yml anchors
        run: |
          set -euo pipefail
          f=.github/workflows/deploy-on-push.yml
          test -f "$f"
          test -s "$f"
          grep -Fq -- 'name: Deploy on Push' "$f"
          grep -Fq -- 'workflow_run:' "$f"
          grep -Fq -- '- CI/CD Pipeline' "$f"
          grep -Fq -- 'workflow_dispatch:' "$f"
          grep -Fq -- 'github.token' "$f"
          grep -Fq -- 'bash scripts/prepare-pages-out.sh' "$f"
          grep -Fq -- 'diagnostic-static-out-' "$f"
          grep -Fq -- 'needs: build' "$f"
          grep -Fq -- 'Independent live-site smoke test' "$f"
          grep -Fq -- 'npm run deploy:watchdog' "$f"
          grep -Fq -- 'uses: ./.github/workflows/canonical-pages.yml' .github/workflows/gh-pages.yml
          if grep -Eq '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*['"'"'"]?(actions/(deploy-pages|upload-pages-artifact)|\./\.github/workflows/canonical-pages\.yml)|commit-and-push-main\.sh|deploy:status:generate' "$f"; then
            echo 'ERROR: Deploy on Push must remain diagnostic-only' >&2
            exit 1
          fi
          echo "ok: $f"
