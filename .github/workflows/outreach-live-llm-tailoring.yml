name: outreach-live-llm-tailoring

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    paths:
      - '.github/workflows/outreach-live-llm-tailoring.yml'
      - 'scripts/automation/outreach-workflow-privacy.test.cjs'

permissions:
  contents: read

# A five-minute schedule must never run multiple LLM/outreach workers simultaneously.
# GitHub retains at most one active and one pending run per concurrency group.
concurrency:
  group: outreach-live-llm-tailoring-${{ github.event_name == 'pull_request' && 'contract' || 'worker' }}
  cancel-in-progress: false

jobs:
  privacy-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test workflow privacy contract (offline; never runs worker)
        run: node --test scripts/automation/outreach-workflow-privacy.test.cjs

  outreach:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZION_LLM_API_ENDPOINT: ${{ secrets.ZION_LLM_API_ENDPOINT || 'https://openrouter.ai/api/v1' }}
      ZION_LLM_API_KEY: ${{ secrets.ZION_LLM_API_KEY || secrets.OPENROUTER_API_KEY }}
      ZION_LLM_MODEL: ${{ secrets.ZION_LLM_MODEL || 'openai/gpt-4o-mini' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OUTREACH_DRY_RUN: ${{ secrets.OUTREACH_DRY_RUN || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4

      - name: Run outreach worker (suppress private stdout and stderr)
        id: outreach-worker
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # The Python worker prints contacts, subjects and errors. Never stream them to Actions logs.
          python scripts/outreach/outreach_worker_automation.py > /dev/null 2>&1
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            echo "Outreach worker finished; no private output published."
          else
            echo "::error::Outreach worker failed (details intentionally redacted)."
          fi
          exit "$exit_code"

      - name: Write safe outreach health summary
        if: always()
        env:
          WORKER_STEP_OUTCOME: ${{ steps.outreach-worker.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          base = Path('outreach_monitor/processed')
          readiness_file = base / 'llm_tailoring_readiness.json'
          output = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'worker_step_outcome': os.getenv('WORKER_STEP_OUTCOME', 'unknown'),
              'readiness_report_present': readiness_file.is_file(),
              'sent_ledger_present': (base / 'sent_ledger.jsonl').is_file(),
              'dry_run_ledger_present': (base / 'dry_run_report.jsonl').is_file(),
              'gmail_token_present': None,
              'gmail_auth_error_present': None,
              'readiness_parse_ok': False,
              'methodology': 'Boolean health signals only; no contact, message, token, subject or raw worker output',
          }
          if readiness_file.is_file():
              try:
                  parsed = json.loads(readiness_file.read_text(encoding='utf-8'))
                  gmail = parsed.get('local_gmail_modules', {})
                  if not isinstance(gmail, dict):
                      gmail = {}
                  output['gmail_token_present'] = bool(gmail.get('token_exists'))
                  output['gmail_auth_error_present'] = bool(gmail.get('auth_error'))
                  output['readiness_parse_ok'] = True
              except (OSError, ValueError, TypeError):
                  pass
          Path('outreach-health-summary.json').write_text(json.dumps(output, indent=2) + '\n', encoding='utf-8')
          print('Outreach health summary generated: status and boolean signals only.')
          PY

      - name: Upload redacted health summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: outreach-health-${{ github.run_id }}
          path: outreach-health-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Propagate outreach worker failure without exposing contacts
        if: steps.outreach-worker.outcome == 'failure'
        run: |
          echo "::error::Outreach worker failed; private output has not been uploaded."
          exit 1
