name: outreach-live-llm-tailoring

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# Serialize this worker without interrupting a run that may be sending mail.
concurrency:
  group: outreach-live-llm-tailoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZION_LLM_API_ENDPOINT: ${{ secrets.ZION_LLM_API_ENDPOINT || 'https://openrouter.ai/api/v1' }}
      ZION_LLM_API_KEY: ${{ secrets.ZION_LLM_API_KEY || secrets.OPENROUTER_API_KEY }}
      ZION_LLM_MODEL: ${{ secrets.ZION_LLM_MODEL || 'openai/gpt-4o-mini' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Legacy sender is not released for live use; manual reviewed mail is unaffected.
      OUTREACH_DRY_RUN: '1'
      OUTREACH_REQUIRES_APPROVAL: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Test review-only containment
        run: python -m unittest discover -s scripts/outreach -p 'test_review_only_gate.py' -v

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib requests beautifulsoup4

      - name: Run outreach worker in enforced review-only mode
        id: outreach-worker
        run: |
          # Worker stdout/stderr can contain recipients, subjects and provider errors.
          # Keep them runner-local; never stream or upload this raw log.
          set +e
          python scripts/outreach/review_only_gate.py > outreach_run.log 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Outreach worker exit code: $rc. Private diagnostics are not published."
          exit "$rc"
        continue-on-error: true

      - name: Discover outreach blockers safely
        if: always()
        id: outreach-blockers
        env:
          WORKER_OUTCOME: ${{ steps.outreach-worker.outcome }}
          WORKER_EXIT_CODE: ${{ steps.outreach-worker.outputs.exit_code }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path

          base = Path('outreach_monitor/processed')
          outcome = os.getenv('WORKER_OUTCOME', '')
          raw_exit = os.getenv('WORKER_EXIT_CODE', '')
          report = {
              'schema_version': '2026-10-06-public-safe-v2',
              'timestamp': int(time.time()),
              'worker_outcome': outcome if outcome in ('success', 'failure', 'cancelled', 'skipped') else 'unknown',
              'worker_exit_code': int(raw_exit) if raw_exit.isascii() and raw_exit.isdigit() and len(raw_exit) <= 3 and int(raw_exit) <= 255 else None,
              'files': {},
              'llm_readiness': {},
              'auth_failed': True,
              'auth_evidence': 'unknown',
              'delivery_confirmed': False,
              'mode': 'review_only',
              'live_sending_enabled': False,
              'sent': 0,
              'draft_candidates': None,
              'send_guard_status': 'unavailable',
          }
          # Allowlist only aggregate metadata; never copy rows, errors, paths or keys.
          for name in ('hot_followup_reply_ledger.jsonl', 'sent_ledger.jsonl', 'dry_run_report.jsonl'):
              p = base / name
              info = {'present': p.is_file(), 'nonempty_lines': None, 'readable': False}
              if info['present']:
                  try:
                      with p.open('r', encoding='utf-8', errors='replace') as source:
                          info['nonempty_lines'] = sum(1 for line in source if line.strip())
                      info['readable'] = True
                  except OSError:
                      pass
              report['files'][name] = info
          try:
              p = base / 'llm_tailoring_readiness.json'
              if p.stat().st_size > 1048576:
                  raise ValueError('oversized readiness input')
              r = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(r, dict):
                  raise ValueError('invalid readiness shape')
              for key in ('active', 'has_endpoint', 'has_api_key', 'llm_tailor_enabled'):
                  value = r.get(key)
                  report['llm_readiness'][key] = value if isinstance(value, bool) else None
              modules = r.get('local_gmail_modules')
              if not isinstance(modules, dict):
                  raise ValueError('invalid module status shape')
              token_exists = modules.get('token_exists') is True
              auth_error_present = bool(modules.get('auth_error'))
              report['llm_readiness']['token_exists'] = token_exists
              report['llm_readiness']['auth_error_present'] = auth_error_present
              report['auth_failed'] = not token_exists or auth_error_present
              report['auth_evidence'] = 'reported_failure_or_missing_token' if report['auth_failed'] else 'local_checks_only'
          except (OSError, ValueError, TypeError, UnicodeError):
              report['readiness_unavailable'] = True
          # Copy only bounded aggregates from the containment report, never raw data.
          try:
              p = Path('outreach_monitor/review-only-summary.json')
              if p.stat().st_size > 16384:
                  raise ValueError('oversized guard report')
              guard = json.loads(p.read_text(encoding='utf-8'))
              if not isinstance(guard, dict):
                  raise ValueError('invalid guard shape')
              status = guard.get('status')
              if isinstance(status, str) and status in {
                  'blocked_import', 'blocked_backend_interface', 'blocked_auth_unavailable',
                  'blocked_invalid_result', 'review_generation_completed',
                  'blocked_mutation_attempt', 'blocked_worker_error'}:
                  report['send_guard_status'] = status
              count = guard.get('draft_candidates')
              if type(count) is int and 0 <= count <= 1000000:
                  report['draft_candidates'] = count
              report['gmail_service_interface_valid'] = guard.get('gmail_service_interface_valid') is True
              if not report['gmail_service_interface_valid']:
                  report['auth_failed'] = True
                  report['auth_evidence'] = 'not_verified_by_review_gate'
          except (OSError, ValueError, TypeError, UnicodeError):
              report['send_guard_unavailable'] = True
          # Local checks and ledger line counts are not proof of delivery or interest.
          output = Path('outreach_monitor/public-safe-summary.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          encoded = json.dumps(report, ensure_ascii=True, sort_keys=True)
          output.write_text(encoded + '\n', encoding='utf-8')
          print(encoded)
          PY

      - name: Upload sanitized outreach diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-summary-${{ github.run_id }}
          path: outreach_monitor/public-safe-summary.json
          if-no-files-found: warn
          retention-days: 7
