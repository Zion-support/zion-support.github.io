# AI Content Burst High Frequency
# Template + industry content at four queue-aware daily windows without extra LLM cost.
# Runs content burst (template blog, case studies, industry pages, services advertiser, optional product pages).
# Commit/push behavior is unchanged. All autonomous writers share one concurrency group.

name: AI Content Burst High Frequency

concurrency:
  group: autonomous-main-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

"on":
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      max_template_blog:
        description: 'Template blog posts per run (default 4)'
        required: false
        default: '4'
      max_template_case_studies:
        description: 'Template case studies per run (default 4)'
        required: false
        default: '4'
      max_industry_pages:
        description: 'Industry solution pages (default 2)'
        required: false
        default: '2'
      max_product_pages:
        description: 'Product pages (default 1)'
        required: false
        default: '1'
      trigger_deploy:
        description: 'Trigger deploy after commit (GitHub Pages)'
        required: false
        default: true
        type: boolean

jobs:
  pressure-gate:
    name: Queue pressure preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Skip noncritical scheduled content during Actions pressure
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch bypasses the scheduled-pressure gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPOSITORY"]
          current=int(os.environ.get("RUN_ID") or 0)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"zion-scheduled-content-pressure-gate",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload=json.load(response)
          except Exception as exc:
              reason=f"api-unavailable: {type(exc).__name__}"
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
                  f.write("proceed=false\n")
                  f.write(f"reason={reason}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                  f.write("## Scheduled content pressure gate\n\n")
                  f.write(f"- Decision: **skip scheduled content** ({reason})\n")
                  f.write("- The gate fails closed without converting an optional content run into a repository failure.\n")
              print(reason)
              raise SystemExit(0)

          now=datetime.datetime.now(datetime.timezone.utc)
          active_status={"queued","pending","in_progress","waiting","requested"}
          runs=[r for r in payload.get("workflow_runs",[]) if int(r.get("id") or 0)!=current]
          active=[r for r in runs if r.get("status") in active_status]

          def dt(value):
              return datetime.datetime.fromisoformat(value.replace("Z","+00:00")) if value else now

          oldest=max(((now-dt(r.get("created_at"))).total_seconds()/60 for r in active), default=0.0)
          recent=[r for r in runs if (now-dt(r.get("updated_at") or r.get("created_at"))).total_seconds() <= 3600]
          cancelled=[r for r in recent if r.get("conclusion")=="cancelled"]
          critical=len(active)>=35 or oldest>=45 or len(cancelled)>=25
          reason=f"active={len(active)}, oldest={oldest:.1f}m, cancelled60m={len(cancelled)}"
          proceed="false" if critical else "true"

          out=os.environ["GITHUB_OUTPUT"]
          with open(out,"a",encoding="utf-8") as f:
              f.write(f"proceed={proceed}\n")
              f.write(f"reason={reason}\n")
          summary=os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary,"a",encoding="utf-8") as f:
              f.write("## Scheduled content pressure gate\n\n")
              f.write(f"- {reason}\n")
              f.write(f"- Decision: **{'skip scheduled content' if critical else 'proceed'}**\n")
              f.write("- Thresholds mirror the critical queue policy: active>=35, oldest>=45m, cancellations60m>=25.\n")
          print(reason)
          if critical:
              print("Queue pressure is critical; skipping this noncritical scheduled content run before checkout/install/build.")
          PY
  burst-high-freq:
    needs: pressure-gate
    if: needs.pressure-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: '--max-old-space-size=8192'
      NEXT_BUILD_WORKER_COUNT: 1
    steps:
      - name: Record pressure decision
        run: echo "Queue gate: ${{ needs.pressure-gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run content burst (high frequency)
        env:
          AUTO_COMMIT: "1"
          TRIGGER_DEPLOY: ${{ github.event.inputs.trigger_deploy != 'false' && '1' || '' }}
          MAX_TEMPLATE_BLOG: ${{ github.event.inputs.max_template_blog || '4' }}
          MAX_TEMPLATE_CASE_STUDIES: ${{ github.event.inputs.max_template_case_studies || '4' }}
          MAX_INDUSTRY_PAGES: ${{ github.event.inputs.max_industry_pages || '2' }}
          MAX_PRODUCT_PAGES: ${{ github.event.inputs.max_product_pages || '1' }}
          MAX_ADD: "3"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node automation/ai-content-burst-agent.cjs

      - name: Commit and push if burst did not commit
        if: success()
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            bash scripts/automation/commit-and-push-main.sh "chore(content): content burst high frequency - template blog + case studies + industry pages"
          fi
