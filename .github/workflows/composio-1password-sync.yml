name: 1Password Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Composio Whoami
        run: composio whoami 2>&1 || echo "WHOAMI_FAILED"

      - name: List Connected Accounts
        run: |
          echo "=== Connected Accounts ==="
          composio connections list 2>&1 || echo "LIST_FAILED"

      - name: 1Password vault + items
        env:
          VAULT_ID: qvoxujxka43fr3kyzmb3qsidpi
        run: |
          echo "=== 1Password Tools ==="
          composio tools list 2>&1 | grep -i "_1password\|1password" | head -10 || echo "1P_NOT_FOUND"
          echo "Connection id set: $([ -n "$COMPOSIO_1PASSWORD_CONNECTION_ID" ] && echo yes || echo no)"
          echo "Expected write connection: _1password_winful-mast (alias zion-teams-write)"
          echo "Expected vault: $VAULT_ID"

      - name: Summary
        run: |
          echo "1Password sync completed at $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "Key set: $([ -n "$COMPOSIO_API_KEY" ] && echo 'yes' || echo 'no')" >> "$GITHUB_STEP_SUMMARY"
          echo "Use alias zion-teams-write / id _1password_winful-mast against vault qvoxujxka43fr3kyzmb3qsidpi." >> "$GITHUB_STEP_SUMMARY"
