name: composio-1password-sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts/composio
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      ONEPASSWORD_VAULT_ID: qvoxujxka43fr3kyzmb3qsidpi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/scripts/composio/package-lock.json

      - name: Install Composio SDK
        run: npm ci

      - name: List 1Password vaults and items
        run: node onepassword-list-vault.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "composio-1password-sync finished at $(date -u)"
            echo "Expected write connection: _1password_winful-mast (alias zion-teams-write)"
            echo "Vault: $ONEPASSWORD_VAULT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
