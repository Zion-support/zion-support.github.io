name: Secret Scan

# gitleaks over the lines ADDED by each push / PR (2026-10-04, after a GitHub
# PAT in .netrc was committed on 2026-10-01 in c84562f). Fails the check when a
# credential is detected; findings are redacted in the log.
# Diff-based so it stays fast on this very large repo (no full-history clone).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${tgz}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  /tmp/${tgz}" | sha256sum -c -
          tar -xzf "/tmp/${tgz}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Resolve diff range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || base=""
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "head=${head}" >> "$GITHUB_OUTPUT"
          echo "Scanning added lines ${base:-<root>}..${head}"

      - name: Scan added lines
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            git show --format= --no-color "$HEAD_SHA" > /tmp/diff.txt
          else
            git diff --no-color --no-ext-diff -U0 "$BASE" "$HEAD_SHA" -- . \
              ':(exclude)go/pkg/mod/**' ':(exclude)**/node_modules/**' \
              ':(exclude)**/package-lock.json' > /tmp/diff.txt
          fi
          # Only lines that were added (drop the "+++ b/file" headers).
          grep -E '^\+' /tmp/diff.txt | grep -vE '^\+\+\+ ' > /tmp/added.txt || true
          echo "added lines: $(wc -l < /tmp/added.txt)"
          if [ ! -s /tmp/added.txt ]; then
            echo "Nothing added; skipping."
            exit 0
          fi
          /tmp/gitleaks stdin --redact --no-banner --exit-code 1 < /tmp/added.txt
