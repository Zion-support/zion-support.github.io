name: Workflow Change Guard

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - 'automation/**'
      - 'scripts/automation/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - 'automation/**'
      - 'scripts/automation/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: workflow-change-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site-guard:
    name: Static Pages site — skip npm contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Pages publisher and skip Next.js npm ci
        run: |
          echo "This repo publishes public/ via .github/workflows/static-deploy.yml."
          test -f .github/workflows/static-deploy.yml
          test -f scripts/prepare-pages-out.sh
          echo "npm ci / workflows:contracts:node are not required for the static HTML site."
          echo "Route-slicer, Autopilot Pages deploy, and Next ANALYZE builds stay skipped."
