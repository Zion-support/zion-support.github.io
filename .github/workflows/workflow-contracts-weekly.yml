# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Workflow contracts weekly

permissions:
  contents: read

"on":
  schedule:
    - cron: '25 10 * * 1'
  workflow_dispatch:

concurrency:
  group: workflow-contracts-weekly
  cancel-in-progress: true

jobs:
  contracts:
    uses: ./.github/workflows/reusable-workflow-ci.yml
    with:
      run_contracts: true
