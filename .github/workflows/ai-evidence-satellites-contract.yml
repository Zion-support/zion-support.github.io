name: AI Evidence Satellite Apps - Offline Contracts

on:
  pull_request:
    paths:
      - 'public/agent-trace-evidence-lab/**'
      - 'public/field-sla-acceptance-matrix/**'
      - 'public/ai-dependency-blast-radius/**'
      - 'scripts/test-ai-evidence-satellites.cjs'
      - 'scripts/test-ai-evidence-locales.cjs'
      - 'scripts/test-ai-evidence-review-hardening.cjs'
      - 'scripts/harden-ai-evidence-review.cjs'
      - 'scripts/render-ai-evidence-locales.cjs'
      - 'scripts/render-ai-evidence-review.cjs'
      - 'scripts/complete-ai-evidence-fallbacks.cjs'
      - 'scripts/finalize-ai-evidence-accessibility.cjs'
      - 'scripts/test-ai-evidence-fallbacks.cjs'
      - 'scripts/test-ai-evidence-navigation.cjs'
      - 'scripts/test-ai-evidence-ci-contract.cjs'
      - 'scripts/guard-ai-evidence-review-paths.cjs'
      - 'scripts/test-ai-evidence-review-paths.cjs'
      - '.github/workflows/ai-evidence-satellites-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate original, multilingual and edited-input contracts
        run: node --test scripts/test-ai-evidence-*.cjs
