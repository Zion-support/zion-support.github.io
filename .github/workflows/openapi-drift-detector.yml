name: OpenAPI contract inventory (JSON drift when configured)

# Unlike the previous workflow, no green no-op drift test or routine PR fanout.
"on":
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * 1'
  pull_request:
    paths:
      - '.github/workflows/openapi-drift-detector.yml'
      - 'automation/openapi-drift-detector.cjs'
      - 'automation/openapi-drift-detector.test.cjs'
      - '**/openapi.json'
      - '**/openapi-spec.json'
      - '**/openapi.yaml'
      - '**/openapi.yml'
      - 'app/api/**'
      - 'src/app/api/**'
      - 'pages/api/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/openapi-drift-detector.yml'
      - 'automation/openapi-drift-detector.cjs'
      - 'automation/openapi-drift-detector.test.cjs'
      - '**/openapi.json'
      - '**/openapi-spec.json'
      - '**/openapi.yaml'
      - '**/openapi.yml'
      - 'app/api/**'
      - 'src/app/api/**'
      - 'pages/api/**'

permissions:
  contents: read

concurrency:
  group: openapi-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory-and-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sparse checkout of verifier and possible contract files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nvmrc
            /automation/openapi-drift-detector.cjs
            /automation/openapi-drift-detector.test.cjs
            /openapi.json
            /openapi/openapi.json
            /api/openapi.json
            /docs/openapi.json
            /public/openapi.json
            /spec/openapi.json
            /specs/openapi.json
            /openapi-spec.json
            /docs/openapi-spec.json
            /openapi.yaml
            /openapi.yml
            /openapi/openapi.yaml
            /openapi/openapi.yml
            /api/openapi.yaml
            /api/openapi.yml
            /docs/openapi.yaml
            /docs/openapi.yml
            /public/openapi.yaml
            /public/openapi.yml
            /spec/openapi.yaml
            /spec/openapi.yml
            /specs/openapi.yaml
            /specs/openapi.yml
      - name: Setup Node 22 without npm cache
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Test offline contract auditor
        run: node --test automation/openapi-drift-detector.test.cjs
      - name: Audit actual contract presence and compatibility
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            node automation/openapi-drift-detector.cjs --base 'HEAD^1'
          else
            node automation/openapi-drift-detector.cjs
          fi
      - name: Save honest read-only JSON evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: openapi-contract-inventory-${{ github.run_id }}
          path: automation/reports/openapi-contract-audit.json
          if-no-files-found: warn
          retention-days: 7
