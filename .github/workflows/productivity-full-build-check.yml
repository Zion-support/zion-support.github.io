name: Productivity full static artifact validation
on:
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'content/**'
      - '.github/workflows/static-deploy.yml'
      - '.github/workflows/productivity-full-build-check.yml'
permissions:
  contents: read
concurrency:
  group: productivity-full-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-static-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare pages
        run: |
          bash scripts/prepare-pages-out.sh
      - name: Render translated Discovery and communications content
        run: |
          node scripts/render-discovery-showcase.cjs
      - name: Render consistent multilingual questionnaires and homepage journeys
        run: |
          node scripts/render-discovery-consistency.cjs
      - name: Render free pilot guide and related-app navigation
        run: |
          node scripts/render-discovery-pilot-guide.cjs
      - name: Render linked Discovery app guide and repair recommendation routes
        run: |
          node scripts/render-discovery-linked-guide.cjs
      - name: Link free local preview guide
        run: |
          node scripts/render-discovery-next-step.cjs
      - name: Offline multilingual report contract
        run: |
          node scripts/test-discovery-consistency.cjs
      - name: Render and validate five-language communications workflow lab
        run: |
          node scripts/render-communications-apps.cjs
      - name: Render translated comparison guides and reciprocal navigation
        run: |
          node scripts/render-communications-decision.cjs
      - name: Consolidate translated benefits and workflow paths
        run: |
          node scripts/render-network-benefits.cjs
      - name: Render five-language local app experiment planner and reciprocal paths
        run: |
          node scripts/render-app-experiments.cjs && node scripts/verify-app-experiment-sources.cjs
      - name: Render and test five-language communications readiness checklist
        run: |
          node scripts/render-communications-readiness.cjs && node scripts/test-communications-readiness.cjs out
      - name: Render treasury translations and repair canonical delivery copy
        run: |
          node scripts/render-treasury-network.cjs
      - name: Render five-language insurance concepts and preserve homepage forms
        run: |
          node scripts/render-insurance-network.cjs
      - name: Render translated local insurance evidence workbenches and reciprocal links
        run: |
          node scripts/render-insurance-evidence.cjs
      - name: Offline app experiment safety and language checks
        run: |
          node scripts/test-app-experiments.cjs out
      - name: Offline communications form and navigation regression checks
        run: |
          node scripts/test-communications-lab.cjs out
      - name: Offline translated comparison and publication-manifest checks
        run: |
          node scripts/test-communications-decision.cjs out
      - name: Render and test translated operations and field-service guides
        run: |
          node scripts/render-ops-field-guides.cjs && node scripts/test-ops-field-guides.cjs
      - name: Consolidate app network navigation and five-language entry content
        run: |
          node scripts/render-network-start-here.cjs && node scripts/render-network-home-ad.cjs
      - name: Final reciprocal operations and hub navigation
        run: |
          node scripts/render-ops-field-return-links.cjs
      - name: Validate and render truthful five-language logistics evidence
        run: |
          node scripts/test-logistics-evidence.cjs && node scripts/render-logistics-evidence.cjs out
      - name: Publish five-language field evidence guides and localized resource labels
        run: |
          node scripts/render-field-evidence-release.cjs out && node scripts/render-field-evidence-quality.cjs out && node scripts/test-field-evidence-quality.cjs out
      - name: Render and test pinned five-language telecom guides and reciprocal promotions
        run: |
          node scripts/render-telecom112-release.cjs out && node scripts/test-telecom112-release.cjs out
      - name: Preserve and validate final Discovery pilot backlinks
        run: |
          node scripts/test-discovery-pilot-backlinks.cjs && node scripts/render-discovery-pilot-backlinks.cjs out
      - name: Finalize and validate complete field-guide locale copies
        run: |
          node scripts/finalize-field-evidence-aliases.cjs out
      - name: Render and test five-language local Pilot Planner and homepage promotions
        run: |
          node scripts/render-pilot-planner-locales.cjs out && node scripts/test-pilot-planner-locales.cjs out
      - name: Consolidate and validate final five-language homepage app paths
        run: |
          node scripts/render-home-app-paths.cjs out && node scripts/test-home-app-paths.cjs out && node scripts/finalize-field-evidence-aliases.cjs out
      - name: Final additive five-language supplier-to-pilot paths
        run: |
          node scripts/render-supplier-pilot-paths.cjs out && node scripts/test-supplier-pilot-paths.cjs out
      - name: Render and test five-language supplier worked comparisons
        run: |
          node scripts/render-supplier-comparison.cjs out
      - name: Add and validate five-language SLA evidence and existing homepage links
        run: |
          node scripts/render-sla-evidence.cjs out
      - name: Repair and publish five-language local ticket tools and homepage promotions
        run: |
          node scripts/ticket-support-release.cjs out
      - name: Reconcile and test final folder and suffix localization coverage
        run: |
          node scripts/verify-network-publication.cjs out && node scripts/test-network-publication-routes.cjs out
      - name: Render and gate six-resource five-language productivity navigation
        run: |
          node scripts/render-legacy-three-locales.cjs out
          node scripts/render-productivity-incident-locales.cjs out
          node scripts/render-productivity-workflow-links.cjs out
          node scripts/render-network-home-bridge.cjs out
          node scripts/test-productivity-navigation.cjs out
          node scripts/test-network-home-bridge.cjs out
          node scripts/test-productivity-pipeline.cjs out
          node scripts/verify-network-publication.cjs out
          node scripts/test-network-publication-routes.cjs out
      - name: Retrieve byte-pinned catalog source for offline anchor QA
        run: curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/Zion-support/zion-app-network/main/CATALOG-PRODUCTIVITY-REVIEW.md -o _productivity-catalog.md
      - name: Test source anchors, owned links and artifact staging safety
        run: node scripts/test-productivity-qa.cjs _productivity-catalog.md
      - name: Validate and stage scoped generated pages for QA (not deployment)
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prepare-productivity-qa.cjs out productivity-qa _productivity-catalog.md
      - name: Retain scoped QA pages and manifest for seven days
        uses: actions/upload-artifact@v4
        with:
          name: productivity-qa-${{ github.event.pull_request.head.sha }}
          path: productivity-qa
          retention-days: 7
          if-no-files-found: error
