name: Productivity exact-head artifact validation
on:
  pull_request:
    paths: ['public/**', 'scripts/**', 'tests/ci/**', 'tests/publication/**', 'tests/fixtures/publication/**', 'content/roi-baseline.json', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: productivity-full-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  full-static-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Test read-only live publication contracts without network
        run: node scripts/test-finops-scenario-live.cjs --self-test
      - name: Verify publisher integration and source freshness contracts
        run: |
          python3 tests/ci/test_deploy_on_push_artifact.py
          python3 tests/ci/test_pages_publisher_freshness.py
      - name: Current publisher preparation including existing money-path guards
        run: bash scripts/prepare-pages-out.sh
      - name: Validate the canonical publication boundary
        run: python3 scripts/assert-no-private-ops.py out
      - name: Validate every semantic scope on the unchanged canonical artifact
        run: node scripts/verify-productivity-publication.cjs out
      - name: Fetch catalog source (bytes checked before staging)
        run: curl --fail --silent --show-error --location --max-time 30 https://raw.githubusercontent.com/Zion-support/zion-app-network/632cf44285d3841a4738e628f2497eb8e552fc53/CATALOG-PRODUCTIVITY-REVIEW.md -o _productivity-catalog.md
      - name: Test scoped artifact staging
        run: node scripts/test-productivity-qa.cjs _productivity-catalog.md
      - name: Validate final exact-head artifact
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prepare-productivity-qa.cjs out productivity-qa _productivity-catalog.md
      - uses: actions/upload-artifact@v4
        with:
          name: productivity-qa-${{ github.event.pull_request.head.sha }}
          path: productivity-qa
          retention-days: 7
          if-no-files-found: error
