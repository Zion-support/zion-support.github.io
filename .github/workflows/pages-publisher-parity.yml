name: Pages Publisher Parity Guard
on:
  pull_request:
    paths:
      - '.github/workflows/gh-pages.yml'
      - '.github/workflows/static-deploy.yml'
      - 'scripts/checks/pages-publisher-parity.cjs'
      - '.github/workflows/pages-publisher-parity.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * 2'
permissions:
  contents: read
concurrency:
  group: site-publisher-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Parser self-tests
        run: node scripts/checks/pages-publisher-parity.cjs --self-test
      - name: Verify matching production pipelines
        run: node scripts/checks/pages-publisher-parity.cjs
