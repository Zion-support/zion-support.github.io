name: Offline Contact Reservation Tests

"on":
  pull_request:
    paths:
      - 'experiments/offline-contact-reservations/**'
      - '.github/workflows/offline-contact-reservations.yml'

permissions:
  contents: read

concurrency:
  group: offline-contact-reservations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python reservation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout prototype only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: experiments/offline-contact-reservations
      - name: Run offline Python tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 --version
          python3 experiments/offline-contact-reservations/test_reservations.py -v
