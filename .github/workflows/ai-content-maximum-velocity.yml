# AI Content Maximum Velocity
# One daily "big" content run with elevated limits: ultra-fast pipeline with more blog posts,
# product pages, industry pages, and template content. Pushes to main and triggers deploy.
# Runs 10:30 UTC daily; manual dispatch remains available.

name: AI Content Maximum Velocity

concurrency:
  group: autonomous-main-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

"on":
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      max_blog_posts:
        description: 'Max blog posts (default 14)'
        required: false
        default: '14'
      max_product_pages:
        description: 'New product pages (default 5)'
        required: false
        default: '5'
      max_industry_pages:
        description: 'New industry solution pages (default 5)'
        required: false
        default: '5'
      max_template_blog:
        description: 'Template blog posts (default 8)'
        required: false
        default: '8'
      max_template_case_studies:
        description: 'Template case studies (default 8)'
        required: false
        default: '8'
      trigger_deploy:
        description: 'Trigger deploy after commit (GitHub Pages)'
        required: false
        default: true
        type: boolean

jobs:
  pressure-gate:
    name: Queue pressure preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Skip noncritical scheduled content during Actions pressure
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch bypasses the scheduled-pressure gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          token=os.environ["GH_TOKEN"]
          repo=os.environ["REPOSITORY"]
          current=int(os.environ.get("RUN_ID") or 0)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":f"Bearer {token}",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"zion-scheduled-content-pressure-gate",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload=json.load(response)
          except Exception as exc:
              reason=f"api-unavailable: {type(exc).__name__}"
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
                  f.write("proceed=false\n")
                  f.write(f"reason={reason}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                  f.write("## Scheduled content pressure gate\n\n")
                  f.write(f"- Decision: **skip scheduled content** ({reason})\n")
                  f.write("- The gate fails closed without converting an optional content run into a repository failure.\n")
              print(reason)
              raise SystemExit(0)

          now=datetime.datetime.now(datetime.timezone.utc)
          active_status={"queued","pending","in_progress","waiting","requested"}
          runs=[r for r in payload.get("workflow_runs",[]) if int(r.get("id") or 0)!=current]
          active=[r for r in runs if r.get("status") in active_status]

          def dt(value):
              return datetime.datetime.fromisoformat(value.replace("Z","+00:00")) if value else now

          oldest=max(((now-dt(r.get("created_at"))).total_seconds()/60 for r in active), default=0.0)
          recent=[r for r in runs if (now-dt(r.get("updated_at") or r.get("created_at"))).total_seconds() <= 3600]
          cancelled=[r for r in recent if r.get("conclusion")=="cancelled"]
          critical=len(active)>=35 or oldest>=45 or len(cancelled)>=25
          reason=f"active={len(active)}, oldest={oldest:.1f}m, cancelled60m={len(cancelled)}"
          proceed="false" if critical else "true"

          out=os.environ["GITHUB_OUTPUT"]
          with open(out,"a",encoding="utf-8") as f:
              f.write(f"proceed={proceed}\n")
              f.write(f"reason={reason}\n")
          summary=os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary,"a",encoding="utf-8") as f:
              f.write("## Scheduled content pressure gate\n\n")
              f.write(f"- {reason}\n")
              f.write(f"- Decision: **{'skip scheduled content' if critical else 'proceed'}**\n")
              f.write("- Thresholds mirror the critical queue policy: active>=35, oldest>=45m, cancellations60m>=25.\n")
          print(reason)
          if critical:
              print("Queue pressure is critical; skipping this noncritical scheduled content run before checkout/install/build.")
          PY
  maximum-velocity:
    needs: pressure-gate
    if: needs.pressure-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Record pressure decision
        run: echo "Queue gate: ${{ needs.pressure-gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Restore content runtime cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            automation/reports/.runtime
          key: content-runtime-${{ runner.os }}-${{ hashFiles('automation/openrouter-content-generator.cjs') }}
          restore-keys: |
            content-runtime-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Writer queue guard (wait)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_GUARD_BRANCH: main
          QUEUE_GUARD_WAIT_MAX_MINUTES: "50"
          QUEUE_GUARD_WAIT_POLL_SECONDS: "30"
        run: node scripts/automation/autonomous-writer-queue-guard.cjs --strict --wait

      - name: Run maximum velocity content pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          AUTO_COMMIT: "1"
          TRIGGER_DEPLOY: ${{ github.event.inputs.trigger_deploy != 'false' && '1' || '' }}
#           NETLIFY_BUILD_HOOK removed (Netlify decommissioned → GitHub Pages)
          MAX_BLOG_POSTS: ${{ github.event.inputs.max_blog_posts || '14' }}
          MAX_PRODUCT_PAGES: ${{ github.event.inputs.max_product_pages || '5' }}
          MAX_INDUSTRY_PAGES: ${{ github.event.inputs.max_industry_pages || '5' }}
          MAX_TEMPLATE_BLOG: ${{ github.event.inputs.max_template_blog || '8' }}
          MAX_TEMPLATE_CASE_STUDIES: ${{ github.event.inputs.max_template_case_studies || '8' }}
          MAX_CONCURRENCY: "12"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node automation/ai-ultra-fast-content-pipeline.cjs
          git add -A
          if git diff --staged --quiet; then
            exit 0
          fi
          bash scripts/automation/commit-and-push-main.sh "chore(content): maximum velocity - industry + blog + front page + products"
