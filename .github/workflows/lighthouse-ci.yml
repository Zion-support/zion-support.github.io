name: Lighthouse CI

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

"on":
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'components/**'
      - 'public/**'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'package.json'
      - '.github/workflows/lighthouse-ci.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lighthouse:
    name: Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
          NEXT_BUILD_WORKER_COUNT: "1"
        run: |
          set -euo pipefail
          npm run rsc:guard
          if npm run build; then
            echo "Next.js build succeeded"
          else
            echo "::warning::Next.js build failed (heap OOM on 90k+ file tree); falling back to auditing the static site from the repository root (same content GitHub Pages serves)."
            rm -rf out
          fi

      - name: Serve and audit
        shell: bash
        run: |
          set -euo pipefail
          site_dir=.
          if [ -d out ]; then site_dir=out; fi
          if ! chrome=$(command -v google-chrome || command -v chromium); then
            echo "::error::Lighthouse requires google-chrome or chromium on PATH." >&2
            exit 1
          fi
          "$chrome" --version
          run_dir=$(mktemp -d)
          server_pid=
          chrome_pid=
          cleanup() {
            local status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              tail -n 40 "$run_dir/server.log" "$run_dir/chrome.log" >&2 || true
            fi
            if [ -n "$chrome_pid" ]; then kill "$chrome_pid" 2>/dev/null || true; fi
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            if [ -n "$chrome_pid" ]; then wait "$chrome_pid" 2>/dev/null || true; fi
            if [ -n "$server_pid" ]; then wait "$server_pid" 2>/dev/null || true; fi
            rm -rf "$run_dir"
            exit "$status"
          }
          trap cleanup EXIT

          python3 -m http.server 3000 --bind 127.0.0.1 --directory "$site_dir" > "$run_dir/server.log" 2>&1 &
          server_pid=$!
          "$chrome" --headless --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=0 --user-data-dir="$run_dir/profile" \
            about:blank > "$run_dir/chrome.log" 2>&1 &
          chrome_pid=$!

          site_url=http://127.0.0.1:3000
          chrome_port=
          for _ in {1..45}; do
            kill -0 "$server_pid"
            kill -0 "$chrome_pid"
            if [ -s "$run_dir/profile/DevToolsActivePort" ] &&
              read -r chrome_port < "$run_dir/profile/DevToolsActivePort" &&
              [ -n "$chrome_port" ]; then
              if curl --noproxy '*' --fail --silent --max-time 2 "$site_url/" > /dev/null &&
                curl --noproxy '*' --fail --silent --max-time 2 "http://127.0.0.1:$chrome_port/json/version" > /dev/null; then
                break
              fi
            fi
            chrome_port=
            sleep 1
          done
          if [ -z "$chrome_port" ]; then
            echo "::error::The audit site or Chrome DevTools did not become ready."
            exit 1
          fi

          mkdir -p lighthouse-results
          npx --no-install lighthouse "$site_url" \
            --hostname=127.0.0.1 --port="$chrome_port" \
            --output=json \
            --output=html \
            --output-path=lighthouse-results/report \
            --only-categories=performance,accessibility,best-practices,seo \
            --quiet

      - name: Parse scores
        id: scores
        run: |
          REPORT="lighthouse-results/report.report.json"
          if [ ! -f "$REPORT" ]; then
            echo "No Lighthouse report found"
            exit 1
          fi

          PERF=$(node -e "const r=require('./$REPORT');console.log(Math.round(r.categories.performance.score*100))")
          A11Y=$(node -e "const r=require('./$REPORT');console.log(Math.round(r.categories.accessibility.score*100))")
          BP=$(node -e "const r=require('./$REPORT');console.log(Math.round(r.categories['best-practices'].score*100))")
          SEO=$(node -e "const r=require('./$REPORT');console.log(Math.round(r.categories.seo.score*100))")

          echo "perf=$PERF" >> "$GITHUB_OUTPUT"
          echo "a11y=$A11Y" >> "$GITHUB_OUTPUT"
          echo "bp=$BP" >> "$GITHUB_OUTPUT"
          echo "seo=$SEO" >> "$GITHUB_OUTPUT"

          badge() { [ "$1" -ge 90 ] && echo "🟢" || { [ "$1" -ge 50 ] && echo "🟠" || echo "🔴"; }; }

          {
            echo "## Lighthouse Performance Report"
            echo ""
            echo "| Category | Score |"
            echo "|----------|-------|"
            echo "| $(badge $PERF) Performance | **$PERF** |"
            echo "| $(badge $A11Y) Accessibility | **$A11Y** |"
            echo "| $(badge $BP) Best Practices | **$BP** |"
            echo "| $(badge $SEO) SEO | **$SEO** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const perf = '${{ steps.scores.outputs.perf }}';
            const a11y = '${{ steps.scores.outputs.a11y }}';
            const bp = '${{ steps.scores.outputs.bp }}';
            const seo = '${{ steps.scores.outputs.seo }}';

            const badge = (s) => s >= 90 ? '🟢' : s >= 50 ? '🟠' : '🔴';

            const body = `### Lighthouse Report

            | Category | Score |
            |----------|-------|
            | ${badge(perf)} Performance | **${perf}** |
            | ${badge(a11y)} Accessibility | **${a11y}** |
            | ${badge(bp)} Best Practices | **${bp}** |
            | ${badge(seo)} SEO | **${seo}** |

            > Run #${context.runNumber} on \`${context.sha.substring(0, 7)}\``;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Lighthouse Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on low performance
        run: |
          PERF=${{ steps.scores.outputs.perf }}
          if [ "$PERF" -lt 50 ]; then
            echo "::error::Performance score ($PERF) is below threshold (50)"
            exit 1
          fi

      - name: Upload report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: lighthouse-results/
          retention-days: 14
