name: Apps directory translation and navigation contract

on:
  pull_request:
    paths:
      - 'content/apps-showcase.json'
      - 'scripts/render-apps-showcase.py'
      - 'scripts/test-apps-showcase.py'
      - 'tests/ci/test_apps_directory_contract.py'
      - 'scripts/ci/test-zion-catalog-asset.cjs'
      - 'scripts/prepare-pages-out.sh'
      - 'public/sitemap.xml'
      - 'public/sitemap-0.xml'
      - 'public/apps/apps-sitemap.xml'
      - 'public/assets/css/apps-showcase.css'
      - 'public/assets/js/zion-catalog.js'
      - 'public/index.html'
      - 'public/en/index.html'
      - 'public/pt/index.html'
      - 'public/es/index.html'
      - 'public/fr/index.html'
      - 'public/de/index.html'
      - 'public/apps/index.html'
      - 'public/pt/apps/index.html'
      - 'public/es/apps/index.html'
      - 'public/fr/apps/index.html'
      - 'public/de/apps/index.html'
      - 'public/apps-network-showcase/index.html'
      - 'public/pt/apps-network-showcase/index.html'
      - 'public/es/apps-network-showcase/index.html'
      - 'public/fr/apps-network-showcase/index.html'
      - 'public/de/apps-network-showcase/index.html'
      - 'apps-network-showcase/index.html'
      - '.github/workflows/apps-directory-contract.yml'
  push:
    branches: [main]
    paths:
      - 'content/apps-showcase.json'
      - 'scripts/render-apps-showcase.py'
      - 'scripts/test-apps-showcase.py'
      - 'tests/ci/test_apps_directory_contract.py'
      - 'scripts/ci/test-zion-catalog-asset.cjs'
      - 'scripts/prepare-pages-out.sh'
      - 'public/sitemap.xml'
      - 'public/sitemap-0.xml'
      - 'public/apps/apps-sitemap.xml'
      - 'public/assets/css/apps-showcase.css'
      - 'public/assets/js/zion-catalog.js'
      - 'public/index.html'
      - 'public/en/index.html'
      - 'public/pt/index.html'
      - 'public/es/index.html'
      - 'public/fr/index.html'
      - 'public/de/index.html'
      - 'public/apps/index.html'
      - 'public/pt/apps/index.html'
      - 'public/es/apps/index.html'
      - 'public/fr/apps/index.html'
      - 'public/de/apps/index.html'
      - 'public/apps-network-showcase/index.html'
      - 'public/pt/apps-network-showcase/index.html'
      - 'public/es/apps-network-showcase/index.html'
      - 'public/fr/apps-network-showcase/index.html'
      - 'public/de/apps-network-showcase/index.html'
      - 'apps-network-showcase/index.html'
      - '.github/workflows/apps-directory-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-directory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Validate maintained translations and generated source parity
        run: python3 scripts/test-apps-showcase.py
      - name: Validate current catalog, homepage navigation and sitemap contracts
        run: python3 tests/ci/test_apps_directory_contract.py
      - name: Validate current browser catalog and offline calculator behavior
        run: node scripts/ci/test-zion-catalog-asset.cjs
