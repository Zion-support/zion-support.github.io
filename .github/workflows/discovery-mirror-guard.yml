name: Discovery Mirror Guard

on:
  push:
    branches:
      - main
    paths:
      - 'discovery/index.html'
      - 'public/discovery/index.html'
      - 'public/pt/discovery/index.html'
      - 'public/es/discovery/index.html'
      - 'public/fr/discovery/index.html'
      - 'public/de/discovery/index.html'
      - 'public/assets/js/discovery-delivery.js'
      - 'scripts/test-discovery-delivery-contract.cjs'
      - 'discovery/questionnaire.html'
      - 'public/discovery/questionnaire.html'
      - '.github/workflows/discovery-mirror-guard.yml'
  pull_request:
    paths:
      - 'discovery/index.html'
      - 'public/discovery/index.html'
      - 'public/pt/discovery/index.html'
      - 'public/es/discovery/index.html'
      - 'public/fr/discovery/index.html'
      - 'public/de/discovery/index.html'
      - 'public/assets/js/discovery-delivery.js'
      - 'scripts/test-discovery-delivery-contract.cjs'
      - 'discovery/questionnaire.html'
      - 'public/discovery/questionnaire.html'
      - '.github/workflows/discovery-mirror-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require canonical shared Discovery contract
        shell: bash
        run: |
          set -euo pipefail
          # Production is public/ plus the shared module, not legacy root HTML.
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('public/assets/js/discovery-delivery.js', 'utf8');
          assert(source.includes('https://formsubmit.co/ajax/commercial@ziontechgroup.com'), 'Commercial endpoint missing');
          assert(!source.toLowerCase().includes('carlos@ziontechgroup.com'), 'Unexpected extra recipient');
          assert(!/(^|[^\w])_autoresponse\s*:/m.test(source), 'Unsupported AJAX autoresponse');
          const ids = ['dform','form-errors','rscore','rbar','rsummary','rapps','rnext','report-text','email-fallback','result','copy-report','rsent','submit-report','download-report'];
          for (const [locale, lang] of [['en','en'],['pt','pt-BR'],['es','es'],['fr','fr'],['de','de']]) {
            const file = locale === 'en' ? 'public/discovery/index.html' : 'public/' + locale + '/discovery/index.html';
            const html = fs.readFileSync(file, 'utf8');
            assert(html.includes('<html lang="' + lang + '"'), 'Wrong language: ' + file);
            assert.equal((html.match(/src="\/assets\/js\/discovery-delivery\.js"/g) || []).length, 1, 'One shared application required: ' + file);
            assert(!html.includes('const APPMAP='), 'Obsolete inline application: ' + file);
            assert(!html.includes('data-discovery-parity'), 'Duplicate submit handler: ' + file);
            assert(!html.toLowerCase().includes('carlos@ziontechgroup.com'), 'Unexpected recipient: ' + file);
            for (const id of ids) assert.equal((html.match(new RegExp('id="' + id + '"', 'g')) || []).length, 1, 'Unique element ' + id + ': ' + file);
          }
          console.log('Five canonical questionnaires use one shared application; no email sent.');
          NODE
          for file in public/discovery/index.html public/{pt,es,fr,de}/discovery/index.html; do
            DISCOVERY_HTML="$file" node --test scripts/test-discovery-delivery-contract.cjs
          done
          echo "Canonical Discovery recipients, fallback, duplicate suppression and acceptance wording validated offline."

      - name: Require safe legacy-route redirects
        shell: bash
        run: |
          set -euo pipefail
          for file in 'discovery/questionnaire.html' 'public/discovery/questionnaire.html'; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing legacy-route compatibility redirect: $file"
              exit 1
            fi

            if grep -Eiq '<form([[:space:]>])|formsubmit|_autoresponse|name="(q[0-9]+|email|company|challenge|goal)"' "$file"; then
              echo "::error::Legacy Discovery questionnaire behavior returned in $file. Compatibility routes must redirect only."
              exit 1
            fi

            if ! grep -Fq 'rel="canonical" href="https://ziontechgroup.com/discovery/"' "$file"; then
              echo "::error::Canonical /discovery/ marker missing from $file"
              exit 1
            fi

            if ! grep -Eq 'http-equiv="refresh"[^>]+(/discovery/|https://ziontechgroup.com/discovery/)' "$file"; then
              echo "::error::Compatibility redirect to /discovery/ missing from $file"
              exit 1
            fi
          done
          echo "Legacy routes are safe redirects; canonical /discovery/ remains the single questionnaire."
