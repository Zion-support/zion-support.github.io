name: War Room Pulse
# Retired: preserve the private War Room direction merged in PR #71743.
# Keep this public writer disabled, including manual dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    if: ${{ false }} # Retired: manual dispatch cannot write public ops content
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pulse war room
        run: |
          echo "## CHECK-IN — $(date -u +'%Y-%m-%d %H:%M UTC')" >> ops/STATUS.md
          echo "**Agent:** $AGENT_NAME" >> ops/STATUS.md
          echo "**Session:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> ops/STATUS.md
          echo "" >> ops/STATUS.md
          echo "### Status" >> ops/STATUS.md
          echo "- War Room atualizado via workflow estático" >> ops/STATUS.md
          echo "- Commit: ${{ github.sha }}" >> ops/STATUS.md
          echo "" >> ops/STATUS.md
        env:
          AGENT_NAME: ${{ github.actor }}

      - name: Configurar git
        run: |
          git config user.name "Zion Agent"
          git config user.email "agent@ziontechgroup.com"

      - name: Pull antes de push (evita conflito)
        run: |
          git pull --rebase origin main 2>/dev/null || true

      - name: Commit board updates
        run: |
          git add ops/STATUS.md
          git diff --cached --quiet && echo "Sem mudanças" && exit 0
          git commit -m "war-room: pulso $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push origin main