name: War Room Pulse
# Retired to stop publishing private ops data and eliminate 288 scheduled jobs/day.
# Operations live in the internal Notion War Room, not public issue comments.
on:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: war-room-pulse
  cancel-in-progress: true

jobs:
  pulse:
    # This job is intentionally disabled; preserve history for migration review.
    if: ${{ false }} # Retired: manual dispatch cannot write public ops content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pulse war room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py

      - name: Commit board updates
        # plain git — no third-party action (repo hygiene: SHA-pinned actions only)
        # v2.2 fix: rebase + retry loop so concurrent commits (Hermes, other pulses)
        # no longer fail the run with a non-fast-forward push rejection.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ops/comms/log.json public/ops/comms/state.json public/ops/comms/agents.json || true
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore(ops): war room pulse update [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Push OK on attempt $i"
                break
              fi
              echo "Push rejected (attempt $i) — rebasing onto origin/main and retrying"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "Rebase conflict; abandoning push"; exit 0; }
              sleep $((i * 2))
            done
          fi

