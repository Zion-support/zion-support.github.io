name: War Room Pulse
# One helper: real-time on #71361 comments, 5-min cron backup.
# Does not commit to main (avoids Pages redeploy loops). Never writes DNS.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: war-room-pulse
  cancel-in-progress: true

jobs:
  pulse:
    if: github.event_name != 'issue_comment' || github.event.issue.number == 71361
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pulse war room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py
