name: War Room Pulse
# Real-time: human comments on the war room issue.
# Backup: scheduled pulse every 5 minutes.
# Edits one standing comment — does not commit board JSON to main.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/war_room_pulse.py'
      - '.github/scripts/test_war_room_pulse.py'
      - '.github/workflows/war-room-pulse.yml'
      - '.github/workflows/agent-presence-watchdog.yml'
      - '.github/workflows/static-deploy.yml'
      - 'public/ops/comms/**'
      - 'scripts/checks/war-room-board-check.cjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: war-room-pulse-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip bot comments so Pulse never retriggers itself.
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 71361 &&
        github.event.comment.user.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unit test pulse helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Board prompt guard
        run: node scripts/checks/war-room-board-check.cjs

  pulse:
    needs: test
    if: |
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 71361 &&
          github.event.comment.user.login != 'github-actions[bot]'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pulse war room standing comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py
