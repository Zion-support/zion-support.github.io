name: War Room Pulse
# Real-time: human comments on the war room issue.
# Backup: scheduled pulse every 5 minutes.
# Edits one standing comment — does not commit board JSON to main.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/war_room_pulse.py'
      - '.github/scripts/test_war_room_pulse.py'
      - '.github/workflows/war-room-pulse.yml'
      - '.github/workflows/agent-presence-watchdog.yml'
      - '.github/workflows/static-deploy.yml'
      - 'public/ops/comms/**'
      - 'scripts/checks/war-room-board-check.cjs'

permissions:
  contents: read
  issues: write

concurrency:
  # One group per ref — not per event_name. Cron and issue_comment both
  # PATCH the #71361 body; splitting groups lets them race and lose updates.
  # PR runs stay isolated (github.ref is refs/pull/N/merge).
  group: war-room-pulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Tests are a PR/manual gate only. Cron must not spend a runner on
    # unittest every 5 minutes — that queue is what stops other agents.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Unit test pulse helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Board prompt guard
        run: node scripts/checks/war-room-board-check.cjs

  pulse:
    # Independent of the test job so a skipped PR gate cannot skip cron.
    if: |
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.number == 71361 &&
          github.event.comment.user.login != 'github-actions[bot]'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pulse war room standing comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C094KS4ALM6
        run: python3 .github/scripts/war_room_pulse.py
