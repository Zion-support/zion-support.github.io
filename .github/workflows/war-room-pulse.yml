name: War Room Pulse
# Real-time: runs on every new comment on the war room issue.
# Backup: scheduled pulse every 5 minutes.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: war-room-pulse
  cancel-in-progress: true

jobs:
  pulse:
    # On issue_comment events only run for the war room issue; schedule/dispatch always run.
    if: github.event_name != 'issue_comment' || github.event.issue.number == 71361
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pulse war room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py

      - name: Commit board updates
        # plain git — no third-party action (repo hygiene: SHA-pinned actions only)
        # Hardened push: fetch + rebase origin/main, abort stuck rebases between
        # attempts, and degrade to a warning instead of failing the workflow —
        # the 5-min schedule retries anyway, and the durable log is issue #71361.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ops/comms/log.json public/ops/comms/state.json public/ops/comms/agents.json || true
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore(ops): war room pulse update [skip ci]"
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "Push succeeded on attempt $i"
                ok=1
                break
              fi
              git rebase --abort || true
              echo "Push attempt $i failed; retrying after backoff"
              sleep $((i * 5))
            done
            if [ "$ok" -ne 1 ]; then
              echo "::warning::Board push failed after 8 attempts (non-fast-forward race); next scheduled pulse will retry."
            fi
          fi
