name: War Room Pulse
# Real-time: runs on every new comment on the war room issue.
# Backup: scheduled pulse every 5 minutes.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: war-room-pulse
  cancel-in-progress: true

jobs:
  pulse:
    # On issue_comment events only run for the war room issue; schedule/dispatch always run.
    if: github.event_name != 'issue_comment' || github.event.issue.number == 71361
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pulse war room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py

      - name: Commit board updates
        # plain git — no third-party action (repo hygiene: SHA-pinned actions only)
        # rebase + retry loop: concurrent scheduled bots push to main, causing
        # non-fast-forward rejections ("fetch first"). Rebase before each retry.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ops/comms/log.json public/ops/comms/state.json public/ops/comms/agents.json || true
          if git diff --cached --quiet; then
            echo "No board changes."
          else
            git commit -m "chore(ops): war room pulse update [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push attempt $i failed; retrying after backoff"
              sleep $((i * 5))
              if [ "$i" -eq 5 ]; then
                echo "::error::Push failed after 5 attempts"
                exit 1
              fi
            done
          fi
