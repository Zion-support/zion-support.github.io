name: War Room Pulse
# Real-time: runs on every new comment on the war room issue.
# Backup: scheduled pulse every 5 minutes.
on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: war-room-pulse
  cancel-in-progress: true

jobs:
  pulse:
    # On issue_comment events only run for the war room issue; schedule/dispatch always run.
    if: github.event_name != 'issue_comment' || github.event.issue.number == 71361
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pulse war room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py

      - name: Commit board updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ops): war room pulse update [skip ci]'
          file_pattern: 'public/ops/comms/log.json public/ops/comms/state.json public/ops/comms/agents.json'
