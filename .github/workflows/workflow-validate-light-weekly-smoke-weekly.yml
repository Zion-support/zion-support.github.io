# Ensures weekly reusable CI wiring, schedule, and the validation job's timeout.
name: workflow validate light weekly smoke (weekly)
permissions:
  contents: read
"on":
  schedule:
    - cron: '52 8 * * 4' # Thursdays 08:52 UTC
  workflow_dispatch:
concurrency:
  group: workflow-validate-light-weekly-smoke-weekly
  cancel-in-progress: true
jobs:
  validate-light-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: workflow-validate-light-weekly.yml anchors
        run: |
          set -euo pipefail
          f=.github/workflows/workflow-validate-light-weekly.yml
          test -f "$f"
          test -s "$f"
          grep -Fq 'name: Workflow validate light (weekly)' "$f"
          grep -Fq "cron: '35 11 * * 3'" "$f"
          grep -Fq 'group: workflow-validate-light-weekly' "$f"
          grep -Fxq '    uses: ./.github/workflows/reusable-workflow-ci.yml' "$f"
          if grep -Eq '^    timeout-minutes:' "$f"; then
            echo '::error::Reusable-workflow caller must not set timeout-minutes'
            exit 1
          fi
          reusable=.github/workflows/reusable-workflow-ci.yml
          test -s "$reusable"
          grep -Fxq '  workflow_call:' "$reusable"
          validate_job=$(awk '/^  validate:$/ {in_job=1; next} in_job && /^  [^ ]/ {exit} in_job {print}' "$reusable")
          grep -Fxq '    timeout-minutes: 14' <<< "$validate_job"
          grep -Fxq '        run: npm run automation:preflight' <<< "$validate_job"
          echo "ok: $f"
