name: Minimal Build Test
"on":
  workflow_dispatch:
  push:
    branches:
    - main
    paths-ignore:
    - 'STATUS.md'
    - 'automation/reports/**'
    - 'public/ops/**'
jobs:
  minimal:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: npm
    - run: rm -rf node_modules .next out
    - run: npm install
    # Turbopack (Next 16 default) uses far less memory than webpack on this repo; webpack OOMs even at 6GB heap
    - run: npx next build
    timeout-minutes: 30
