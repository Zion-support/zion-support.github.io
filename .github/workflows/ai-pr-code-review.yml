name: AI PR Code Review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Get diff
        id: diff
        run: |
          DIFF_FILE=$(mktemp)
          trap 'rm -f "$DIFF_FILE"' EXIT
          git diff origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.css' '*.yml' '*.yaml' '*.json' \
            ':!package-lock.json' ':!*.lock' ':!.next/**' ':!out/**' > "$DIFF_FILE"
          DIFF=$(head -c 12000 "$DIFF_FILE")
          if [ -z "$DIFF" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            EOF_MARKER=$(openssl rand -hex 16)
            {
              echo "content<<${EOF_MARKER}"
              echo "$DIFF"
              echo "${EOF_MARKER}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: AI Review via OpenRouter
        if: steps.diff.outputs.empty == 'false'
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DIFF_CONTENT=$(cat <<'DIFF_END'
          ${{ steps.diff.outputs.content }}
          DIFF_END
          )

          PAYLOAD=$(printf '%s\n' "$DIFF_CONTENT" | python3 -c '
          import json
          import sys

          payload = {
            "model": "openrouter/auto",
            "max_tokens": 2048,
            "messages": [
              {
                "role": "system",
                "content": "You are a senior code reviewer for a Next.js 15 App Router static-export website (TypeScript, Tailwind CSS). Review the git diff and provide actionable feedback. Focus on: bugs, security issues, performance problems, TypeScript errors, accessibility concerns, and SEO impact. Be concise. Use markdown formatting. If the code looks good, say so briefly."
              },
              {
                "role": "user",
                "content": "Review this pull request diff:\n\n" + sys.stdin.read()
              }
            ]
          }
          print(json.dumps(payload))
          ')

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          if HTTP_STATUS=$(curl -sS --max-time 60 \
            --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/${{ github.repository }}" \
            -H "X-Title: ZionTechGroup-CI" \
            -d "$PAYLOAD" \
            https://openrouter.ai/api/v1/chat/completions); then
            :
          else
            CURL_EXIT_CODE=$?
            printf '::error::OpenRouter request failed (curl exit %s, HTTP %s).\n' "$CURL_EXIT_CODE" "$HTTP_STATUS" >&2
            exit "$CURL_EXIT_CODE"
          fi

          REVIEW=$(OPENROUTER_HTTP_STATUS="$HTTP_STATUS" python3 - "$RESPONSE_FILE" <<'PY_RESPONSE'
          import json
          import os
          import sys

          status = os.environ['OPENROUTER_HTTP_STATUS']

          def safe_field(value):
              if value is None:
                  return None
              if not isinstance(value, (str, int, float, bool)):
                  return '[non-scalar]'
              text = str(value)
              key = os.environ.get('OPENROUTER_API_KEY', '')
              if key:
                  text = text.replace(key, '[redacted]')
              return text[:300]

          try:
              with open(sys.argv[1], encoding='utf-8') as response_file:
                  data = json.load(response_file)
          except (OSError, UnicodeError, json.JSONDecodeError):
              print('OpenRouter response: ' + json.dumps({'http_status': status}), file=sys.stderr)
              print('::error::OpenRouter returned invalid JSON.', file=sys.stderr)
              sys.exit(1)

          data = data if isinstance(data, dict) else {}
          choices = data.get('choices')
          choice = choices[0] if isinstance(choices, list) and choices and isinstance(choices[0], dict) else {}
          top_error = data.get('error')
          choice_error = choice.get('error')
          error = top_error if top_error is not None else choice_error
          error_fields = error if isinstance(error, dict) else {}
          finish_reason = choice.get('finish_reason')
          print('OpenRouter response: ' + json.dumps({
              'http_status': status,
              'error_code': safe_field(error_fields.get('code')),
              'error_message': safe_field(error_fields.get('message')),
              'finish_reason': safe_field(finish_reason),
          }), file=sys.stderr)

          if top_error is not None or choice_error is not None or finish_reason == 'error':
              print('::error::OpenRouter returned an error response.', file=sys.stderr)
              sys.exit(1)
          if len(status) != 3 or not status.isdigit() or not 200 <= int(status) < 300:
              print('::error::OpenRouter returned an unsuccessful HTTP status.', file=sys.stderr)
              sys.exit(1)
          message = choice.get('message')
          content = message.get('content') if isinstance(message, dict) else None
          if not isinstance(content, str) or not content.strip():
              print('::error::OpenRouter response did not contain non-empty review text.', file=sys.stderr)
              sys.exit(1)
          print(content)
          PY_RESPONSE
          )

          EOF_MARKER=$(openssl rand -hex 16)
          {
            echo "body<<${EOF_MARKER}"
            echo "$REVIEW"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        id: comment
        if: steps.diff.outputs.empty == 'false' && steps.review.outputs.body != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const review = `### AI Code Review

            ${{ steps.review.outputs.body }}

            ---
            > Automated review via OpenRouter AI | Run #${context.runNumber}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### AI Code Review')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: review,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: review,
              });
            }

      - name: Summary
        if: always()
        run: |
          {
            echo "## AI PR Code Review"
            echo ""
            if [ "${{ steps.diff.outputs.empty }}" = "true" ]; then
              echo "No reviewable code changes detected."
            elif [ "${{ steps.review.outcome }}" = "success" ] && [ "${{ steps.comment.outcome }}" = "success" ]; then
              echo "AI review completed and posted as PR comment."
            else
              echo "AI review did not complete successfully; check the failed or skipped steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
