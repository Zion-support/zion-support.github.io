# Ensures the current sitemap implementation remains non-empty and canonical.

name: app sitemap smoke (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '53 7 * * 2' # Tuesdays 07:53 UTC
  workflow_dispatch:

concurrency:
  group: workflow-app-sitemap-smoke-weekly
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate current sitemap implementation
        run: |
          set -euo pipefail
          if [ -s app/sitemap.ts ]; then
            grep -Fq "https://ziontechgroup.com" app/sitemap.ts
            echo 'ok: app/sitemap.ts'
          elif [ -s app/sitemap.xml ]; then
            grep -Fq '<urlset' app/sitemap.xml
            grep -Fq 'https://ziontechgroup.com/' app/sitemap.xml
            echo 'ok: app/sitemap.xml'
          elif [ -s public/sitemap.xml ]; then
            grep -Fq '<urlset' public/sitemap.xml
            grep -Fq 'https://ziontechgroup.com/' public/sitemap.xml
            echo 'ok: public/sitemap.xml'
          else
            echo '::error::no supported sitemap implementation found'
            exit 1
          fi
