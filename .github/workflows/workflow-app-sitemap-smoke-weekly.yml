# Ensures the static sitemap keeps the canonical site URL (grep-only).
# Updated 2026-09-29: app/sitemap.ts was replaced by static app/sitemap.xml.

name: app/sitemap smoke (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '53 7 * * 2' # Tuesdays 07:53 UTC
  workflow_dispatch:

concurrency:
  group: workflow-app-sitemap-smoke-weekly
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: sitemap static export shape
        run: |
          set -euo pipefail
          if [ -f app/sitemap.xml ]; then
            test -s app/sitemap.xml
            grep -Fq 'ziontechgroup.com' app/sitemap.xml
            grep -Eq '<urlset|<sitemapindex' app/sitemap.xml
            echo '/ok: app/sitemap.xml'
          elif [ -f app/sitemap.ts ]; then
            test -s app/sitemap.ts
            grep -Fq "export const dynamic = 'force-static'" app/sitemap.ts
            grep -Fq 'export default function sitemap' app/sitemap.ts
            grep -Fq 'MetadataRoute.Sitemap' app/sitemap.ts
            grep -Fq "const baseUrl = 'https://ziontechgroup.com'" app/sitemap.ts
            echo '/ok: app/sitemap.ts'
          else
            echo '::error::No sitemap found (expected app/sitemap.xml or app/sitemap.ts)'
            exit 1
          fi
