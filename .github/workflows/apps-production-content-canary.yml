name: Apps production content canary

"on":
  schedule:
    - cron: '41 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: apps-production-content-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live routes and semantic markers
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, urllib.request
          from urllib.error import HTTPError, URLError

          base='https://ziontechgroup.com'
          checks={
            '/': ['Apps'],
            '/apps/': ['Zion Apps Network','Free Discovery','Operations &amp; Reliability'],
            '/pt/apps/': ['Discovery gratuito','Operações'],
            '/es/apps/': ['Discovery gratuito','Operaciones'],
            '/fr/apps/': ['Discovery gratuit','Opérations'],
            '/de/apps/': ['Discovery','Operations'],
            '/discovery/': ['Free AI & Automation Discovery','No payment or meeting is required.'],
            '/pt/discovery/': ['Discovery'],
            '/es/discovery/': ['Discovery'],
            '/fr/discovery/': ['Discovery'],
            '/de/discovery/': ['Discovery'],
            '/apps/operations-reliability-ai-2026.html': ['Operations','Reliability'],
            '/zion-app-network/app-network-operations-evidence-checklist-2026.html': ['Operations Evidence Checklist 2026'],
            '/sitemap.xml': ['sitemapindex','apps/apps-sitemap.xml'],
            '/apps/apps-sitemap.xml': ['operations-reliability-ai-2026','/pt/apps/'],
          }
          headers={'User-Agent':'Zion-Apps-Production-Canary/1.0'}
          failures=[]
          for path,markers in checks.items():
            url=base+path
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as resp:
                status=resp.status
                body=resp.read(2_000_000).decode('utf-8','replace')
              if status!=200:
                failures.append(f'{path}: HTTP {status}')
                continue
              missing=[m for m in markers if m not in body]
              if missing:
                failures.append(f'{path}: missing markers {missing}')
              else:
                print(f'OK {path} HTTP 200 markers={len(markers)}')
            except (HTTPError,URLError,TimeoutError) as exc:
              failures.append(f'{path}: {exc}')
          if failures:
            for item in failures:
              print(f'::error::{item}')
            Path=None
            open('apps-canary-failures.txt','w',encoding='utf-8').write('\n'.join(failures)+'\n')
            sys.exit(1)
          PY

      - name: Open deduped issue on canary failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title='Apps production content canary failed';
            const marker='<!-- apps-production-content-canary -->';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',labels:'automation',per_page:100});
            const existing=issues.find(i=>i.title===title || (i.body||'').includes(marker));
            const body=marker+'\nLive Apps/i18n content or sitemap markers failed. Review the latest workflow run before changing source.\n\nRun: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            if(existing){
              await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body});
            } else {
              await github.rest.issues.create({...context.repo,title,body,labels:['automation','bug']});
            }

      - name: Close prior canary issue on recovery
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title='Apps production content canary failed';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',labels:'automation',per_page:100});
            for(const issue of issues.filter(i=>i.title===title)){
              await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body:'Recovered: production Apps content canary is green on run '+context.runId+'.'});
              await github.rest.issues.update({...context.repo,issue_number:issue.number,state:'closed'});
            }
