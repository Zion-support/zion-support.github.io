name: Productivity navigation scoped contract
on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  scoped-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-productivity-navigation.cjs
      - run: node scripts/test-productivity-pipeline.cjs
