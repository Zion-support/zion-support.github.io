name: Apps rollback readiness

"on":
  workflow_run:
    workflows:
      - AI Post Push Route Verify
    types: [completed]
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apps-rollback-readiness.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'apps-rollback-readiness' || format('apps-rollback-readiness-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  readiness:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve last known good release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ai-post-push-route-verify.yml/runs?branch=main&status=success&per_page=50" > /tmp/verifiers.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/main" > /tmp/main.json

          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))

          def utc_time(value):
              if not isinstance(value,str):
                  return None
              try:
                  parsed=datetime.fromisoformat(value.replace('Z','+00:00'))
              except ValueError:
                  return None
              return parsed.astimezone(timezone.utc) if parsed.tzinfo is not None else None

          def jobs_for(run):
              result=api(f"repos/{repo}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100")
              jobs=result.get('jobs',[])
              if result.get('total_count') != len(jobs):
                  raise RuntimeError(f"Incomplete job evidence for run {run['id']}")
              return jobs

          verifies=json.load(open('/tmp/verifiers.json',encoding='utf-8')).get('workflow_runs',[])
          main=json.load(open('/tmp/main.json',encoding='utf-8'))

          # A successful source-gate-only run did not publish a Pages artifact.
          # Require the actual deployment step in the latest attempt of each configured publisher.
          published=[]
          for workflow in ('gh-pages.yml','static-deploy.yml','deploy-on-push.yml'):
              result=api(f'repos/{repo}/actions/workflows/{workflow}/runs?branch=main&status=success&per_page=20')
              runs=result.get('workflow_runs') if isinstance(result,dict) else None
              total=result.get('total_count') if isinstance(result,dict) else None
              if not isinstance(runs,list) or type(total) is not int or total < 0 or len(runs) != min(total,20):
                  raise RuntimeError(f"Incomplete or invalid publisher run listing for {workflow}")
              for run in runs:
                  if run.get('head_branch') != 'main' or run.get('status') != 'completed' or run.get('conclusion') != 'success':
                      raise RuntimeError(f"Inconsistent successful publisher run {run.get('id')}")
                  deploy_jobs=[job for job in jobs_for(run) if job.get('name') == 'deploy']
                  if not deploy_jobs:
                      raise RuntimeError(f"Missing deploy job evidence for run {run['id']}")
                  for job in deploy_jobs:
                      if job.get('status') == 'completed' and job.get('conclusion') == 'skipped':
                          continue
                      if job.get('status') != 'completed' or job.get('conclusion') != 'success':
                          raise RuntimeError(f"Incomplete or unsuccessful deploy job {job.get('id')} for run {run['id']}")
                      steps=job.get('steps')
                      if not isinstance(steps,list):
                          raise RuntimeError(f"Missing deployment steps for job {job.get('id')}")
                      publish_steps=[step for step in steps
                                     if step.get('name') == 'Deploy to GitHub Pages'
                                     or (isinstance(step.get('name'),str) and step['name'].startswith('Run actions/deploy-pages@'))]
                      if len(publish_steps) != 1:
                          raise RuntimeError(f"Expected one Pages deployment step for job {job.get('id')}")
                      step=publish_steps[0]
                      if step.get('status') == 'completed' and step.get('conclusion') == 'skipped':
                          continue
                      completed=utc_time(step.get('completed_at'))
                      if step.get('status') != 'completed' or step.get('conclusion') != 'success' or completed is None:
                          raise RuntimeError(f"Incomplete or invalid deployment step for job {job.get('id')}")
                      published.append((completed,run,job,step))

          if not published:
              print('::error::No executed successful Pages deployment found in the latest successful publisher runs')
              sys.exit(1)

          deploy_finished,deploy,deploy_job,deploy_step=max(published,key=lambda item:item[0])
          deploy_done=deploy_step['completed_at']
          # The critical route probe itself must run after the actual publication.
          # A late run.updated_at or advisory promoted-route result is not that proof.
          verified=[]
          for run in verifies:
              updated=utc_time(run.get('updated_at'))
              if run.get('head_branch') != 'main' or run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  continue
              if updated is None or updated < deploy_finished:
                  continue
              for job in jobs_for(run):
                  if job.get('status') != 'completed' or job.get('conclusion') != 'success':
                      continue
                  for step in job.get('steps',[]):
                      started=utc_time(step.get('started_at'))
                      completed=utc_time(step.get('completed_at'))
                      if (step.get('name') == 'Verify critical Apps release routes'
                              and step.get('status') == 'completed' and step.get('conclusion') == 'success'
                              and started is not None and completed is not None
                              and started >= deploy_finished and completed >= started):
                          verified.append((completed,run,job,step))
          if not verified:
              print('::error::No successful critical Apps route probe executed after the latest Pages publication')
              sys.exit(1)
          _,verifier,verifier_job,verifier_step=max(verified,key=lambda item:item[0])

          deployed_sha=deploy['head_sha']
          main_sha=main['sha']
          compare_url=f"https://api.github.com/repos/{repo}/compare/{deployed_sha}...{main_sha}"
          req=urllib.request.Request(compare_url,headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'Zion-Apps-Rollback-Readiness/1.0',
          })
          with urllib.request.urlopen(req,timeout=20) as resp:
              compare=json.load(resp)

          report={
              'schema':'zion.apps.rollback-readiness.v1',
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'repository':repo,
              'main_sha':main_sha,
              'last_successful_deploy':{
                  'run_id':deploy['id'],
                  'workflow_path':deploy['path'],
                  'run_attempt':deploy.get('run_attempt'),
                  'deployment_job_id':deploy_job['id'],
                  'deployment_step':deploy_step['name'],
                  'deployment_completed_at':deploy_done,
                  'head_sha':deployed_sha,
                  'created_at':deploy.get('created_at'),
                  'updated_at':deploy.get('updated_at'),
                  'html_url':deploy.get('html_url'),
              },
              'post_deploy_verifier':{
                  'run_id':verifier['id'],
                  'verification_job_id':verifier_job['id'],
                  'verification_step':verifier_step['name'],
                  'verification_started_at':verifier_step['started_at'],
                  'verification_completed_at':verifier_step['completed_at'],
                  'scope':'Critical Apps routes only; promoted-route advisories require separate review',
                  'head_sha':verifier['head_sha'],
                  'created_at':verifier.get('created_at'),
                  'updated_at':verifier.get('updated_at'),
                  'html_url':verifier.get('html_url'),
              },
              'drift_from_deployed_to_main':{
                  'status':compare.get('status'),
                  'ahead_by':compare.get('ahead_by'),
                  'behind_by':compare.get('behind_by'),
                  'total_commits':compare.get('total_commits'),
              },
              'rollback_candidate_sha':deployed_sha,
              'automatic_rollback_allowed':False,
              'operator_note':'Use this SHA only as evidence for incident review; require human approval and current incident evidence before any revert.',
          }
          out=Path('automation/reports/apps-rollback-readiness.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(f"Last known good deploy: {deploy['id']} @ {deployed_sha}")
          print(f"Executed deployment: job {deploy_job['id']}, {deploy_step['name']}, completed {deploy_done}")
          print(f"Post-deploy verifier: {verifier['id']} @ {verifier['head_sha']}")
          print(f"Executed critical route probe: job {verifier_job['id']}, started {verifier_step['started_at']}, completed {verifier_step['completed_at']}")
          print(f"Main drift: ahead_by={compare.get('ahead_by')} status={compare.get('status')}")
          PY

      - name: Upload rollback readiness ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-rollback-readiness-${{ github.run_id }}
          path: automation/reports/apps-rollback-readiness.json
          if-no-files-found: error
          retention-days: 30
