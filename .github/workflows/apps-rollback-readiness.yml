name: Apps rollback readiness

"on":
  workflow_run:
    workflows:
      - AI Post Push Route Verify
    types: [completed]
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apps-rollback-readiness.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: apps-rollback-readiness
  cancel-in-progress: true

jobs:
  readiness:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve last known good release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p automation/reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gh-pages.yml/runs?branch=main&status=success&per_page=20" > /tmp/deploys.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/static-deploy.yml/runs?branch=main&status=success&per_page=20" > /tmp/static-deploys.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ai-post-push-route-verify.yml/runs?branch=main&status=success&per_page=50" > /tmp/verifiers.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/main" > /tmp/main.json

          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError

          repo=os.environ['GITHUB_REPOSITORY']
          headers={
              'Accept':'application/vnd.github+json',
              'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'Zion-Apps-Rollback-Readiness/1.0',
          }
          def api_json(path):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as resp:
                  return json.load(resp)

          def jobs_for(run_id):
              jobs=[]
              page=1
              while True:
                  for attempt in range(3):
                      try:
                          data=api_json(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100&page={page}')
                          break
                      except HTTPError as error:
                          if error.code != 502 or attempt == 2:
                              raise
                          time.sleep(attempt + 1)
                  batch=data.get('jobs')
                  if not isinstance(batch,list):
                      raise ValueError(f'Missing deployment job evidence for run {run_id}')
                  jobs.extend(batch)
                  if len(batch) < 100:
                      return jobs
                  page+=1

          # Match the confidence gate: success may mean publication was skipped.
          publishers=(
              ('gh-pages.yml','Deploy to GitHub Pages','/tmp/deploys.json'),
              ('static-deploy.yml','Run actions/deploy-pages@v4','/tmp/static-deploys.json'),
          )
          deploys=[]
          for workflow,step_name,history in publishers:
              for run in json.load(open(history,encoding='utf-8')).get('workflow_runs',[]):
                  if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                      continue
                  # API errors or unknown metadata must not expose an older PASS.
                  jobs=[job for job in jobs_for(run['id']) if job.get('name') == 'deploy']
                  if not jobs:
                      raise ValueError(f"Missing deployment job for run {run['id']}")
                  for job in jobs:
                      if job.get('status') == 'completed' and job.get('conclusion') == 'skipped':
                          continue
                      if job.get('status') != 'completed' or job.get('conclusion') != 'success':
                          raise ValueError(f"Unverified deployment job for run {run['id']}")
                      if not isinstance(job.get('steps'),list):
                          raise ValueError(f"Missing deployment steps for run {run['id']}")
                      steps=[step for step in job['steps'] if step.get('name') == step_name]
                      if len(steps) != 1:
                          raise ValueError(f"Missing or ambiguous deployment step for run {run['id']}")
                      step=steps[0]
                      if step.get('status') == 'completed' and step.get('conclusion') == 'skipped':
                          continue
                      if step.get('status') != 'completed' or step.get('conclusion') != 'success':
                          raise ValueError(f"Unverified deployment step for run {run['id']}")
                      completed_at=step.get('completed_at') or ''
                      completed=datetime.fromisoformat(completed_at.replace('Z','+00:00'))
                      if completed.utcoffset() is None:
                          raise ValueError(f"Missing deployment completion timezone for run {run['id']}")
                      if not re.fullmatch(r'[0-9a-f]{40}',run.get('head_sha') or '') or job.get('head_sha') != run['head_sha']:
                          raise ValueError(f"Unverified deployment source commit for run {run['id']}")
                      deploys.append((completed,run,{
                          'workflow_id':run['workflow_id'],
                          'workflow_path':run.get('path') or '.github/workflows/'+workflow,
                          'run_attempt':run.get('run_attempt'),
                          'job_id':job['id'],
                          'job_name':job['name'],
                          'job_url':job.get('html_url'),
                          'step_name':step_name,
                          'completed_at':completed_at,
                      }))

          verifies=json.load(open('/tmp/verifiers.json',encoding='utf-8')).get('workflow_runs',[])
          main=json.load(open('/tmp/main.json',encoding='utf-8'))
          if not deploys:
              print('::error::No successful executed Pages deployment found in the two publisher histories')
              sys.exit(1)

          _,deploy,deployment_evidence=max(deploys,key=lambda item:item[0])
          deploy_done=deployment_evidence['completed_at']
          candidates=[v for v in verifies if (v.get('updated_at') or v.get('created_at')) >= deploy_done]
          verifier=candidates[0] if candidates else None
          if verifier is None:
              print('::error::No successful post-deploy route verification found after latest successful deploy')
              sys.exit(1)

          deployed_sha=deploy['head_sha']
          main_sha=main['sha']
          compare=api_json(f'compare/{deployed_sha}...{main_sha}')

          report={
              'schema':'zion.apps.rollback-readiness.v1',
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'repository':repo,
              'main_sha':main_sha,
              'last_successful_deploy':{
                  **deployment_evidence,
                  'run_id':deploy['id'],
                  'head_sha':deployed_sha,
                  'created_at':deploy.get('created_at'),
                  'updated_at':deploy.get('updated_at'),
                  'html_url':deploy.get('html_url'),
              },
              'post_deploy_verifier':{
                  'run_id':verifier['id'],
                  'head_sha':verifier['head_sha'],
                  'created_at':verifier.get('created_at'),
                  'updated_at':verifier.get('updated_at'),
                  'html_url':verifier.get('html_url'),
              },
              'drift_from_deployed_to_main':{
                  'status':compare.get('status'),
                  'ahead_by':compare.get('ahead_by'),
                  'behind_by':compare.get('behind_by'),
                  'total_commits':compare.get('total_commits'),
              },
              'rollback_candidate_sha':deployed_sha,
              'automatic_rollback_allowed':False,
              'operator_note':'Use this SHA only as evidence for incident review; require human approval and current incident evidence before any revert.',
          }
          out=Path('automation/reports/apps-rollback-readiness.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(f"Last known good deploy: {deploy['id']} @ {deployed_sha}")
          print(f"Post-deploy verifier: {verifier['id']} @ {verifier['head_sha']}")
          print(f"Main drift: ahead_by={compare.get('ahead_by')} status={compare.get('status')}")
          PY

      - name: Upload rollback readiness ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-rollback-readiness-${{ github.run_id }}
          path: automation/reports/apps-rollback-readiness.json
          if-no-files-found: error
          retention-days: 30
