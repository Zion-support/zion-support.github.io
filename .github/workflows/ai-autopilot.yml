name: AI Services Autopilot

# Manual only. Daily cron disabled 15 Sep 2026: this job rewrites
# public/index.html and would re-publish client prices / confidential copy.
# Run via workflow_dispatch if Kleber wants a trends refresh.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-autopilot
  cancel-in-progress: true

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run AI research autopilot
        run: python3 scripts/ai_autopilot.py

      - name: Commit homepage updates
        run: |
          git config user.name "zion-ai-autopilot"
          git config user.email "kleber@ziontechgroup.com"
          git add public/index.html cron_output/ai_autopilot.log
          if git diff --cached --quiet; then
            echo "No homepage changes - skipping commit"
          else
            git commit -m "chore(autopilot): refresh AI services trends $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
