name: Performance budget offline regression
'on':
  pull_request:
    paths:
      - '.github/workflows/performance-budget.yml'
      - '.github/workflows/performance-budget-regression.yml'
      - 'automation/performance-budget-enforcer.cjs'
      - 'tests/test-performance-metrics.cjs'
      - 'tests/performance_budget/**'
permissions:
  contents: read
jobs:
  performance-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public event without stored credentials
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid checkout candidate SHA."
            exit 1
          fi
          if [[ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            echo "::error::Checkout requires an empty workspace; existing files were not changed."
            exit 1
          fi
          git init --quiet
          git remote add origin https://github.com/Zion-support/zion-support.github.io.git
          git -c credential.helper= fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git checkout --detach FETCH_HEAD
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out revision differs from publication candidate."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '22'
      - name: Offline performance regression tests
        run: |
          python3 -I -m unittest discover -s tests/performance_budget -p 'test_*.py' -v
          node tests/test-performance-metrics.cjs automation/performance-budget-enforcer.cjs
