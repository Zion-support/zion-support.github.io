name: GitHub Actions queue pressure

"on":
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-queue-pressure.yml'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: actions-queue-pressure
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure repository Actions backlog
        id: pressure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,sys,urllib.request
          from pathlib import Path

          repo=os.environ['GH_REPOSITORY']
          token=os.environ['GH_TOKEN']
          now=datetime.datetime.now(datetime.timezone.utc)
          headers={
            'Authorization':'Bearer '+token,
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'Zion-Actions-Queue-Pressure/1.0',
          }

          def api(path):
            req=urllib.request.Request('https://api.github.com'+path,headers=headers)
            with urllib.request.urlopen(req,timeout=20) as resp:
              return json.load(resp)

          runs=[]
          for page in range(1,4):
            data=api(f'/repos/{repo}/actions/runs?per_page=100&page={page}')
            batch=data.get('workflow_runs',[])
            runs.extend(batch)
            if len(batch)<100: break

          push_runs=[]
          for page in range(1,6):
            data=api(f'/repos/{repo}/actions/runs?event=push&per_page=100&page={page}')
            batch=data.get('workflow_runs',[])
            push_runs.extend(batch)
            if len(batch)<100: break

          active=[r for r in runs if r.get('status') in {'queued','pending','in_progress','waiting','requested'}]
          queued=[r for r in active if r.get('status') in {'queued','pending','waiting','requested'}]
          in_progress=[r for r in active if r.get('status')=='in_progress']

          recent_cutoff=now-datetime.timedelta(minutes=15)
          def created_dt(run):
            raw=run.get('created_at')
            if not raw: return None
            try:
              return datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
            except Exception:
              return None
          recent=[r for r in runs if (created_dt(r) and created_dt(r)>=recent_cutoff)]
          recent_push=[r for r in push_runs if (created_dt(r) and created_dt(r)>=recent_cutoff)]
          recent_cancelled=[r for r in recent if r.get('conclusion')=='cancelled']
          recent_cancelled_push=[r for r in recent_push if r.get('conclusion')=='cancelled']

          def age_minutes(run):
            raw=run.get('created_at') or run.get('run_started_at')
            if not raw: return 0.0
            dt=datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
            return max(0.0,(now-dt).total_seconds()/60)

          oldest=max((age_minutes(r) for r in queued),default=0.0)
          queue_count=len(queued)
          active_count=len(active)
          by_workflow={}
          for run in queued:
            name=run.get('name') or 'unknown'
            path=run.get('path') or ''
            event=run.get('event') or 'unknown'
            head_branch=run.get('head_branch') or ''
            key=(name,path)
            entry=by_workflow.setdefault(key,{
              'workflow':name,
              'path':path,
              'queued':0,
              'oldest_minutes':0.0,
              'events':{},
              'branches':{},
            })
            entry['queued']+=1
            entry['oldest_minutes']=max(entry['oldest_minutes'],age_minutes(run))
            entry['events'][event]=entry['events'].get(event,0)+1
            if head_branch:
              entry['branches'][head_branch]=entry['branches'].get(head_branch,0)+1
          top_workflows=sorted(by_workflow.values(),key=lambda x:(-x['queued'],-x['oldest_minutes'],x['workflow']))[:10]
          for entry in top_workflows:
            entry['oldest_minutes']=round(entry['oldest_minutes'],1)

          def workflow_text(path):
            if not path or not path.startswith('.github/workflows/'):
              return ''
            try:
              data=api(f'/repos/{repo}/contents/{path}?ref=main')
              import base64
              return base64.b64decode(data.get('content','')).decode('utf-8','replace')
            except Exception:
              return ''

          missing_concurrency=[]
          for entry in top_workflows:
            text=workflow_text(entry.get('path',''))
            entry['has_concurrency']=bool(text and 'concurrency:' in text)
            if entry['queued'] >= 2 and text and not entry['has_concurrency']:
              missing_concurrency.append({
                'workflow':entry['workflow'],
                'path':entry['path'],
                'queued':entry['queued'],
                'oldest_minutes':entry['oldest_minutes'],
                'events':entry['events'],
              })

          # Alert only for material repository-wide congestion.
          # A small busy queue is normal in this repo.
          severity='ok'
          cancel_storm=len(recent_cancelled_push)
          push_density=len(recent_push)
          if queue_count>=35 or oldest>=45 or cancel_storm>=20:
            severity='critical'
          elif queue_count>=20 or oldest>=25 or cancel_storm>=10 or push_density>=60:
            severity='warning'

          report={
            'schema':'zion.actions.queue-pressure.v1',
            'generated_at_utc':now.isoformat(),
            'branch':'all',
            'sampled_runs':len(runs),
            'sampled_push_runs':len(push_runs),
            'queue_count':queue_count,
            'recent_window_minutes':15,
            'recent_run_count':len(recent),
            'recent_push_run_count':len(recent_push),
            'recent_cancelled_run_count':len(recent_cancelled),
            'recent_cancelled_push_run_count':len(recent_cancelled_push),
            'top_queued_workflows':top_workflows,
            'missing_concurrency_candidates':missing_concurrency,
            'recommendations':[
              'Avoid retry pushes while severity is warning/critical.',
              'Review workflows with multiple queued runs and no top-level concurrency first.',
              'If cancelled push runs spike, inspect commit-producing cron loops and overlapping push triggers before adding retries.',
              'Prefer cancel-in-progress only for read-only analysis or superseded same-ref work; do not change deploy semantics automatically.',
              'Do not auto-disable security, deployment, release-confidence or data-integrity gates.',
            ],
            'in_progress_count':len(in_progress),
            'active_count':active_count,
            'oldest_queued_minutes':round(oldest,1),
            'severity':severity,
            'oldest_queued':[
              {
                'id':r.get('id'),
                'name':r.get('name'),
                'status':r.get('status'),
                'created_at':r.get('created_at'),
                'html_url':r.get('html_url'),
                'age_minutes':round(age_minutes(r),1),
              }
              for r in sorted(queued,key=age_minutes,reverse=True)[:15]
            ],
          }

          out=Path('actions-queue-pressure.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          summary=Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines=[
            '## GitHub Actions queue pressure',
            '',
            f'- Severity: **{severity}**',
            f'- Queued/pending: **{queue_count}**',
            f'- In progress: **{len(in_progress)}**',
            f'- Oldest queued: **{oldest:.1f} min**',
            f'- Push runs in last 15m: **{len(recent_push)}**',
            f'- Cancelled push runs in last 15m: **{len(recent_cancelled_push)}**',
            '',
            '### Top queued workflows',
          ]
          for entry in top_workflows[:8]:
            lines.append(
              f"- **{entry['workflow']}** — {entry['queued']} queued, "
              f"oldest {entry['oldest_minutes']}m, concurrency={'yes' if entry['has_concurrency'] else 'no/unknown'}"
            )
          if missing_concurrency:
            lines += ['', '### Review candidates: repeated queue without concurrency']
            for entry in missing_concurrency[:8]:
              lines.append(f"- `{entry['path']}` — {entry['queued']} queued")
          summary.write_text('\n'.join(lines)+'\n')
          print(json.dumps(report,indent=2))
          if severity!='ok':
            print(f'::error title=Actions queue pressure::{severity}: queued={queue_count}, oldest={oldest:.1f}m')
            sys.exit(1)
          PY

      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actions-queue-pressure-${{ github.run_id }}
          path: actions-queue-pressure.json
          if-no-files-found: error
          retention-days: 14

      - name: Open or update queue incident
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title='GitHub Actions queue pressure elevated';
            const marker='<!-- actions-queue-pressure -->';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title || (i.body||'').includes(marker));
            const fs=require('fs');
            let evidence={};
            try { evidence=JSON.parse(fs.readFileSync('actions-queue-pressure.json','utf8')); } catch {}
            const top=(evidence.top_queued_workflows||[]).slice(0,8)
              .map(x=>'- **'+x.workflow+'** — '+x.queued+' queued; oldest '+x.oldest_minutes+'m; concurrency='+(x.has_concurrency?'yes':'no/unknown'))
              .join('\n');
            const candidates=(evidence.missing_concurrency_candidates||[]).slice(0,8)
              .map(x=>'- `'+x.path+'` — '+x.queued+' queued')
              .join('\n');
            const body=marker+
              '\nRepository-wide Actions queue pressure crossed the configured threshold. Avoid unnecessary retry pushes; inspect queued runs and GitHub Status before changing source.'+
              '\n\n**Severity:** '+(evidence.severity||'unknown')+
              '\n**Queued/pending:** '+(evidence.queue_count??'unknown')+
              '\n**Oldest queued:** '+(evidence.oldest_queued_minutes??'unknown')+' min'+
              '\n**Push runs / 15m:** '+(evidence.recent_push_run_count??'unknown')+
              '\n**Cancelled push runs / 15m:** '+(evidence.recent_cancelled_push_run_count??'unknown')+
              (top?'\n\n### Top queued workflows\n'+top:'')+
              (candidates?'\n\n### Review candidates: repeated queue without concurrency\n'+candidates:'')+
              '\n\nNo automatic workflow edits are performed by this monitor.'+
              '\n\nRun: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            if(existing) await github.rest.issues.update({...context.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({...context.repo,title,body});

      - name: Close prior queue incident on recovery
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title='GitHub Actions queue pressure elevated';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            for(const issue of issues.filter(i=>i.title===title)){
              await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body:'Recovered: queue pressure is back within threshold on run '+context.runId+'.'});
              await github.rest.issues.update({...context.repo,issue_number:issue.number,state:'closed'});
            }
