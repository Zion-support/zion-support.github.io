name: Apps translation family coupling

"on":
  pull_request:
    paths:
      - 'public/apps/index.html'
      - 'public/pt/apps/index.html'
      - 'public/es/apps/index.html'
      - 'public/fr/apps/index.html'
      - 'public/de/apps/index.html'
      - 'public/discovery/index.html'
      - 'public/pt/discovery/index.html'
      - 'public/es/discovery/index.html'
      - 'public/fr/discovery/index.html'
      - 'public/de/discovery/index.html'
      - 'public/apps/operations-reliability-ai-2026*.html'
      - '.github/workflows/apps-translation-family-coupling.yml'
  push:
    branches: [main]
    paths:
      - 'public/apps/index.html'
      - 'public/pt/apps/index.html'
      - 'public/es/apps/index.html'
      - 'public/fr/apps/index.html'
      - 'public/de/apps/index.html'
      - 'public/discovery/index.html'
      - 'public/pt/discovery/index.html'
      - 'public/es/discovery/index.html'
      - 'public/fr/discovery/index.html'
      - 'public/de/discovery/index.html'
      - 'public/apps/operations-reliability-ai-2026*.html'
      - '.github/workflows/apps-translation-family-coupling.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-translation-family-coupling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coupling:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Require locale families to move together
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys

          event=os.environ.get('EVENT_NAME','')
          if event!='pull_request':
              print(
                  'Direct push/manual run: strict same-commit locale coupling is intentionally '
                  'not enforced because GitHub Contents API writes can be sequential. '
                  'Current-state integrity is enforced by Apps canonical/hreflang, i18n parity, '
                  'release evidence and production canary guards.'
              )
              raise SystemExit(0)

          # actions/checkout checks out GitHub's synthetic PR merge ref.
          # With fetch-depth: 2, HEAD^1 is the exact base tip used to build
          # that merge and HEAD is the merged PR tree. This avoids stale
          # pull_request.base.sha values after main advances.
          changed=set(subprocess.check_output(
              ['git','diff','--name-only','HEAD^1','HEAD'],text=True
          ).splitlines())
          print('PR changed files:')
          for p in sorted(changed):
              print(' -',p)

          families={
            'apps-hub':{
              'public/apps/index.html',
              'public/pt/apps/index.html',
              'public/es/apps/index.html',
              'public/fr/apps/index.html',
              'public/de/apps/index.html',
            },
            'discovery':{
              'public/discovery/index.html',
              'public/pt/discovery/index.html',
              'public/es/discovery/index.html',
              'public/fr/discovery/index.html',
              'public/de/discovery/index.html',
            },
            'operations-reliability':{
              'public/apps/operations-reliability-ai-2026.html',
              'public/apps/operations-reliability-ai-2026-pt.html',
              'public/apps/operations-reliability-ai-2026-es.html',
              'public/apps/operations-reliability-ai-2026-fr.html',
              'public/apps/operations-reliability-ai-2026-de.html',
            },
          }
          errors=[]
          for name,files in families.items():
              touched=files & changed
              if touched and touched != files:
                  missing=sorted(files-touched)
                  errors.append(
                      f'{name}: translation family changed partially; '
                      f'touched={sorted(touched)} missing review={missing}'
                  )

          if errors:
              for e in errors:
                  print('::error::'+e)
              raise SystemExit(1)

          print('Translation family coupling: PASS')
          PY
