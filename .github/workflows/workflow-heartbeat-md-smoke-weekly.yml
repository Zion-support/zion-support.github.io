# Ensures HEARTBEAT.md keeps the current workspace-status continuity anchors (grep-only).

name: HEARTBEAT.md smoke (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '11 8 * * 5' # Fridays 08:11 UTC
  workflow_dispatch:

concurrency:
  group: workflow-heartbeat-md-smoke-weekly
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: HEARTBEAT.md status anchors
        run: |
          set -euo pipefail
          test -f HEARTBEAT.md
          test -s HEARTBEAT.md
          grep -Fq '# zion.app — Workspace Status' HEARTBEAT.md
          grep -Fq 'V32 RESPONDER' HEARTBEAT.md
          grep -Fq 'PARTNERS PAGE' HEARTBEAT.md
          grep -Fq 'GITHUB ACTIONS' HEARTBEAT.md
          grep -Fq 'GMAIL / CALENDAR' HEARTBEAT.md
          grep -Fq 'FLEET STATUS' HEARTBEAT.md
          echo 'ok: HEARTBEAT.md'
