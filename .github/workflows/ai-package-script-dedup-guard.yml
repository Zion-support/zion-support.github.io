name: AI Package Script Dedup Guard

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-package-script-dedup-guard
  cancel-in-progress: false

"on":
  schedule:
    - cron: '25 14 * * 1-5'
  workflow_dispatch:

jobs:
  dedup-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Check duplicate package scripts
        id: dedup_check
        continue-on-error: true
        run: |
          node <<'EOF'
          const fs = require('fs');
          const text = fs.readFileSync('package.json', 'utf8');
          const m = text.match(/"scripts"\s*:/);
          const duplicates = [];
          if (m) {
            const start = text.indexOf('{', m.index);
            let depth = 0, end = start;
            for (let i = start; i < text.length; i++) {
              if (text[i] === '{') depth++;
              else if (text[i] === '}') { depth--; if (depth === 0) { end = i; break; } }
            }
            const block = text.slice(start, end + 1);
            const keys = [...block.matchAll(/"([^"]+)"\s*:/g)].map(x => x[1]);
            const seen = new Set();
            for (const k of keys) { if (seen.has(k)) duplicates.push(k); seen.add(k); }
          }
          if (duplicates.length > 0) {
            fs.mkdirSync('automation/reports', { recursive: true });
            fs.writeFileSync('automation/reports/package-script-duplicates-latest.json', JSON.stringify({ duplicateCount: duplicates.length, duplicates }, null, 2));
            console.log('Duplicate script keys: ' + duplicates.join(', '));
            process.exit(1);
          }
          console.log('No duplicate script keys in package.json.');
          EOF

      - name: Upload dedup report artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: package-script-dedup-${{ github.run_id }}
          path: automation/reports/package-script-duplicates-latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open issue if duplicates are found
        if: steps.dedup_check.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="automation/reports/package-script-duplicates-latest.json"
          [ -f "$report" ] || exit 0
          dup_count=$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('$report','utf8'));console.log(Number(r.duplicateCount||0))")
          [ "$dup_count" -gt 0 ] || exit 0
          body_file="package-script-dedup-issue.md"
          {
            echo "## Duplicate npm script keys detected"
            echo ""
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Duplicate key count: ${dup_count}"
            echo ""
            echo "### Duplicate keys"
            node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('$report','utf8'));for(const key of (r.duplicates||[])){console.log('- \`'+key+'\`')}"
            echo ""
            echo "Remove duplicate script keys from \`package.json\` to avoid silent script shadowing."
          } > "$body_file"
          export ISSUE_TITLE="Duplicate npm scripts detected"
          export ISSUE_BODY_FILE="$body_file"
          export ISSUE_LABELS="bug"
          export ISSUE_FINGERPRINT="package-script-dedup"
          export COOLDOWN_HOURS="12"
          node scripts/automation/gh-issue-dedupe-or-create.cjs || true

      - name: Fail workflow on duplicate keys
        if: steps.dedup_check.outcome != 'success'
        run: |
          echo "::error::Duplicate npm script keys detected. See artifact and issue for details."
          exit 1
