name: Finance paths local publication contract
on:
  push:
    branches: [main]
    paths:
      - 'scripts/render-finance-insurance-paths.cjs'
      - 'scripts/test-finance-paths.cjs'
      - 'content/discovery-showcase.json'
      - '.github/workflows/finance-paths-contract.yml'
  pull_request:
    paths:
      - 'scripts/render-finance-insurance-paths.cjs'
      - 'scripts/test-finance-paths.cjs'
      - 'content/discovery-showcase.json'
      - '.github/workflows/finance-paths-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check generated translations, preserved forms and local checklist behavior
        run: node scripts/test-finance-paths.cjs
