# Ensures ci-cd.yml remains an explicit no-op and does not resurrect the retired Next.js production pipeline.
name: CI/CD pipeline smoke (weekly)
permissions:
  contents: read
"on":
  schedule:
    - cron: '56 10 * * 4' # Thursdays 10:56 UTC
  workflow_dispatch:
concurrency:
  group: ci-cd-smoke-weekly
  cancel-in-progress: true
jobs:
  ci-cd-anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: ci-cd.yml anchors
        run: |
          set -euo pipefail
          f=.github/workflows/ci-cd.yml
          test -f "$f"
          test -s "$f"
          grep -Fq 'name: CI/CD Pipeline' "$f"
          grep -Fq 'workflow_dispatch:' "$f"
          grep -Fq 'CI/CD Pipeline is retired.' "$f"
          grep -Fq 'Production: Simple Static Deploy on main (actions/deploy-pages).' "$f"
          grep -Fq 'Do not re-enable Next.js build on this branch.' "$f"
          if grep -Fq 'pull_request:' "$f" || grep -Fq 'push:' "$f"; then
            echo "ERROR: retired CI/CD pipeline must not auto-trigger" >&2
            exit 1
          fi
          echo "ok: $f"
