name: AI workflow failure triage hourly

# Existing cadence retained. Reports are read-only Actions artifacts and run summaries,
# never auto-committed to main. Queue pressure and real failures are distinct signals.
"on":
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ai-workflow-failure-triage-hourly.yml'
      - 'automation/workflow-failure-triage.cjs'
      - 'automation/workflow-failure-triage.test.cjs'

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-workflow-failure-triage-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout without saved token
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Offline regression tests
        run: node --test automation/workflow-failure-triage.test.cjs

      - name: Sample recent runs and recent failures (read-only)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --limit 100 --json databaseId,workflowName,conclusion,status,createdAt > "$RUNNER_TEMP/actions-recent.json"
          gh run list --status failure --limit 100 --json databaseId,workflowName,conclusion,status,createdAt > "$RUNNER_TEMP/actions-failures.json"
          node automation/workflow-failure-triage.cjs "$RUNNER_TEMP/actions-recent.json" "$RUNNER_TEMP/actions-failures.json"

      - name: Upload sanitized triage evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workflow-failure-triage-${{ github.run_id }}
          path: |
            automation/reports/workflow-failure-triage-latest.json
            automation/reports/workflow-failure-triage-latest.md
          if-no-files-found: error
          retention-days: 14
