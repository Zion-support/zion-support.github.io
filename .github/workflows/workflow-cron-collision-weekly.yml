name: Workflow cron collision report (weekly)

"on":
  schedule:
    - cron: '18 7 * * 1' # retain existing Monday 07:18 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-cron-collision-weekly
  cancel-in-progress: false

jobs:
  collision-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (no persisted token)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Offline cron model tests
        run: node --test automation/ai-cron-collision-tuner.test.cjs

      - name: Generate scheduled UTC collision candidates
        run: node automation/ai-cron-collision-tuner.cjs

      - name: Upload sanitized cron evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cron-collision-weekly-${{ github.run_id }}
          path: |
            automation/reports/cron-collision-latest.json
            automation/reports/cron-collision-latest.md
          if-no-files-found: error
          retention-days: 21
