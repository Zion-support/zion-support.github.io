name: oneshot-pricing-repoint
on:
  push:
    branches: [ops/pricing-repoint-wf]
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - name: build ship branch from main
        run: |
          set -euo pipefail
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin 60a357ef9eff9a5e149e5a42a2340096738974d5
          git checkout -q -b ship/pricing-repoint FETCH_HEAD
          sed -i 's#href="/pricing/"#href="/plans/"#g' public/discovery/index.html public/plans/index.html public/en/plans/index.html public/ai-consulting-services/index.html
          cat > /tmp/seal <<'S'
          19d6f1ecbd4a9deba972f4a93e8205d6af911b5fc102488888146ec973702f73  public/discovery/index.html
          8a94916052cba0a055fdba7e227b1fab989e14e45d4faec4f2b132a00f4bfbf8  public/plans/index.html
          91eb0bb5f73a831bdbf903e7df9330815d8cb74778d4852b83edbd0e964b7048  public/en/plans/index.html
          e29a96f7ebf3f3157cc66d41fd0d31dff551d6b317dd7951c9d1639b04fb58b8  public/ai-consulting-services/index.html
          S
          sed -i 's/^ *//' /tmp/seal
          sha256sum -c /tmp/seal
          test "$(git status --porcelain | wc -l)" = "4"
          git -c user.name=zion-bot -c user.email=bot@ziontechgroup.com commit -qam "fix(links): repoint /pricing/ alias hrefs to /plans/ (5 hrefs, 4 pages, public/ only)"
          git push -f origin ship/pricing-repoint
