name: Simple Static Deploy

# Production Pages is build_type=workflow (not gh-pages branch).
# Dispatch-only, main-only. Shares the `pages` concurrency group with
# gh-pages.yml so two publishers never race; cancel-in-progress false so a
# money-path publish is never cancelled mid-flight.
# 2026-10-04 hardening: pinned actions, timeout, publish guard
# (scripts/pages-publish-guard.sh strips ops/, internal *.md, .netrc and
# report JSONs from out/ and fails if key pages are missing or stubs).
# FIELD-SERVICES LOCK. No DNS.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Dispatch from main only (Use workflow from = main)'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm main ref
        run: echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME} (main-only deploy)"

      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh

      - name: Publish guard (strip internal content, assert key pages)
        run: bash scripts/pages-publish-guard.sh out

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
