name: Simple Static Deploy

# Production Pages is build_type=workflow (not gh-pages branch).
# Last good publisher: e23c3b71 — no environment gate, deploy-pages@v4.

on:
  push:
    branches: [main, cursor/field-services-family-a-0b5b]
    paths-ignore:
      - "STATUS.md"
      - "PROTOCOL.md"
      - "ops/comms/STATUS.md"
      - "ops/comms/PROTOCOL.md"
      - "public/ops/comms/STATUS.md"
      - "public/ops/comms/PROTOCOL.md"
      - "public/ops/comms/log.json"
      - "public/ops/comms/state.json"
      - "public/ops/comms/agents.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
