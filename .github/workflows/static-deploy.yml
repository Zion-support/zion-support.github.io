name: Simple Static Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Production Pages must only publish from main via prepare-pages-out.sh.
    # A stale-branch workflow once uploaded a 360KB ./public/ and 404'd money pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: bash scripts/prepare-pages-out.sh
      - name: Guard money pages in artifact
        run: |
          set -euo pipefail
          for f in plans/index.html discovery/index.html enterprise/index.html \
                   field-services/index.html field-services/brazil/index.html \
                   services/ai-automation/index.html; do
            test -f "out/$f" || { echo "::error::Missing out/$f"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
