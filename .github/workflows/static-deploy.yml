name: Static Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
# contents: write is required for peaceiris to push gh-pages.
# keep_files: true — do not wipe leftover production paths (e.g. /enterprise/).
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true
