name: Simple Static Deploy

# Production Pages is build_type=workflow (not gh-pages branch).
# Last good publisher: e23c3b71 — no environment gate, deploy-pages@v4.
#
# P0 2026-09-20: dispatch-only + cancel-in-progress false so Hermes
# STATUS.md / CI fix pushes cannot cancel a sole money-path publish.
# FIELD-SERVICES LOCK. No DNS. No #71365.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Dispatch from main only (Use workflow from = main)'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public candidate without stored credentials
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid checkout candidate SHA."
            exit 1
          fi
          if [[ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            echo "::error::Checkout requires an empty workspace; existing files were not changed."
            exit 1
          fi
          git init --quiet
          git remote add origin https://github.com/Zion-support/zion-support.github.io.git
          case "${FETCH_DEPTH:-1}" in
            0) git -c credential.helper= fetch --no-tags origin "$CANDIDATE_SHA" ;;
            1) git -c credential.helper= fetch --no-tags --depth=1 origin "$CANDIDATE_SHA" ;;
            *) echo "::error::Invalid checkout depth."; exit 1 ;;
          esac
          git checkout --detach FETCH_HEAD
          if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Checked out revision differs from publication candidate."
            exit 1
          fi
      - name: Guard main ref
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Simple Static Deploy is pinned to main only (got ${GITHUB_REF}). Re-run with Use workflow from = main."
            exit 1
          fi
      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh
      - name: Verify current main publication candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/assert-publication-main.sh
      - name: Reject private operational files in final Pages artifact
        run: python3 scripts/assert-no-private-ops.py out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Verify current main publication candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: bash scripts/assert-publication-main.sh
      - uses: actions/deploy-pages@v4
      # Post-deploy live curl skipped: runners often block egress and probes flake.
      # The prepare-pages-out money-path gate above is the durable Pay RED guard.
