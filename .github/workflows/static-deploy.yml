name: Simple Static Deploy

# Production Pages is build_type=workflow.
# Deploy automatically only when public site content or this deployment path changes.
# This avoids triggering production publishes for unrelated Hermes/status/ops commits.

on:
  # Debounced production publishing: this repository receives many commits per
  # minute, so per-push deploys can cancel each other indefinitely. Each run
  # checks out the latest main snapshot when it actually starts.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Manual production publish from main'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Confirm main ref
        run: echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME} (main-only deploy)"
      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
