name: Simple Static Deploy

# Production Pages is build_type=workflow.
# Deploy automatically only when public site content or this deployment path changes.
# This avoids triggering production publishes for unrelated Hermes/status/ops commits.

on:
  # Publish immediately for customer-facing static content, while excluding
  # Hermes/STATUS/ops-only churn. Scheduled runs remain as a recovery path.
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'scripts/prepare-pages-out.sh'
      - 'scripts/render-discovery-showcase.cjs'
      - 'content/discovery-showcase.json'
      - '.github/workflows/static-deploy.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Manual production publish from main'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Confirm main ref
        run: echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME} (main-only deploy)"
      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh
      - name: Render translated Discovery and communications content
        run: node scripts/render-discovery-showcase.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Read-only live multilingual publication checks
        run: node scripts/test-discovery-live.cjs
