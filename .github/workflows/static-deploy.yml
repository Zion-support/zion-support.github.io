name: Simple Static Deploy

# Production Pages is build_type=workflow (not gh-pages branch).
# peaceiris → gh-pages does NOT update ziontechgroup.com.
# Last good publisher: e23c3b71 (upload-pages-artifact + deploy-pages@v4).

on:
  push:
    branches: [main, cursor/restore-pages-outage-0b5b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pages
        run: bash scripts/prepare-pages-out.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
