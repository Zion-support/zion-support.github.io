name: Simple Static Deploy

# Production Pages is build_type=workflow (not gh-pages branch).
# Last good publisher: e23c3b71 — no environment gate, deploy-pages@v4.
#
# P0 2026-09-20: dispatch-only + cancel-in-progress false so Hermes
# STATUS.md / CI fix pushes cannot cancel a sole money-path publish.
# FIELD-SERVICES LOCK. No DNS. No #71365.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Dispatch from main only (Use workflow from = main)'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/canonical-pages.yml
  validate-production:
    needs: deploy
    if: ${{ github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && needs.deploy.outputs.source_sha == github.sha }}
    permissions:
      contents: read
    uses: ./.github/workflows/ai-production-deploy-validation.yml
    with:
      source_sha: ${{ needs.deploy.outputs.source_sha }}
