name: Service JSON-LD JSX regression guard

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - 'app/services/**/page.tsx'
      - 'automation/repair-jsonld-jsx.cjs'
      - 'automation/repair-jsonld-jsx.test.cjs'
      - 'automation/service-jsonld-jsx-pr-guard.cjs'
      - 'automation/service-jsonld-jsx-pr-guard.test.cjs'
      - '.github/workflows/service-jsonld-jsx-pr-guard.yml'
  workflow_dispatch:

concurrency:
  group: service-jsonld-regression-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test safe generated JSX repair and regression guard offline
        run: node --test automation/repair-jsonld-jsx.test.cjs automation/service-jsonld-jsx-pr-guard.test.cjs
      - name: Check only changed service pages for invalid JSON-LD JSX
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node automation/service-jsonld-jsx-pr-guard.cjs
