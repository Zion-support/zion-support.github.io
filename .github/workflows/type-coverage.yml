        def route_map(paths):
            assert len(paths) == 61 and len(set(paths)) == 61, "Expected exactly 61 audited paths"
            result = {}
            for source in paths:
                assert re.fullmatch(r"app/services/services/[a-z0-9-]+/page\.tsx", source), "Unexpected orphan path shape"
                nested = source.removeprefix("app/").removesuffix("/page.tsx")
                canonical = nested.replace("services/services/", "services/", 1)
                # Check the exact nested route and its separately retired canonical route.
                # Both are derived only from the fixed audited path; no substring matching.
                for route, kind in ((nested, "nested_orphan_route"), (canonical, "retired_canonical_route")):
                    assert route not in result
                    result[route] = {"orphan_path": source, "route_kind": kind}
            return result

        def normalize_loc(value):
            if not isinstance(value, str) or not value.strip():
                raise ValueError("empty_loc")
            raw = value.strip().replace("\\", "/")
            parsed = urlsplit(raw)
            if parsed.scheme and parsed.scheme.lower() not in ("http", "https"):
                raise ValueError("unsupported_scheme")
            path = parsed.path
            if re.search(r"%(?![0-9A-Fa-f]{2})", path):
                raise ValueError("malformed_percent_encoding")
            # Decode percent-encoded UTF-8 up to three passes, conservatively including
            # multiply encoded separators. No path text is ever printed unless it
            # exactly matches one of the fixed audited routes.
            for attempt in range(3):
                decoded = unquote(path, encoding="utf-8", errors="strict")
                if decoded == path:
                    break
                path = decoded
                if not re.search(r"%[0-9A-Fa-f]{2}", path):
                    break
                if re.search(r"%(?![0-9A-Fa-f]{2})", path):
                    raise ValueError("ambiguous_repeated_percent_encoding")
            else:
                if re.search(r"%[0-9A-Fa-f]{2}", path):
                    raise ValueError("percent_encoding_depth_exceeded")
            path = path.replace("\\", "/")
            if any(ord(c) < 32 or ord(c) == 127 for c in path):
                raise ValueError("control_character_in_path")
            # Collapse repeated/trailing slashes and resolve dot segments at the root.
            # Path case is preserved. The query and fragment were removed by urlsplit.
            parts = []
            for segment in path.split("/"):
                if segment in ("", "."):
                    continue
                if segment == "..":
                    if parts:
                        parts.pop()
                else:
                    parts.append(segment)
            return "/".join(parts)

        def audit_xml(file, paths):
            routes = route_map(paths)
            total = normalized = invalid = 0
            matches = collections.Counter()
            parse_error = False
            try:
                for _event, element in ET.iterparse(file, events=("end",)):
                    if element.tag.rsplit("}", 1)[-1] == "loc":
                        total += 1
                        try:
                            route = normalize_loc(element.text)
                        except (ValueError, UnicodeError):
                            invalid += 1
                        else:
                            normalized += 1
                            if route in routes:
                                matches[route] += 1
                    element.clear()
            except ET.ParseError:
                parse_error = True
            complete = not parse_error and invalid == 0 and total > 0
            return {
                "analysis_only": True,
                "counts_as_required_gate": False,
                "audited_orphan_paths": len(paths),
                "orphan_path_set_sha256": hashlib.sha256("\n".join(sorted(paths)).encode()).hexdigest(),
                "checked_route_aliases": len(routes),
                "locs_total": total,
                "normalized_locs": normalized,
                "unresolved_locs": invalid,
                "xml_parse_error": parse_error,
                "audit_complete": complete,
                "references_count": sum(matches.values()),
                "matched_relative_paths": [{"path": route, "orphan_path": routes[route]["orphan_path"], "route_kind": routes[route]["route_kind"], "references": matches[route]} for route in sorted(matches)],
                "normalization": "URL path only; query/fragment ignored; UTF-8 percent-decoding up to 3 passes; backslashes, repeated/trailing slashes and dot segments normalized; path case preserved; exact derived routes only.",
            }

        def main():
            assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == SOURCE, "Sitemap checkout commit mismatch"
            assert subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip() == TREE, "Sitemap checkout tree mismatch"
            blob = subprocess.check_output(["git", "hash-object", SITEMAP], text=True).strip()
            assert blob == SITEMAP_BLOB, "Sitemap body no longer matches the immutable source blob"
            report = audit_xml(Path(SITEMAP), ORPHAN_PATHS)
            report.update({"source_identity_verified": True, "sitemap_blob_verified": True, "present_orphan_source_paths": [path for path in ORPHAN_PATHS if Path(path).exists()]})
            report["counterevidence"] = report["references_count"] > 0 or bool(report["present_orphan_source_paths"])
            report["status"] = "counterevidence_found" if report["counterevidence"] else ("no_audited_references" if report["audit_complete"] else "audit_incomplete")
            out = Path(os.environ["PROFILE_DIR"])
            (out / "sitemap-orphan-audit.json").write_text(json.dumps(report, indent=2) + "\n")
            print("SITEMAP_ORPHAN_REFERENCE_AUDIT " + json.dumps(report, separators=(",", ":")))
            with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                summary.write("\n## Immutable sitemap reference audit\n\n")
                summary.write(f"- Locs inspected: {report['locs_total']}; audited references: {report['references_count']}; complete: {report['audit_complete']}\n")
                summary.write(f"- Status: {report['status']}. Any reference is counterevidence and keeps integration blocked.\n")
            if report["counterevidence"] or not report["audit_complete"]:
                raise SystemExit(1)

        if __name__ == "__main__":
            main()

