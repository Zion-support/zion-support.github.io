name: Observe production webpack phases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 54d5f76a6b6dd1814194f2951d1752fcebc4c6b2
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.23.5'
      - run: |
          test "$(git rev-parse HEAD)" = 54d5f76a6b6dd1814194f2951d1752fcebc4c6b2
          sha256sum next.config.mjs package-lock.json
          npm ci --prefer-offline --no-audit --fund=false
      - name: Instrument compiler lifecycle for this checkout
        run: |
          cat > "$RUNNER_TEMP/observe-webpack-phase.mjs" <<'JS'
          export default class PhaseMeasurements {
            apply(compiler) {
              const name = 'PhaseMeasurements';
              const target = compiler.name || compiler.options.name || 'unnamed';
              let stage = 'plugin-apply';
              let modulesStarted = 0;
              let modulesFinished = 0;
              function report(event) {
                const { heapUsed, rss } = process.memoryUsage();
                const mib = n => Math.round(n / 1048576);
                process.stderr.write('[webpack-phase] ' + JSON.stringify({
                  pid: process.pid, target, stage, event, modulesStarted, modulesFinished,
                  heapMiB: mib(heapUsed), rssMiB: mib(rss)
                }) + '\n');
              }
              function mark(next) { stage = next; report('phase'); }
              report('install');
              const timer = setInterval(() => report('sample'), 15000);
              timer.unref();
              for (const stageName of ['beforeRun', 'beforeCompile', 'compile', 'make', 'finishMake', 'afterCompile', 'emit']) {
                compiler.hooks[stageName].tap(name, () => mark(stageName));
              }
              compiler.hooks.thisCompilation.tap(name, compilation => {
                mark('thisCompilation');
                compilation.hooks.buildModule.tap(name, () => {
                  modulesStarted++;
                  if (modulesStarted % 2048 === 0) report('modules');
                });
                compilation.hooks.succeedModule.tap(name, () => { modulesFinished++; });
                for (const step of ['finishModules', 'seal', 'afterOptimizeModules', 'afterSeal']) {
                  compilation.hooks[step].tap(name, () => mark(step));
                }
              });
              for (const end of ['done', 'failed']) {
                compiler.hooks[end].tap(name, () => { mark(end); clearInterval(timer); });
              }
            }
          }
          JS
          python3 - <<'PY'
          import os
          from pathlib import Path
          src = Path('next.config.mjs')
          original = src.read_text()
          needle = '    return config;'
          if original.count(needle) != 1:
              raise SystemExit('Unexpected webpack callback shape')
          observer = (Path(os.environ['RUNNER_TEMP']) / 'observe-webpack-phase.mjs').as_uri()
          src.write_text(f'import PhaseMeasurements from "{observer}";\n' + original.replace(
              needle, '    config.plugins.push(new PhaseMeasurements());\n' + needle))
          PY
          node --check next.config.mjs
          node --check "$RUNNER_TEMP/observe-webpack-phase.mjs"
          git diff --stat
      - name: Run the production build with phase observations
        env:
          NODE_OPTIONS: '--max-old-space-size=12288'
        run: |
          ulimit -c 0
          /usr/bin/time -v npm run build
