# Manual performance diagnosis on an immutable source tree; never a replacement for the required TypeScript gate.
name: TypeScript Late Phase Diagnostic
run-name: TypeScript diagnostic 900s — c286a4a3
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: typescript-performance-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-typescript-diagnostic:
    name: TypeScript performance diagnostic (900s, semi64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout immutable source target
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: c286a4a3e46ba53f55d8fc2583ab475be5e2a157
        fetch-depth: 1
        persist-credentials: false
    - name: Initialize incomplete diagnostic record
      run: |
        PROFILE_DIR="$RUNNER_TEMP/typescript-diagnostic"
        echo "PROFILE_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"
        mkdir -p "$PROFILE_DIR"
        printf '%s\n' '{"complete":false,"counts_as_required_gate":false,"status":"setup"}' > "$PROFILE_DIR/summary.json"
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 20.20.2
        cache: npm
    - name: Install exact dependencies
      run: npm ci
    - name: Capture compiler diagnostic (up to 900 seconds)
      env:
        NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
      run: |
        python3 - <<'PY'
        import collections
        import json
        import os
        from pathlib import Path
        import signal
        import subprocess
        import time

        TARGET = "c286a4a3e46ba53f55d8fc2583ab475be5e2a157"
        TARGET_TREE = "dc138bc3906076edbf658daff2fa26853dda9b47"

        def write_json(path, value):
            path.write_text(json.dumps(value, indent=2) + "\n")

        def observe(command, out, limit_seconds=180, grace_seconds=10):
            out.mkdir(parents=True, exist_ok=True)
            started = time.monotonic()
            summary = {
                "complete": False,
                "counts_as_required_gate": False,
                "status": "running",
                "limit_seconds": limit_seconds,
                "grace_seconds": grace_seconds,
            }
            write_json(out / "summary.json", summary)
            clock_ticks = os.sysconf("SC_CLK_TCK")
            cutoff = False
            killed = False
            with (out / "compiler.log").open("w") as log, (out / "resources.jsonl").open("w") as samples:
                child = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                try:
                    while True:
                        finished_pid, status, usage = os.wait4(child.pid, os.WNOHANG)
                        if finished_pid:
                            child.returncode = os.waitstatus_to_exitcode(status)
                            break
                        elapsed = time.monotonic() - started
                        try:
                            stat = Path(f"/proc/{child.pid}/stat").read_text()
                            fields = stat[stat.rfind(")") + 2:].split()
                            memory = {}
                            for line in Path(f"/proc/{child.pid}/status").read_text().splitlines():
                                if line.startswith(("VmRSS:", "VmHWM:")):
                                    key, value, _unit = line.split()
                                    memory[key.rstrip(":") + "_kib"] = int(value)
                            sample = {
                                "elapsed_seconds": elapsed,
                                "user_cpu_seconds": int(fields[11]) / clock_ticks,
                                "system_cpu_seconds": int(fields[12]) / clock_ticks,
                                **memory,
                            }
                            samples.write(json.dumps(sample) + "\n")
                            samples.flush()
                        except (FileNotFoundError, ProcessLookupError):
                            pass
                        if not cutoff and elapsed >= limit_seconds:
                            cutoff = True
                            try:
                                os.killpg(child.pid, signal.SIGINT)
                            except ProcessLookupError:
                                pass
                        elif cutoff and not killed and elapsed >= limit_seconds + grace_seconds:
                            killed = True
                            try:
                                os.killpg(child.pid, signal.SIGKILL)
                            except ProcessLookupError:
                                pass
                        time.sleep(min(1, max(0.01, limit_seconds - elapsed)) if not cutoff else 0.1)
                except BaseException:
                    try:
                        os.killpg(child.pid, signal.SIGKILL)
                    except ProcessLookupError:
                        pass
                    _pid, status, _usage = os.wait4(child.pid, 0)
                    child.returncode = os.waitstatus_to_exitcode(status)
                    summary["status"] = "controller_interrupted"
                    write_json(out / "summary.json", summary)
                    raise
            raw_exit = child.returncode
            effective_exit = 124 if cutoff else (128 - raw_exit if raw_exit < 0 else raw_exit)
            trace = out / "trace" / "trace.json"
            trace_closed = False
            events = collections.Counter()
            last_events = collections.deque(maxlen=20)
            if trace.exists():
                with trace.open("rb") as source:
                    source.seek(max(0, trace.stat().st_size - 64))
                    trace_closed = source.read().rstrip().endswith(b"]")
                with trace.open(errors="replace") as source:
                    for line in source:
                        try:
                            event = json.loads(line.strip().strip(","))
                        except (ValueError, TypeError):
                            continue
                        if isinstance(event, dict) and event.get("cat"):
                            events[event["cat"]] += 1
                            last_events.append({key: event[key] for key in ("cat", "name", "ph", "ts", "dur", "args") if key in event})
            total_time_reported = False
            with (out / "compiler.log").open(errors="replace") as source:
                total_time_reported = any(line.startswith("Total time:") for line in source)
            complete = not cutoff and raw_exit in (0, 1, 2) and trace_closed and total_time_reported
            if effective_exit == 0 and not complete:
                effective_exit = 1
            summary.update({
                "complete": complete,
                "status": "cutoff" if cutoff else ("finished" if complete else "terminated_without_complete_trace"),
                "elapsed_seconds": time.monotonic() - started,
                "compiler_exit_code": raw_exit,
                "exit_code": effective_exit,
                "cutoff_reached": cutoff,
                "forced_kill_after_grace": killed,
                "user_cpu_seconds": usage.ru_utime,
                "system_cpu_seconds": usage.ru_stime,
                "maximum_rss_kib": usage.ru_maxrss,
                "trace_closed": trace_closed,
                "extended_diagnostics_total_time_reported": total_time_reported,
                "trace_event_counts": dict(events),
                "last_trace_events": list(last_events),
                "trace_warning": "Raw trace may be incomplete after termination; no missing events or durations are synthesized.",
            })
            write_json(out / "summary.json", summary)
            return summary, effective_exit

        def output(args):
            return subprocess.check_output(args, text=True).strip()

        def main():
            out = Path(os.environ["PROFILE_DIR"])
            head = output(["git", "rev-parse", "HEAD"])
            tree = output(["git", "rev-parse", "HEAD^{tree}"])
            if head != TARGET or tree != TARGET_TREE:
                raise SystemExit("Checkout does not match the immutable diagnostic target")
            package = json.loads(Path("package.json").read_text())
            version = output(["node", "-p", "require('typescript/package.json').version"])
            if package["scripts"]["type-check"] != "tsc --noEmit" or version != "5.9.3":
                raise SystemExit("Compiler contract differs from the measured CI run")
            subprocess.run(["git", "diff", "--exit-code", "--", "package.json", "package-lock.json", "tsconfig.json"], check=True)
            node_version = output(["node", "--version"])
            npm_version = output(["npm", "--version"])
            if node_version != "v20.20.2" or npm_version != "10.8.2":
                raise SystemExit("Runtime version differs from the measured gate")
            if os.environ["NODE_OPTIONS"] != "--max-old-space-size=12288 --max-semi-space-size=64":
                raise SystemExit("Compiler resource flags differ from the measured gate")
            expected_inputs = {"package.json": "8f572286b94f517a07f83fbddeba350653ded85e", "package-lock.json": "e79ec8d8bf85ad622306cf39714ec3fbd56c9530", "tsconfig.json": "c128011dc8f2ddb69da4f11dd57b09abe501dacb"}
            input_blobs = {path: output(["git", "hash-object", path]) for path in expected_inputs}
            if input_blobs != expected_inputs:
                raise SystemExit("Compiler input blobs differ from the immutable target")
            metadata = {
                "source_commit": head,
                "source_tree": tree,
                "workflow_commit": os.environ["GITHUB_SHA"],
                "node_version": node_version,
                "npm_version": npm_version,
                "typescript_version": version,
                "type_check_script": package["scripts"]["type-check"],
                "node_options": os.environ["NODE_OPTIONS"],
                "input_blobs": input_blobs,
                "counts_as_required_gate": False,
            }
            write_json(out / "metadata.json", metadata)
            command = [
                "node", "--trace-gc", "node_modules/typescript/bin/tsc",
                "--noEmit", "--extendedDiagnostics", "--generateTrace", str(out / "trace"),
            ]
            summary, status = observe(command, out, limit_seconds=900, grace_seconds=10)
            with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as report:
                report.write("## TypeScript performance diagnostic\n\n")
                report.write("This run is not the required TypeScript validation.\n\n")
                report.write(f"- Source commit: {head}\n- Complete: {str(summary['complete']).lower()}\n")
                report.write(f"- Exit code: {status}\n- Elapsed seconds: {summary['elapsed_seconds']:.1f}\n")
                report.write(f"- Maximum RSS (KiB): {summary['maximum_rss_kib']}\n")
            raise SystemExit(status)

        if __name__ == "__main__":
            main()

        PY
    - name: Analyze bounded capture locally inside GitHub
      if: always()
      run: |
        python3 - <<'PY'
        import bisect, collections, hashlib, json, math, os, re
        from pathlib import Path

        SOURCE = "c286a4a3e46ba53f55d8fc2583ab475be5e2a157"
        TREE = "dc138bc3906076edbf658daff2fa26853dda9b47"
        OPTIONS = "--max-old-space-size=12288 --max-semi-space-size=64"
        INPUTS = {"package.json": "8f572286b94f517a07f83fbddeba350653ded85e", "package-lock.json": "e79ec8d8bf85ad622306cf39714ec3fbd56c9530", "tsconfig.json": "c128011dc8f2ddb69da4f11dd57b09abe501dacb"}
        CHECKPOINTS = (180, 360, 600, 900)
        PHASES = ("program", "parse", "bind", "check", "checkTypes")
        FILES = {"metadata.json", "summary.json", "resources.jsonl", "compiler.log", "trace/trace.json"}
        GC_PATTERN = re.compile(r"([0-9.]+) ms: (Scavenge|Mark-Compact|Mark-sweep|Minor Mark-Compact).*?([0-9.]+) \(([0-9.]+)\) -> ([0-9.]+) \(([0-9.]+)\) MB, (?:pooled: [0-9.]+ MB, )?([0-9.]+) / ([0-9.]+) ms")

        class LocalCapture:
            def __init__(self, directory):
                self.directory = directory
            def read(self, name):
                assert name in FILES
                return (self.directory / name).read_bytes()
            def open(self, name):
                assert name in FILES
                return (self.directory / name).open("rb")

        def relative(path, workspace):
            prefix = workspace.rstrip("/") + "/"
            if not isinstance(path, str) or not path.startswith(prefix):
                return None
            value = path[len(prefix):]
            if not value or any(ord(c) < 32 or ord(c) == 127 for c in value):
                return None
            if value.startswith("/") or "\\" in value or ":" in value or ".." in value.split("/"):
                return None
            return value

        def add_interval(values, start, end):
            assert math.isfinite(start) and math.isfinite(end) and 0 <= start <= end
            i = bisect.bisect_left(values, (start, float("-inf")))
            if i and values[i-1][1] >= start:
                i -= 1
            j = i
            while j < len(values) and values[j][0] <= end:
                start = min(start, values[j][0])
                end = max(end, values[j][1])
                j += 1
            values[i:j] = [(start, end)]

        def trace_stats(reader, workspace):
            stacks = collections.defaultdict(list)
            unions = collections.defaultdict(list)
            interval_counts = collections.Counter()
            parsed = set()
            completed_first = {}
            completed_events = []
            source_intervals = []
            per_file = {}
            malformed = unmatched = mismatched = invalid_times = 0
            latest_stamp = 0.0
            first_check = None

            def close_interval(phase, name, path, start, end):
                add_interval(unions[phase], start, end)
                interval_counts[phase] += 1
                if phase == "check" and name == "checkSourceFile":
                    completed_events.append(end)
                    if path is not None:
                        completed_first[path] = min(end, completed_first.get(path, end))
                        source_intervals.append({"path": path, "start_seconds": start, "end_seconds": end})
                        item = per_file.setdefault(path, {"intervals": [], "events": 0, "maximum_seconds": 0.0, "first_start": start, "last_end": end})
                        add_interval(item["intervals"], start, end)
                        item["events"] += 1
                        item["maximum_seconds"] = max(item["maximum_seconds"], end-start)
                        item["first_start"] = min(item["first_start"], start)
                        item["last_end"] = max(item["last_end"], end)

            with reader.open("trace/trace.json") as stream:
                for raw in stream:
                    line = raw.decode(errors="replace").strip().strip(",")
                    if not line or line in ("[", "]"):
                        continue
                    try:
                        event = json.loads(line)
                    except ValueError:
                        malformed += 1
                        continue
                    if not isinstance(event, dict) or event.get("cat") not in PHASES:
                        continue
                    phase, kind, stamp = event["cat"], event.get("ph"), event.get("ts")
                    if not isinstance(stamp, (int, float)) or not math.isfinite(stamp) or stamp < 0:
                        invalid_times += 1
                        continue
                    stamp /= 1e6
                    latest_stamp = max(latest_stamp, stamp)
                    name = event.get("name")
                    if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{0,100}", name):
                        name = "unrecognized_event"
                    path = relative((event.get("args") or {}).get("path"), workspace)
                    if phase == "parse" and path is not None:
                        parsed.add(path)
                    key = (event.get("pid"), event.get("tid"), phase)
                    if kind == "B":
                        stacks[key].append({"phase": phase, "name": name, "start_seconds": stamp, "path": path})
                        if phase == "check" and name == "checkSourceFile":
                            first_check = stamp if first_check is None else min(first_check, stamp)
                    elif kind == "E":
                        if not stacks[key]:
                            unmatched += 1
                            continue
                        begin = stacks[key][-1]
                        if begin["name"] != name:
                            mismatched += 1
                            continue
                        if stamp < begin["start_seconds"]:
                            invalid_times += 1
                            continue
                        stacks[key].pop()
                        close_interval(phase, name, begin["path"], begin["start_seconds"], stamp)
                    elif kind == "X" and isinstance(event.get("dur"), (int, float)):
                        duration = event["dur"] / 1e6
                        if not math.isfinite(duration) or duration < 0:
                            invalid_times += 1
                            continue
                        latest_stamp = max(latest_stamp, stamp + duration)
                        close_interval(phase, name, path, stamp, stamp + duration)
                        if phase == "check" and name == "checkSourceFile":
                            first_check = stamp if first_check is None else min(first_check, stamp)

            open_spans = [item for stack in stacks.values() for item in stack]
            open_spans.sort(key=lambda x: x["start_seconds"])
            for item in open_spans:
                if item["phase"] == "check" and item["name"] == "checkSourceFile" and item["path"] is not None:
                    source_intervals.append({"path": item["path"], "start_seconds": item["start_seconds"], "end_seconds": None})
            slowest = [{"path": path, "completed_check_intervals": item["events"], "completed_union_seconds": sum(b-a for a,b in item["intervals"]), "longest_completed_interval_seconds": item["maximum_seconds"], "first_start_seconds": item["first_start"], "last_end_seconds": item["last_end"]} for path,item in per_file.items()]
            slowest.sort(key=lambda x: (-x["completed_union_seconds"], x["path"]))
            phases = {phase: {"completed_intervals": interval_counts[phase], "observed_union_seconds": sum(b-a for a,b in unions[phase]), "last_completed_end_seconds": unions[phase][-1][1] if unions[phase] else None} for phase in PHASES}
            result = {
                "observed_parsed_source_count": len(parsed),
                "observed_parsed_source_set_sha256": hashlib.sha256("\n".join(sorted(parsed)).encode()).hexdigest(),
                "observed_json_source_count": sum(path.endswith(".json") for path in parsed),
                "checkSourceFile_completed_events": len(completed_events),
                "checkSourceFile_completed_unique": len(completed_first),
                "checkSourceFile_first_start_seconds": first_check,
                "last_observed_trace_timestamp_seconds": latest_stamp,
                "phase_intervals": phases,
                "open_span_count": len(open_spans),
                "open_spans": open_spans[:20],
                "slowest_completed_source_files": slowest[:20],
                "malformed_trace_lines": malformed,
                "unmatched_end_events": unmatched,
                "mismatched_end_events": mismatched,
                "invalid_timestamps": invalid_times,
            }
            return result, completed_first, completed_events, source_intervals

        def gc_stats(reader):
            events = []
            unparsed = 0
            markers = collections.Counter()
            with reader.open("compiler.log") as stream:
                for raw in stream:
                    line = raw.decode(errors="replace")
                    match = GC_PATTERN.search(line)
                    if match:
                        events.append({"elapsed_seconds": float(match[1])/1000, "kind": match[2], "used_before_mb": float(match[3]), "used_after_mb": float(match[5]), "capacity_after_mb": float(match[6]), "reported_pause_ms": float(match[7])})
                    elif re.search(r"ms: (Scavenge|Mark-Compact|Mark-sweep|Minor Mark-Compact)", line):
                        unparsed += 1
                    for label, pattern in {"typescript_errors": r"error TS[0-9]+", "fatal_errors": "FATAL ERROR", "heap_oom": "heap out of memory"}.items():
                        if re.search(pattern, line):
                            markers[label] += 1
            return events, unparsed, dict(markers)

        def summarize_gc(events):
            counts = collections.Counter()
            pauses = collections.Counter()
            for event in events:
                counts[event["kind"]] += 1
                pauses[event["kind"]] += event["reported_pause_ms"]
            return {
                "counts": dict(counts),
                "reported_pause_ms": dict(pauses),
                "maximum_used_after_mb": max((x["used_after_mb"] for x in events), default=None),
                "maximum_capacity_after_mb": max((x["capacity_after_mb"] for x in events), default=None),
                "last_events": events[-5:],
            }

        def resource_window(resources, start, end):
            rows = [row for row in resources if start <= row["elapsed_seconds"] <= end]
            if not rows:
                return {"samples": 0, "observed_sample_interval": None}
            first, last = rows[0], rows[-1]
            duration = last["elapsed_seconds"]-first["elapsed_seconds"]
            user = last["user_cpu_seconds"]-first["user_cpu_seconds"]
            system = last["system_cpu_seconds"]-first["system_cpu_seconds"]
            return {
                "samples": len(rows),
                "observed_sample_interval": [first["elapsed_seconds"], last["elapsed_seconds"]],
                "user_cpu_delta_seconds": user,
                "system_cpu_delta_seconds": system,
                "cpu_seconds_per_observed_wall_second": (user+system)/duration if duration > 0 else None,
                "first_sampled_rss_kib": first.get("VmRSS_kib"),
                "last_sampled_rss_kib": last.get("VmRSS_kib"),
                "peak_sampled_rss_kib": max((row.get("VmRSS_kib", 0) for row in rows), default=0),
                "peak_reported_process_hwm_kib": max((row.get("VmHWM_kib", 0) for row in rows), default=0),
            }

        def checkpoint_windows(summary, completed_first, completed_events, source_intervals, resources, gc_events):
            elapsed = summary["elapsed_seconds"]
            result = []
            start = 0
            for checkpoint in CHECKPOINTS:
                reached = elapsed >= checkpoint
                observed_end = min(checkpoint, elapsed)
                observed_seconds = max(0, observed_end-start)
                valid_window = observed_end >= start
                completed_before = sum(end <= start for end in completed_first.values())
                completed_at_end = sum(end <= observed_end for end in completed_first.values()) if valid_window else None
                delta = completed_at_end-completed_before if valid_window else None
                active = [x for x in source_intervals if x["start_seconds"] <= observed_end and (x["end_seconds"] is None or observed_end < x["end_seconds"])] if valid_window else []
                gc_rows = [x for x in gc_events if (start < x["elapsed_seconds"] <= observed_end or start == 0 and x["elapsed_seconds"] == 0)] if valid_window else []
                result.append({
                    "requested_checkpoint_seconds": checkpoint,
                    "capture_reached_checkpoint": reached,
                    "nominal_window_seconds": [start, checkpoint],
                    "observed_window_end_seconds": observed_end if valid_window else None,
                    "completed_unique_at_checkpoint": sum(end <= checkpoint for end in completed_first.values()) if reached else None,
                    "completed_events_at_checkpoint": sum(end <= checkpoint for end in completed_events) if reached else None,
                    "observed_completed_unique_at_window_end": completed_at_end,
                    "newly_completed_unique_in_window": delta,
                    "completed_unique_per_observed_window_second": delta/observed_seconds if observed_seconds > 0 else None,
                    "active_source_span_count_at_observed_window_end": len(active),
                    "active_source_spans_at_observed_window_end": [{"path": x["path"], "start_seconds": x["start_seconds"]} for x in active[:10]],
                    "resources": resource_window(resources, start, observed_end) if valid_window else {"samples": 0, "observed_sample_interval": None},
                    "gc_by_reported_timestamp": summarize_gc(gc_rows),
                })
                start = checkpoint
            return result

        def analyze(reader, workflow_head, workspace):
            metadata = json.loads(reader.read("metadata.json"))
            summary = json.loads(reader.read("summary.json"))
            assert metadata["source_commit"] == SOURCE and metadata["source_tree"] == TREE, "Source target mismatch"
            assert metadata["workflow_commit"] == workflow_head, "Workflow provenance mismatch"
            assert metadata["node_version"] == "v20.20.2" and metadata["npm_version"] == "10.8.2" and metadata["typescript_version"] == "5.9.3", "Runtime mismatch"
            assert metadata["input_blobs"] == INPUTS and metadata["type_check_script"] == "tsc --noEmit", "Compiler input mismatch"
            assert metadata["node_options"] == OPTIONS, "Unexpected compiler flags"
            assert metadata["counts_as_required_gate"] is False and summary["counts_as_required_gate"] is False
            assert summary["limit_seconds"] == 900 and summary["grace_seconds"] == 10, "Capture limits changed"
            if summary["cutoff_reached"]:
                assert summary["complete"] is False and summary["exit_code"] == 124, "Cutoff must stay incomplete and failed"
            if summary["complete"]:
                assert summary["exit_code"] in (0, 1, 2) and not summary["cutoff_reached"]
                assert summary["trace_closed"] and summary["extended_diagnostics_total_time_reported"]
            assert summary["exit_code"] != 0 or summary["complete"] is True
            resources = [json.loads(line) for line in reader.read("resources.jsonl").splitlines() if line]
            resources.sort(key=lambda row: row["elapsed_seconds"])
            trace, completed_first, completed_events, source_intervals = trace_stats(reader, workspace)
            gc_events, gc_unparsed, markers = gc_stats(reader)
            fields = ("complete", "counts_as_required_gate", "status", "limit_seconds", "grace_seconds", "elapsed_seconds", "compiler_exit_code", "exit_code", "cutoff_reached", "forced_kill_after_grace", "user_cpu_seconds", "system_cpu_seconds", "maximum_rss_kib", "trace_closed", "extended_diagnostics_total_time_reported")
            return {
                "analysis_only": True,
                "counts_as_required_gate": False,
                "source_commit": SOURCE, "source_tree": TREE, "workflow_commit": workflow_head,
                "runtime": {key: metadata[key] for key in ("node_version", "npm_version", "typescript_version")},
                "node_options": OPTIONS, "input_blobs_verified": True,
                "summary": {key: summary.get(key) for key in fields},
                "trace": trace,
                "checkpoints": checkpoint_windows(summary, completed_first, completed_events, source_intervals, resources, gc_events),
                "resources": {"samples": len(resources), "peak_sampled_rss_kib": max((row.get("VmRSS_kib", 0) for row in resources), default=0), "sample_resolution_seconds": 1},
                "gc": {**summarize_gc(gc_events), "unparsed_lines": gc_unparsed, "largest_reported_pauses": sorted(gc_events, key=lambda x: -x["reported_pause_ms"])[:10]},
                "compiler_marker_counts": markers,
                "limitations": [
                    "This is a bounded diagnostic, never the required TypeScript gate.",
