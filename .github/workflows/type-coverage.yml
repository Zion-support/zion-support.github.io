name: TypeScript Performance Diagnostic
run-name: TypeScript diagnostic 180s semi64 — d3c73060

"on":
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: typescript-performance-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-typescript-diagnostic:
    name: TypeScript performance diagnostic (180s, semi64)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable source target
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: d3c73060d57fd984861123ee0bf784a33ae57a2c
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize incomplete diagnostic record
        run: |
          PROFILE_DIR="$RUNNER_TEMP/typescript-diagnostic"
          echo "PROFILE_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROFILE_DIR"
          printf '%s\n' '{"complete":false,"counts_as_required_gate":false,"status":"setup"}' > "$PROFILE_DIR/summary.json"
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Capture bounded compiler diagnostic
        env:
          NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import time
          
          TARGET = "d3c73060d57fd984861123ee0bf784a33ae57a2c"
          TARGET_TREE = "900ee823a411b6fe813f26db6104b5cab6d85d00"
          
          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2) + "\n")
          
          def observe(command, out, limit_seconds=180, grace_seconds=10):
              out.mkdir(parents=True, exist_ok=True)
              started = time.monotonic()
              summary = {
                  "complete": False,
                  "counts_as_required_gate": False,
                  "status": "running",
                  "limit_seconds": limit_seconds,
                  "grace_seconds": grace_seconds,
              }
              write_json(out / "summary.json", summary)
              clock_ticks = os.sysconf("SC_CLK_TCK")
              cutoff = False
              killed = False
              with (out / "compiler.log").open("w") as log, (out / "resources.jsonl").open("w") as samples:
                  child = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      while True:
                          finished_pid, status, usage = os.wait4(child.pid, os.WNOHANG)
                          if finished_pid:
                              child.returncode = os.waitstatus_to_exitcode(status)
                              break
                          elapsed = time.monotonic() - started
                          try:
                              stat = Path(f"/proc/{child.pid}/stat").read_text()
                              fields = stat[stat.rfind(")") + 2:].split()
                              memory = {}
                              for line in Path(f"/proc/{child.pid}/status").read_text().splitlines():
                                  if line.startswith(("VmRSS:", "VmHWM:")):
                                      key, value, _unit = line.split()
                                      memory[key.rstrip(":") + "_kib"] = int(value)
                              sample = {
                                  "elapsed_seconds": elapsed,
                                  "user_cpu_seconds": int(fields[11]) / clock_ticks,
                                  "system_cpu_seconds": int(fields[12]) / clock_ticks,
                                  **memory,
                              }
                              samples.write(json.dumps(sample) + "\n")
                              samples.flush()
                          except (FileNotFoundError, ProcessLookupError):
                              pass
                          if not cutoff and elapsed >= limit_seconds:
                              cutoff = True
                              try:
                                  os.killpg(child.pid, signal.SIGINT)
                              except ProcessLookupError:
                                  pass
                          elif cutoff and not killed and elapsed >= limit_seconds + grace_seconds:
                              killed = True
                              try:
                                  os.killpg(child.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                          time.sleep(min(1, max(0.01, limit_seconds - elapsed)) if not cutoff else 0.1)
                  except BaseException:
                      try:
                          os.killpg(child.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      _pid, status, _usage = os.wait4(child.pid, 0)
                      child.returncode = os.waitstatus_to_exitcode(status)
                      summary["status"] = "controller_interrupted"
                      write_json(out / "summary.json", summary)
                      raise
              raw_exit = child.returncode
              effective_exit = 124 if cutoff else (128 - raw_exit if raw_exit < 0 else raw_exit)
              trace = out / "trace" / "trace.json"
              trace_closed = False
              events = collections.Counter()
              last_events = collections.deque(maxlen=20)
              if trace.exists():
                  with trace.open("rb") as source:
                      source.seek(max(0, trace.stat().st_size - 64))
                      trace_closed = source.read().rstrip().endswith(b"]")
                  with trace.open(errors="replace") as source:
                      for line in source:
                          try:
                              event = json.loads(line.strip().strip(","))
                          except (ValueError, TypeError):
                              continue
                          if isinstance(event, dict) and event.get("cat"):
                              events[event["cat"]] += 1
                              last_events.append({key: event[key] for key in ("cat", "name", "ph", "ts", "dur", "args") if key in event})
              total_time_reported = False
              with (out / "compiler.log").open(errors="replace") as source:
                  total_time_reported = any(line.startswith("Total time:") for line in source)
              complete = not cutoff and raw_exit in (0, 1, 2) and trace_closed and total_time_reported
              if effective_exit == 0 and not complete:
                  effective_exit = 1
              summary.update({
                  "complete": complete,
                  "status": "cutoff" if cutoff else ("finished" if complete else "terminated_without_complete_trace"),
                  "elapsed_seconds": time.monotonic() - started,
                  "compiler_exit_code": raw_exit,
                  "exit_code": effective_exit,
                  "cutoff_reached": cutoff,
                  "forced_kill_after_grace": killed,
                  "user_cpu_seconds": usage.ru_utime,
                  "system_cpu_seconds": usage.ru_stime,
                  "maximum_rss_kib": usage.ru_maxrss,
                  "trace_closed": trace_closed,
                  "extended_diagnostics_total_time_reported": total_time_reported,
                  "trace_event_counts": dict(events),
                  "last_trace_events": list(last_events),
                  "trace_warning": "Raw trace may be incomplete after termination; no missing events or durations are synthesized.",
              })
              write_json(out / "summary.json", summary)
              return summary, effective_exit
          
          def output(args):
              return subprocess.check_output(args, text=True).strip()
          
          def main():
              out = Path(os.environ["PROFILE_DIR"])
              head = output(["git", "rev-parse", "HEAD"])
              tree = output(["git", "rev-parse", "HEAD^{tree}"])
              if head != TARGET or tree != TARGET_TREE:
                  raise SystemExit("Checkout does not match the immutable diagnostic target")
              package = json.loads(Path("package.json").read_text())
              version = output(["node", "-p", "require('typescript/package.json').version"])
              if package["scripts"]["type-check"] != "tsc --noEmit" or version != "5.9.3":
                  raise SystemExit("Compiler contract differs from the measured CI run")
              subprocess.run(["git", "diff", "--exit-code", "--", "package.json", "package-lock.json", "tsconfig.json"], check=True)
              metadata = {
                  "source_commit": head,
                  "source_tree": tree,
                  "workflow_commit": os.environ["GITHUB_SHA"],
                  "node_version": output(["node", "--version"]),
                  "npm_version": output(["npm", "--version"]),
                  "typescript_version": version,
                  "type_check_script": package["scripts"]["type-check"],
                  "node_options": os.environ["NODE_OPTIONS"],
                  "input_blobs": {path: output(["git", "hash-object", path]) for path in ("package.json", "package-lock.json", "tsconfig.json")},
                  "counts_as_required_gate": False,
              }
              write_json(out / "metadata.json", metadata)
              command = [
                  "node", "--trace-gc", "node_modules/typescript/bin/tsc",
                  "--noEmit", "--extendedDiagnostics", "--generateTrace", str(out / "trace"),
              ]
              summary, status = observe(command, out)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as report:
                  report.write("## TypeScript performance diagnostic\n\n")
                  report.write("This run is not the required TypeScript validation.\n\n")
                  report.write(f"- Source commit: {head}\n- Complete: {str(summary['complete']).lower()}\n")
                  report.write(f"- Exit code: {status}\n- Elapsed seconds: {summary['elapsed_seconds']:.1f}\n")
                  report.write(f"- Maximum RSS (KiB): {summary['maximum_rss_kib']}\n")
              raise SystemExit(status)
          
          if __name__ == "__main__":
              main()
          
          PY
      - name: Upload diagnostic evidence
        id: sample-evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: typescript-diagnostic-d3c73060-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/typescript-diagnostic/metadata.json
            ${{ runner.temp }}/typescript-diagnostic/summary.json
            ${{ runner.temp }}/typescript-diagnostic/resources.jsonl
            ${{ runner.temp }}/typescript-diagnostic/compiler.log
            ${{ runner.temp }}/typescript-diagnostic/trace/trace.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Compare baseline and variant inside GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT_ARTIFACT_ID: ${{ steps.sample-evidence.outputs.artifact-id }}
          VARIANT_ARTIFACT_DIGEST: ${{ steps.sample-evidence.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          
          ARTIFACT = 13025442293
          RUN = 41156498780
          EXPECTED_SHA256 = "f76cd92fcc87ad084c3de1e74b2b68bf44f30983f7dca1a952563fc7d930e9a3"
          EXPECTED_BYTES = 5296634
          API = "https://api.github.com/repos/Zion-support/zion-support.github.io"
          HEAD = "e8dc480cc8a59915c2c8d8969cf0a14234aa94ce"
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zion-diagnostic-artifact-analysis",
          }
          def api_request(path):
              return opener.open(urllib.request.Request(API + path, headers=headers), timeout=60)
          
          try:
              with api_request(f"/actions/artifacts/{ARTIFACT}") as response:
                  meta = json.load(response)
          except Exception as exc:
              raise SystemExit(f"Artifact metadata request failed ({type(exc).__name__}, HTTP {getattr(exc, 'code', 'n/a')})") from None
          assert meta["id"] == ARTIFACT, "Wrong artifact"
          assert meta["name"] == "typescript-diagnostic-d3c73060-41156498780", "Wrong artifact name"
          assert meta["workflow_run"]["id"] == RUN, "Wrong source run"
          assert meta["workflow_run"]["head_sha"] == HEAD, "Wrong diagnostic workflow commit"
          assert meta["digest"] == "sha256:" + EXPECTED_SHA256, "Metadata digest mismatch"
          assert meta["size_in_bytes"] == EXPECTED_BYTES and not meta["expired"], "Wrong artifact size or expired artifact"
          
          try:
              response = api_request(f"/actions/artifacts/{ARTIFACT}/zip")
          except urllib.error.HTTPError as exc:
              if exc.code != 302:
                  raise SystemExit(f"Artifact redirect request failed (HTTP {exc.code})") from None
              location = exc.headers.get("Location", "")
              exc.close()
          except Exception as exc:
              raise SystemExit(f"Artifact redirect request failed ({type(exc).__name__})") from None
          else:
              response.close()
              raise SystemExit("Expected the authenticated API to return a download redirect")
          
          parsed = urllib.parse.urlsplit(location)
          assert parsed.scheme == "https" and parsed.username is None and parsed.password is None, "Unsafe artifact location"
          assert parsed.hostname and parsed.hostname.endswith((".blob.core.windows.net", ".githubusercontent.com")), "Unexpected artifact storage host"
          assert parsed.port in (None, 443), "Unexpected artifact storage port"
          destination = Path(os.environ["RUNNER_TEMP"]) / "typescript-diagnostic-41156498780.zip"
          digest = hashlib.sha256()
          received = 0
          try:
              # Fresh request: the GitHub API Authorization header is never forwarded to storage.
              request = urllib.request.Request(location, headers={"User-Agent": "zion-diagnostic-artifact-analysis"})
              with urllib.request.urlopen(request, timeout=60) as response, destination.open("wb") as target:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      received += len(chunk)
                      if received > EXPECTED_BYTES:
                          raise ValueError("Artifact exceeded its verified size")
                      digest.update(chunk)
                      target.write(chunk)
          except Exception as exc:
              destination.unlink(missing_ok=True)
              raise SystemExit(f"Artifact storage read failed ({type(exc).__name__}, HTTP {getattr(exc, 'code', 'n/a')})") from None
          assert received == EXPECTED_BYTES, "Incomplete artifact"
          assert digest.hexdigest() == EXPECTED_SHA256, "Downloaded ZIP digest mismatch"
          print(json.dumps({"artifact_id": ARTIFACT, "run_id": RUN, "bytes": received, "sha256": digest.hexdigest(), "integrity_verified": True}))
          
          # Comparison analysis begins; no real artifact leaves GitHub.
          import bisect, collections, hashlib, json, os, re, zipfile
          from pathlib import Path
          
          SOURCE = "d3c73060d57fd984861123ee0bf784a33ae57a2c"
          TREE = "900ee823a411b6fe813f26db6104b5cab6d85d00"
          BASELINE_HEAD = "e8dc480cc8a59915c2c8d8969cf0a14234aa94ce"
          OLD_OPTIONS = "--max-old-space-size=12288"
          NEW_OPTIONS = OLD_OPTIONS + " --max-semi-space-size=64"
          INPUTS = {"package.json": "8f572286b94f517a07f83fbddeba350653ded85e", "package-lock.json": "e79ec8d8bf85ad622306cf39714ec3fbd56c9530", "tsconfig.json": "c128011dc8f2ddb69da4f11dd57b09abe501dacb"}
          PREFIX = "/home/runner/work/zion-support.github.io/zion-support.github.io/"
          FILES = {"metadata.json", "summary.json", "resources.jsonl", "compiler.log", "trace/trace.json"}
          
          def relative(path):
              return path[len(PREFIX):] if isinstance(path, str) and path.startswith(PREFIX) else None
          
          class LocalCapture:
              def __init__(self, directory):
                  self.directory = directory
              def read(self, name):
                  assert name in FILES
                  return (self.directory / name).read_bytes()
              def open(self, name):
                  assert name in FILES
                  return (self.directory / name).open("rb")
          
          def analyze(reader, expected_options, expected_head, baseline=False):
              metadata = json.loads(reader.read("metadata.json"))
              summary = json.loads(reader.read("summary.json"))
              assert metadata["source_commit"] == SOURCE and metadata["source_tree"] == TREE, "Source target mismatch"
              assert metadata["workflow_commit"] == expected_head, "Workflow provenance mismatch"
              assert metadata["node_version"] == "v20.20.2" and metadata["npm_version"] == "10.8.2" and metadata["typescript_version"] == "5.9.3", "Runtime mismatch"
              assert metadata["input_blobs"] == INPUTS and metadata["type_check_script"] == "tsc --noEmit", "Compiler input mismatch"
              assert metadata["node_options"] == expected_options, "Unexpected compiler flags"
              assert metadata["counts_as_required_gate"] is False and summary["counts_as_required_gate"] is False
              assert summary["limit_seconds"] == 180 and summary["grace_seconds"] == 10, "Capture limits changed"
              if summary["cutoff_reached"]:
                  assert summary["complete"] is False and summary["exit_code"] == 124
              if baseline:
                  assert summary["cutoff_reached"] and summary["exit_code"] == 124
              if summary["complete"]:
                  assert summary["exit_code"] in (0, 1, 2) and not summary["cutoff_reached"]
              resources = [json.loads(line) for line in reader.read("resources.jsonl").splitlines() if line]
              stacks = collections.defaultdict(list)
              unions = collections.defaultdict(list)
              interval_counts = collections.Counter()
              event_counts = collections.Counter()
              parsed = set()
              completed = set()
              progress = []
              completed_events = 0
              malformed = 0
              unmatched = 0
              first_check = None
          
              def add_interval(phase, start, end):
                  interval_counts[phase] += 1
                  values = unions[phase]
                  i = bisect.bisect_left(values, (start, float("-inf")))
                  if i and values[i-1][1] >= start:
                      i -= 1
                  j = i
                  while j < len(values) and values[j][0] <= end:
                      start = min(start, values[j][0])
                      end = max(end, values[j][1])
                      j += 1
                  values[i:j] = [(start, end)]
          
              with reader.open("trace/trace.json") as stream:
                  for raw in stream:
                      line = raw.decode(errors="replace").strip().strip(",")
                      if not line or line in ("[", "]"):
                          continue
                      try:
                          event = json.loads(line)
                      except ValueError:
                          malformed += 1
                          continue
                      if not isinstance(event, dict):
                          continue
                      phase, kind, stamp = event.get("cat"), event.get("ph"), event.get("ts", 0)
                      event_counts[phase] += 1
                      path = relative((event.get("args") or {}).get("path"))
                      if phase == "parse" and path is not None:
                          parsed.add(path)
                      key = (event.get("pid"), event.get("tid"), phase)
                      if kind == "B":
                          stacks[key].append(event)
                          if phase == "check" and event.get("name") == "checkSourceFile" and first_check is None:
                              first_check = stamp / 1e6
                      elif kind == "E":
                          if not stacks[key]:
                              unmatched += 1
                              continue
                          begin = stacks[key].pop()
                          add_interval(phase, begin["ts"], stamp)
                          if phase == "check" and begin.get("name") == "checkSourceFile" and event.get("name") == "checkSourceFile":
                              completed_events += 1
                              source = relative((begin.get("args") or {}).get("path"))
                              if source is not None and source not in completed:
                                  completed.add(source)
                                  progress.append((source, stamp / 1e6))
                      elif kind == "X" and "dur" in event:
                          add_interval(phase, stamp, stamp + event["dur"])
              phases = {phase: {"completed_intervals": interval_counts[phase], "observed_union_seconds": sum(b-a for a,b in unions[phase])/1e6, "last_completed_end_seconds": unions[phase][-1][1]/1e6 if unions[phase] else None} for phase in ("program", "parse", "bind", "check", "checkTypes")}
              open_spans = [{"phase": key[2], "name": event.get("name"), "start_seconds": event.get("ts", 0)/1e6, "path": relative((event.get("args") or {}).get("path"))} for key, values in stacks.items() for event in values]
              gc_counts = collections.Counter()
              gc_pauses = collections.Counter()
              gc_recent = collections.deque(maxlen=5)
              gc_unparsed = 0
              markers = collections.Counter()
              gc_pattern = re.compile(r"([0-9.]+) ms: (Scavenge|Mark-Compact|Mark-sweep|Minor Mark-Compact).*?([0-9.]+) \(([0-9.]+)\) -> ([0-9.]+) \(([0-9.]+)\) MB, (?:pooled: [0-9.]+ MB, )?([0-9.]+) / ([0-9.]+) ms")
              with reader.open("compiler.log") as stream:
                  for raw in stream:
                      line = raw.decode(errors="replace")
                      match = gc_pattern.search(line)
                      if match:
                          gc_counts[match[2]] += 1
                          gc_pauses[match[2]] += float(match[7])
                          gc_recent.append({"elapsed_ms": float(match[1]), "kind": match[2], "used_before_mb": float(match[3]), "used_after_mb": float(match[5]), "capacity_after_mb": float(match[6]), "pause_ms": float(match[7])})
                      elif re.search(r"ms: (Scavenge|Mark-Compact|Mark-sweep|Minor Mark-Compact)", line):
                          gc_unparsed += 1
                      for label, pattern in {"typescript_errors": r"error TS[0-9]+", "fatal_errors": "FATAL ERROR", "heap_oom": "heap out of memory"}.items():
                          if re.search(pattern, line):
                              markers[label] += 1
              fields = ("complete", "counts_as_required_gate", "status", "limit_seconds", "grace_seconds", "elapsed_seconds", "compiler_exit_code", "exit_code", "cutoff_reached", "forced_kill_after_grace", "user_cpu_seconds", "system_cpu_seconds", "maximum_rss_kib", "trace_closed")
              resource_fields = ("elapsed_seconds", "user_cpu_seconds", "system_cpu_seconds", "VmRSS_kib", "VmHWM_kib")
              timeline = [{key: value for key, value in min(resources, key=lambda row: abs(row["elapsed_seconds"]-second)).items() if key in resource_fields} for second in (0, 30, 60, 90, 120, 150, 180)] if resources else []
              result = {
                  "node_options": expected_options,
                  "runtime": {key: metadata[key] for key in ("node_version", "npm_version", "typescript_version")},
                  "source_commit": SOURCE, "source_tree": TREE, "workflow_commit": expected_head, "input_blobs_verified": True,
                  "summary": {key: summary.get(key) for key in fields},
                  "parsed_source_count": len(parsed), "parsed_source_set_sha256": hashlib.sha256("\n".join(sorted(parsed)).encode()).hexdigest(),
                  "json_source_count": sum(path.endswith(".json") for path in parsed),
                  "checkSourceFile_completed_events": completed_events, "checkSourceFile_completed_unique": len(completed),
                  "checkSourceFile_first_start_seconds": first_check, "last_completed_source_files": [{"path": path, "end_seconds": stamp} for path, stamp in progress[-5:]],
                  "phase_intervals": phases, "open_spans": open_spans[-10:], "malformed_trace_lines": malformed, "unmatched_end_events": unmatched,
                  "resources": {"samples": len(resources), "peak_sampled_rss_kib": max((row.get("VmRSS_kib", 0) for row in resources), default=0), "timeline": timeline},
                  "gc": {"counts": dict(gc_counts), "reported_pause_ms": dict(gc_pauses), "unparsed_lines": gc_unparsed, "recent": list(gc_recent)},
                  "compiler_marker_counts": dict(markers),
              }
              return result, progress, resources
          
          def comparison_metrics(base, variant, base_progress, variant_progress, base_resources, variant_resources):
              count = base["checkSourceFile_completed_unique"]
              other = variant["checkSourceFile_completed_unique"]
              result = {
                  "same_parsed_source_set": base["parsed_source_set_sha256"] == variant["parsed_source_set_sha256"] and base["parsed_source_count"] == variant["parsed_source_count"],
                  "completed_source_ratio": other / count if count else None,
                  "completed_source_difference": other - count,
                  "scavenge_pause_ms_per_completed_source": {"baseline": base["gc"]["reported_pause_ms"].get("Scavenge", 0)/count if count else None, "variant": variant["gc"]["reported_pause_ms"].get("Scavenge", 0)/other if other else None},
                  "peak_sampled_rss_difference_kib": variant["resources"]["peak_sampled_rss_kib"] - base["resources"]["peak_sampled_rss_kib"],
              }
              if count and len(variant_progress) >= count:
                  same_prefix = [row[0] for row in base_progress] == [row[0] for row in variant_progress[:count]]
                  result["same_completed_source_prefix"] = same_prefix
                  if same_prefix and base_resources and variant_resources:
                      t0, t1 = base_progress[count-1][1], variant_progress[count-1][1]
                      a = min(base_resources, key=lambda row: abs(row["elapsed_seconds"]-t0))
                      b = min(variant_resources, key=lambda row: abs(row["elapsed_seconds"]-t1))
                      result["at_equal_completed_source_count"] = {"count": count, "baseline_completed_at_seconds": t0, "variant_completed_at_seconds": t1, "baseline_nearest_rss_kib": a.get("VmRSS_kib"), "variant_nearest_rss_kib": b.get("VmRSS_kib"), "sample_resolution_seconds": 1}
              return result
          
          def main():
              baseline_path = Path(os.environ["RUNNER_TEMP"]) / "typescript-diagnostic-41156498780.zip"
              assert hashlib.sha256(baseline_path.read_bytes()).hexdigest() == "f76cd92fcc87ad084c3de1e74b2b68bf44f30983f7dca1a952563fc7d930e9a3", "Baseline ZIP changed"
              artifact_id = os.environ["VARIANT_ARTIFACT_ID"]
              assert artifact_id.isdigit(), "Variant artifact upload did not return an ID"
              artifact_digest = os.environ["VARIANT_ARTIFACT_DIGEST"].removeprefix("sha256:")
              assert re.fullmatch(r"[0-9a-f]{64}", artifact_digest), "Invalid variant artifact digest"
              try:
                  with api_request("/actions/artifacts/" + artifact_id) as response:
                      variant_meta = json.load(response)
              except Exception as exc:
                  raise SystemExit(f"Variant artifact metadata failed ({type(exc).__name__}, HTTP {getattr(exc, 'code', 'n/a')})") from None
              assert variant_meta["workflow_run"]["id"] == int(os.environ["GITHUB_RUN_ID"])
              assert variant_meta["workflow_run"]["head_sha"] == os.environ["GITHUB_SHA"]
              assert variant_meta["name"] == "typescript-diagnostic-d3c73060-" + os.environ["GITHUB_RUN_ID"]
              assert variant_meta["digest"] == "sha256:" + artifact_digest and not variant_meta["expired"]
              with zipfile.ZipFile(baseline_path) as reader:
                  assert {item.filename for item in reader.infolist() if not item.is_dir()} == FILES
                  baseline, baseline_progress, baseline_resources = analyze(reader, OLD_OPTIONS, BASELINE_HEAD, baseline=True)
              variant, variant_progress, variant_resources = analyze(LocalCapture(Path(os.environ["PROFILE_DIR"])), NEW_OPTIONS, os.environ["GITHUB_SHA"])
              report = {
                  "analysis_only": True, "counts_as_required_gate": False,
                  "baseline_artifact_id": 13025442293, "baseline_run_id": 41156498780,
                  "variant_artifact_id": int(artifact_id), "variant_artifact_sha256": artifact_digest,
                  "baseline": baseline, "variant": variant,
                  "comparison": comparison_metrics(baseline, variant, baseline_progress, variant_progress, baseline_resources, variant_resources),
                  "limitations": ["One hosted runner sample per configuration; host variation is not eliminated.", "Both profiles include the same tracing overhead.", "Partial progress does not establish full TypeScript validity or predict total runtime.", "Phase categories can overlap; unfinished spans are not added to completed durations.", "GC pause sums do not include every background GC cost."],
              }
              print("TYPESCRIPT_COMPARISON " + json.dumps(report, separators=(",", ":")))
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write("\n## Bounded semi-space comparison\n\n")
                  summary.write("The required TypeScript gate is unchanged. This comparison does not certify the repository.\n\n")
                  summary.write(f"- Completed distinct checkSourceFile events: baseline {baseline['checkSourceFile_completed_unique']}; variant {variant['checkSourceFile_completed_unique']}\n")
                  summary.write(f"- Variant compiler exit: {variant['summary']['exit_code']}; complete: {variant['summary']['complete']}\n")
          
          if __name__ == "__main__":
              main()
          
