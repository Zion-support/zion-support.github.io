# Manual paired performance diagnosis on the same immutable source tree; never the required TypeScript gate.
name: TypeScript Paired Diagnostic
run-name: TypeScript paired diagnostic 900s without generateTrace - c286a4a3
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: typescript-performance-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-typescript-diagnostic:
    name: TypeScript paired diagnostic (900s, semi64, trace off)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout immutable source target
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        ref: c286a4a3e46ba53f55d8fc2583ab475be5e2a157
        fetch-depth: 1
        persist-credentials: false
    - name: Initialize incomplete diagnostic record
      run: |
        PROFILE_DIR="$RUNNER_TEMP/typescript-diagnostic"
        echo "PROFILE_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"
        mkdir -p "$PROFILE_DIR"
        printf '%s\n' '{"complete":false,"counts_as_required_gate":false,"status":"setup"}' > "$PROFILE_DIR/summary.json"
    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 20.20.2
        cache: npm
    - name: Install exact dependencies
      run: npm ci
    - name: Capture compiler diagnostic without generateTrace (up to 900 seconds)
      env:
        NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
      run: |
        python3 - <<'PY'
        import re
        import json
        import os
        from pathlib import Path
        import signal
        import subprocess
        import time

        TARGET = "c286a4a3e46ba53f55d8fc2583ab475be5e2a157"
        TARGET_TREE = "dc138bc3906076edbf658daff2fa26853dda9b47"

        def write_json(path, value):
            path.write_text(json.dumps(value, indent=2) + "\n")

        def observe(command, out, limit_seconds=180, grace_seconds=10):
            out.mkdir(parents=True, exist_ok=True)
            started = time.monotonic()
            summary = {
                "complete": False,
                "counts_as_required_gate": False,
                "status": "running",
                "limit_seconds": limit_seconds,
                "grace_seconds": grace_seconds,
            }
            write_json(out / "summary.json", summary)
            clock_ticks = os.sysconf("SC_CLK_TCK")
            cutoff = False
            killed = False
            with (out / "compiler.log").open("w") as log, (out / "resources.jsonl").open("w") as samples:
                child = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                try:
                    while True:
                        finished_pid, status, usage = os.wait4(child.pid, os.WNOHANG)
                        if finished_pid:
                            child.returncode = os.waitstatus_to_exitcode(status)
                            break
                        elapsed = time.monotonic() - started
                        try:
                            stat = Path(f"/proc/{child.pid}/stat").read_text()
                            fields = stat[stat.rfind(")") + 2:].split()
                            memory = {}
                            for line in Path(f"/proc/{child.pid}/status").read_text().splitlines():
                                if line.startswith(("VmRSS:", "VmHWM:")):
                                    key, value, _unit = line.split()
                                    memory[key.rstrip(":") + "_kib"] = int(value)
                            sample = {
                                "elapsed_seconds": elapsed,
                                "user_cpu_seconds": int(fields[11]) / clock_ticks,
                                "system_cpu_seconds": int(fields[12]) / clock_ticks,
                                **memory,
                            }
                            samples.write(json.dumps(sample) + "\n")
                            samples.flush()
                        except (FileNotFoundError, ProcessLookupError):
                            pass
                        if not cutoff and elapsed >= limit_seconds:
                            cutoff = True
                            try:
                                os.killpg(child.pid, signal.SIGINT)
                            except ProcessLookupError:
                                pass
                        elif cutoff and not killed and elapsed >= limit_seconds + grace_seconds:
                            killed = True
                            try:
                                os.killpg(child.pid, signal.SIGKILL)
                            except ProcessLookupError:
                                pass
                        time.sleep(min(1, max(0.01, limit_seconds - elapsed)) if not cutoff else 0.1)
                except BaseException:
                    try:
                        os.killpg(child.pid, signal.SIGKILL)
                    except ProcessLookupError:
                        pass
                    _pid, status, _usage = os.wait4(child.pid, 0)
                    child.returncode = os.waitstatus_to_exitcode(status)
                    summary["status"] = "controller_interrupted"
                    write_json(out / "summary.json", summary)
                    raise
            raw_exit = child.returncode
            effective_exit = 124 if cutoff else (128 - raw_exit if raw_exit < 0 else raw_exit)
            trace_file_present = (out / "trace" / "trace.json").exists()
            total_time_values = []
            total_time_pattern = re.compile(r"^Total time:\s+([0-9]+(?:\.[0-9]+)?)s\s*$")
            with (out / "compiler.log").open(errors="replace") as source:
                for line in source:
                    match = total_time_pattern.fullmatch(line.strip())
                    if match:
                        total_time_values.append(float(match[1]))
            total_time_reported = bool(total_time_values)
            complete = not cutoff and raw_exit in (0, 1, 2) and total_time_reported
            if effective_exit == 0 and not complete:
                effective_exit = 1
            summary.update({
                "complete": complete,
                "status": "cutoff" if cutoff else ("finished" if complete else "terminated_without_final_diagnostics"),
                "elapsed_seconds": time.monotonic() - started,
                "compiler_exit_code": raw_exit,
                "exit_code": effective_exit,
                "cutoff_reached": cutoff,
                "forced_kill_after_grace": killed,
                "user_cpu_seconds": usage.ru_utime,
                "system_cpu_seconds": usage.ru_stime,
                "maximum_rss_kib": usage.ru_maxrss,
                "trace_requested": False,
                "trace_file_present": trace_file_present,
                "compiler_succeeded": complete and raw_exit == 0,
                "extended_diagnostics_total_time_reported": total_time_reported,
                "extended_diagnostics_total_time_seconds": total_time_values[-1] if total_time_values else None,
                "extended_diagnostics_total_time_reports": len(total_time_values),
                "trace_warning": "generateTrace intentionally disabled; no file progress, phase timing, or open spans are available.",
            })
            write_json(out / "summary.json", summary)
            return summary, effective_exit

        def output(args):
            return subprocess.check_output(args, text=True).strip()

        def main():
            out = Path(os.environ["PROFILE_DIR"])
            head = output(["git", "rev-parse", "HEAD"])
            tree = output(["git", "rev-parse", "HEAD^{tree}"])
            if head != TARGET or tree != TARGET_TREE:
                raise SystemExit("Checkout does not match the immutable diagnostic target")
            package = json.loads(Path("package.json").read_text())
            version = output(["node", "-p", "require('typescript/package.json').version"])
            if package["scripts"]["type-check"] != "tsc --noEmit" or version != "5.9.3":
                raise SystemExit("Compiler contract differs from the measured CI run")
            subprocess.run(["git", "diff", "--exit-code", "--", "package.json", "package-lock.json", "tsconfig.json"], check=True)
            node_version = output(["node", "--version"])
            npm_version = output(["npm", "--version"])
            if node_version != "v20.20.2" or npm_version != "10.8.2":
                raise SystemExit("Runtime version differs from the measured gate")
            if os.environ["NODE_OPTIONS"] != "--max-old-space-size=12288 --max-semi-space-size=64":
                raise SystemExit("Compiler resource flags differ from the measured gate")
            expected_inputs = {"package.json": "8f572286b94f517a07f83fbddeba350653ded85e", "package-lock.json": "e79ec8d8bf85ad622306cf39714ec3fbd56c9530", "tsconfig.json": "c128011dc8f2ddb69da4f11dd57b09abe501dacb"}
            input_blobs = {path: output(["git", "hash-object", path]) for path in expected_inputs}
            if input_blobs != expected_inputs:
                raise SystemExit("Compiler input blobs differ from the immutable target")
            command = [
                "node", "--trace-gc", "node_modules/typescript/bin/tsc",
                "--noEmit", "--extendedDiagnostics",
            ]
            metadata = {
                "source_commit": head,
                "source_tree": tree,
                "workflow_commit": os.environ["GITHUB_SHA"],
                "node_version": node_version,
                "npm_version": npm_version,
                "typescript_version": version,
                "type_check_script": package["scripts"]["type-check"],
                "node_options": os.environ["NODE_OPTIONS"],
                "input_blobs": input_blobs,
                "command": command,
                "trace_requested": False,
                "counts_as_required_gate": False,
            }
            write_json(out / "metadata.json", metadata)
            summary, status = observe(command, out, limit_seconds=900, grace_seconds=10)
            with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as report:
                report.write("## Paired TypeScript performance diagnostic without generateTrace\n\n")
                report.write("This run is not the required TypeScript validation.\n\n")
                report.write(f"- Source commit: {head}\n- Complete: {str(summary['complete']).lower()}\n")
                report.write(f"- Exit code: {status}\n- Elapsed seconds: {summary['elapsed_seconds']:.1f}\n")
                report.write(f"- Maximum RSS (KiB): {summary['maximum_rss_kib']}\n")
            raise SystemExit(status)

        if __name__ == "__main__":
            main()
        PY
    - name: Analyze paired capture locally inside GitHub
      if: always()
      run: |
        python3 - <<'PY'
        import collections
        from decimal import Decimal
        import hashlib
        import json
        import math
        import os
        from pathlib import Path
        import re

        SOURCE = "c286a4a3e46ba53f55d8fc2583ab475be5e2a157"
        TREE = "dc138bc3906076edbf658daff2fa26853dda9b47"
        OPTIONS = "--max-old-space-size=12288 --max-semi-space-size=64"
        INPUTS = {"package.json": "8f572286b94f517a07f83fbddeba350653ded85e", "package-lock.json": "e79ec8d8bf85ad622306cf39714ec3fbd56c9530", "tsconfig.json": "c128011dc8f2ddb69da4f11dd57b09abe501dacb"}
        COMMAND = ["node", "--trace-gc", "node_modules/typescript/bin/tsc", "--noEmit", "--extendedDiagnostics"]
        CHECKPOINTS = (180, 360, 600, 900)
        FILES = {"metadata.json", "summary.json", "resources.jsonl", "compiler.log"}
        NUMBER = r"[0-9]+(?:\.[0-9]+)?"
        GC_KINDS = r"Minor Mark-Compact|Mark-Compact|Mark-sweep|Scavenge"
        GC_LINE = re.compile(r"(?P<timestamp>" + NUMBER + r")\s+ms:\s+(?P<payload>(?:" + GC_KINDS + r").*)$")
        GC_HEADER = re.compile(r"^\s*\[(?P<pid>[0-9]+):(?P<isolate>0x[0-9a-fA-F]+)\]\s+(?P<timestamp>" + NUMBER + r")\s+ms:\s+")
        GC_PAYLOAD = re.compile(r"^(?P<kind>" + GC_KINDS + r").*?(?P<before>" + NUMBER + r")\s+\((?P<capacity_before>" + NUMBER + r")\)\s+->\s+(?P<after>" + NUMBER + r")\s+\((?P<capacity_after>" + NUMBER + r")\)\s+MB,\s+(?:pooled:\s+" + NUMBER + r"\s+MB,\s+)?(?P<pause>" + NUMBER + r")\s+/\s+(?P<other_pause>" + NUMBER + r")\s+ms")
        GC_LIKE = re.compile(r"ms:\s+(?:" + GC_KINDS + r")")
        KEY_SCHEMA = ["pid", "isolate_lowercase", "timestamp_ms_decimal", "complete_payload_with_collapsed_whitespace"]

        class LocalCapture:
            def __init__(self, directory):
                self.directory = directory
            def read(self, name):
                assert name in FILES
                return (self.directory / name).read_bytes()
            def open(self, name):
                assert name in FILES
                return (self.directory / name).open("rb")

        def stable_hash(value):
            return hashlib.sha256(json.dumps(value, ensure_ascii=False, separators=(",", ":")).encode()).hexdigest()

        def decimal_token(value):
            return format(Decimal(value).normalize(), "f")

        def gc_stats(reader):
            records, unparsed = [], []
            markers = collections.Counter()
            history_block = 0
            in_history = False
            fatal_seen = False
            total_lines = 0
            with reader.open("compiler.log") as stream:
                for line_number, raw in enumerate(stream, 1):
                    total_lines = line_number
                    line = raw.decode(errors="replace").rstrip("\r\n")
                    if "<--- Last few GCs --->" in line:
                        history_block += 1
                        in_history = True
                    if "<--- JS stacktrace --->" in line or "FATAL ERROR" in line:
                        in_history = False
                    if "FATAL ERROR" in line:
                        fatal_seen = True
                    for label, pattern in {"typescript_errors": r"error TS[0-9]+", "fatal_errors": "FATAL ERROR", "heap_oom": "heap out of memory"}.items():
                        if re.search(pattern, line):
                            markers[label] += 1
                    match = GC_LINE.search(line)
                    payload_match = GC_PAYLOAD.match(match["payload"]) if match else None
                    if not match or not payload_match:
                        if GC_LIKE.search(line):
                            unparsed.append({"record_type": "unparsed_gc_line", "line_number": line_number, "raw_line_sha256": hashlib.sha256(raw).hexdigest(), "reason": "GC-like line did not match the complete supported timestamp/memory/pause format"})
                        continue
                    header = GC_HEADER.match(line)
                    timestamp = decimal_token(match["timestamp"])
                    payload = " ".join(match["payload"].split())
                    key = None
                    if header and decimal_token(header["timestamp"]) == timestamp:
                        key = [str(int(header["pid"])), header["isolate"].lower(), timestamp, payload]
                    section = "fatal_gc_history" if in_history else ("after_fatal_error" if fatal_seen else "regular")
                    values = {name: float(payload_match[name]) for name in ("before", "capacity_before", "after", "capacity_after", "pause", "other_pause")}
                    assert all(math.isfinite(value) and value >= 0 for value in values.values())
                    records.append({
                        "record_type": "parsed_gc_line", "line_number": line_number,
                        "raw_line_sha256": hashlib.sha256(raw).hexdigest(),
                        "section": section, "fatal_history_block": history_block if in_history else None,
                        "timestamp_token": match["timestamp"], "timestamp_ms_decimal": timestamp,
                        "elapsed_seconds": float(Decimal(timestamp) / Decimal(1000)),
                        "kind": payload_match["kind"],
                        "used_before_mb": values["before"], "capacity_before_mb": values["capacity_before"],
                        "used_after_mb": values["after"], "capacity_after_mb": values["capacity_after"],
                        "reported_pause_ms": values["pause"], "reported_second_pause_ms": values["other_pause"],
                        "exact_key": key, "exact_key_sha256": stable_hash(key) if key else None,
                        "identity_complete": key is not None,
                    })
            return records, unparsed, dict(markers), {"compiler_log_lines": total_lines, "fatal_history_blocks": history_block}

        def short_record(record):
            return {key: record[key] for key in ("line_number", "section", "timestamp_ms_decimal", "elapsed_seconds", "kind", "reported_pause_ms", "used_after_mb", "capacity_after_mb", "exact_key_sha256")}

        def summarize_gc(records):
            counts, pauses = collections.Counter(), collections.Counter()
            for record in records:
                counts[record["kind"]] += 1
                pauses[record["kind"]] += record["reported_pause_ms"]
            return {
                "observations": len(records), "counts": dict(counts), "reported_pause_ms": dict(pauses),
                "maximum_used_after_mb": max((row["used_after_mb"] for row in records), default=None),
                "maximum_capacity_after_mb": max((row["capacity_after_mb"] for row in records), default=None),
                "last_records": [short_record(row) for row in records[-5:]],
            }

        def gc_accounting(records):
            groups = collections.OrderedDict()
            timestamp_groups = collections.defaultdict(list)
            for record in records:
                # Missing identity is never deduplicated, even if the remaining text agrees.
                key = record["exact_key_sha256"] or ("identity-incomplete-line-" + str(record["line_number"]))
                groups.setdefault(key, []).append(record)
                if record["exact_key"] is not None:
                    timestamp_groups[tuple(record["exact_key"][:3])].append(record)
            unique_signatures, candidates, repeated, ambiguous = [], [], [], []
            confirmed_reprints = []
            for key, occurrences in groups.items():
                unique_signatures.append(occurrences[0])
                earlier_regular = []
                removed = []
                for occurrence in occurrences:
                    if occurrence["section"] == "fatal_gc_history" and earlier_regular:
                        removed.append(occurrence)
                        confirmed_reprints.append(occurrence)
                    else:
                        candidates.append(occurrence)
                    if occurrence["section"] == "regular":
                        earlier_regular.append(occurrence)
                if len(occurrences) > 1:
                    outside_history = [row for row in occurrences if row["section"] != "fatal_gc_history"]
                    uncertain = len(outside_history) > 1 or len(removed) != len(occurrences) - 1
                    detail = {
                        "exact_key": occurrences[0]["exact_key"], "exact_key_sha256": occurrences[0]["exact_key_sha256"],
                        "occurrences": [{"line_number": row["line_number"], "section": row["section"], "fatal_history_block": row["fatal_history_block"], "raw_line_sha256": row["raw_line_sha256"]} for row in occurrences],
                        "confirmed_fatal_reprint_lines": [row["line_number"] for row in removed],
                        "ambiguous": uncertain,
                        "reason": "Repeated exact signature outside a proven fatal reprint; distinct rounded-time events cannot be excluded" if uncertain else "Exact signature reprinted inside fatal GC history after a matching regular trace line",
                    }
                    repeated.append(detail)
                    if uncertain:
                        ambiguous.append(detail)
            collisions = []
            for identity, occurrences in timestamp_groups.items():
                signatures = collections.OrderedDict()
                for row in occurrences:
                    signatures.setdefault(row["exact_key_sha256"], row["exact_key"][3])
                if len(signatures) > 1:
                    collisions.append({
                        "pid_isolate_timestamp": list(identity),
                        "signatures": [{"exact_key_sha256": key, "complete_normalized_payload": payload} for key, payload in signatures.items()],
                        "line_numbers": [row["line_number"] for row in occurrences],
                        "reason": "Same reported timestamp with different complete payloads; retained as different signatures, not deduplicated",
                    })
            candidates.sort(key=lambda row: row["line_number"])
            unique_signatures.sort(key=lambda row: row["line_number"])
            return {
                "key_schema": KEY_SCHEMA,
                "key_serialization": "SHA256 of UTF-8 JSON array, ensure_ascii=false, separators comma/colon; timestamp normalized with Decimal, full payload whitespace collapsed",
                "log_lines": summarize_gc(records),
                "unique_signatures": summarize_gc(unique_signatures),
                "event_candidates_after_confirmed_fatal_reprints": summarize_gc(candidates),
                "confirmed_fatal_reprint_lines": [row["line_number"] for row in confirmed_reprints],
                "repeated_signature_groups": repeated,
                "ambiguous_repeated_signature_groups": ambiguous,
                "same_timestamp_different_payload_groups": collisions,
                "identity_incomplete_lines": [row["line_number"] for row in records if not row["identity_complete"]],
                "known_identity_or_timestamp_ambiguities_present": bool(ambiguous or collisions or any(not row["identity_complete"] for row in records)),
                "interpretation": "Unique signatures are distinct reported keys, not proof of globally unique GC events. Only exact matches in fatal history with an earlier regular occurrence are removed from event candidates. Other repeats, timestamp collisions, missing identities, and unparsed lines remain explicit.",
                "largest_candidate_reported_pauses": [short_record(row) for row in sorted(candidates, key=lambda row: -row["reported_pause_ms"])[:10]],
            }

        def compact_accounting(detail):
            value = dict(detail)
            for key in ("repeated_signature_groups", "ambiguous_repeated_signature_groups", "same_timestamp_different_payload_groups"):
                groups = detail[key]
                value[key] = {"total": len(groups), "preview": groups[:20], "preview_truncated": len(groups) > 20, "complete_details_file": "gc-deduplication.json"}
            for key in ("confirmed_fatal_reprint_lines", "identity_incomplete_lines"):
                lines = detail[key]
                value[key] = {"total": len(lines), "preview": lines[:100], "preview_truncated": len(lines) > 100, "complete_details_file": "gc-deduplication.json"}
            return value

        def resource_window(resources, start, end):
            rows = [row for row in resources if start <= row["elapsed_seconds"] <= end]
            if not rows:
                return {"samples": 0, "observed_sample_interval": None}
            first, last = rows[0], rows[-1]
            duration = last["elapsed_seconds"] - first["elapsed_seconds"]
            user = last["user_cpu_seconds"] - first["user_cpu_seconds"]
            system = last["system_cpu_seconds"] - first["system_cpu_seconds"]
            return {
                "samples": len(rows), "observed_sample_interval": [first["elapsed_seconds"], last["elapsed_seconds"]],
                "user_cpu_delta_seconds": user, "system_cpu_delta_seconds": system,
                "cpu_seconds_per_observed_wall_second": (user + system) / duration if duration > 0 else None,
                "first_sampled_rss_kib": first.get("VmRSS_kib"), "last_sampled_rss_kib": last.get("VmRSS_kib"),
                "peak_sampled_rss_kib": max((row.get("VmRSS_kib", 0) for row in rows), default=0),
                "peak_reported_process_hwm_kib": max((row.get("VmHWM_kib", 0) for row in rows), default=0),
            }

        def checkpoint_windows(summary, resources, gc_records):
            elapsed = summary["elapsed_seconds"]
            result = []
            start = 0
            for checkpoint in CHECKPOINTS:
                observed_end = min(checkpoint, elapsed)
                valid_window = observed_end >= start
                rows = [row for row in gc_records if start < row["elapsed_seconds"] <= observed_end or start == 0 and row["elapsed_seconds"] == 0] if valid_window else []
                result.append({
                    "requested_checkpoint_seconds": checkpoint, "capture_reached_checkpoint": elapsed >= checkpoint,
                    "nominal_window_seconds": [start, checkpoint],
                    "observed_window_end_seconds": observed_end if valid_window else None,
                    "resources": resource_window(resources, start, observed_end) if valid_window else {"samples": 0, "observed_sample_interval": None},
                    "gc_by_reported_timestamp": compact_accounting(gc_accounting(rows)),
                })
                start = checkpoint
            return result

        def analyze(reader, workflow_head):
            metadata = json.loads(reader.read("metadata.json"))
            summary = json.loads(reader.read("summary.json"))
            assert metadata["source_commit"] == SOURCE and metadata["source_tree"] == TREE, "Source target mismatch"
            assert metadata["workflow_commit"] == workflow_head, "Workflow provenance mismatch"
            assert metadata["node_version"] == "v20.20.2" and metadata["npm_version"] == "10.8.2" and metadata["typescript_version"] == "5.9.3", "Runtime mismatch"
            assert metadata["input_blobs"] == INPUTS and metadata["type_check_script"] == "tsc --noEmit", "Compiler input mismatch"
            assert metadata["node_options"] == OPTIONS and metadata["command"] == COMMAND, "Unexpected compiler command or flags"
            assert metadata["trace_requested"] is False and summary["trace_requested"] is False, "This paired capture must not request generateTrace"
            assert metadata["counts_as_required_gate"] is False and summary["counts_as_required_gate"] is False
            assert summary["limit_seconds"] == 900 and summary["grace_seconds"] == 10, "Capture limits changed"
            raw_exit = summary["compiler_exit_code"]
            expected_complete = not summary["cutoff_reached"] and raw_exit in (0, 1, 2) and summary["extended_diagnostics_total_time_reported"]
            assert summary["complete"] is expected_complete, "Completeness must depend on compiler termination, no cutoff, and final extended diagnostics"
            expected_exit = 124 if summary["cutoff_reached"] else (128 - raw_exit if raw_exit < 0 else raw_exit)
            if expected_exit == 0 and not expected_complete:
                expected_exit = 1
            assert summary["exit_code"] == expected_exit, "Compiler/cutoff exit propagation changed"
            assert summary["compiler_succeeded"] is (expected_complete and raw_exit == 0)
            resources = [json.loads(line) for line in reader.read("resources.jsonl").splitlines() if line]
            resources.sort(key=lambda row: row["elapsed_seconds"])
            gc_records, unparsed, markers, log_info = gc_stats(reader)
            gc_detail = gc_accounting(gc_records)
            gc_detail["unparsed_gc_lines"] = unparsed
            if unparsed:
                gc_detail["known_identity_or_timestamp_ambiguities_present"] = True
            fields = ("complete", "counts_as_required_gate", "status", "limit_seconds", "grace_seconds", "elapsed_seconds", "compiler_exit_code", "exit_code", "cutoff_reached", "forced_kill_after_grace", "user_cpu_seconds", "system_cpu_seconds", "maximum_rss_kib", "trace_requested", "trace_file_present", "extended_diagnostics_total_time_reported", "extended_diagnostics_total_time_seconds", "extended_diagnostics_total_time_reports", "compiler_succeeded")
            report = {
                "analysis_only": True, "counts_as_required_gate": False,
                "source_commit": SOURCE, "source_tree": TREE, "workflow_commit": workflow_head,
                "runtime": {key: metadata[key] for key in ("node_version", "npm_version", "typescript_version")},
                "node_options": OPTIONS, "input_blobs_verified": True, "compiler_command": COMMAND,
                "summary": {key: summary.get(key) for key in fields},
                "trace": {"requested": False, "absence_expected": True, "file_present": summary.get("trace_file_present", False), "per_file_progress_available": False, "phase_timing_available": False},
                "checkpoints": checkpoint_windows(summary, resources, gc_records),
                "resources": {"samples": len(resources), "peak_sampled_rss_kib": max((row.get("VmRSS_kib", 0) for row in resources), default=0), "sample_resolution_seconds": 1},
                "gc": {**compact_accounting(gc_detail), "unparsed_gc_lines": {"total": len(unparsed), "preview": unparsed[:20], "preview_truncated": len(unparsed) > 20, "complete_details_file": "gc-deduplication.json"}, **log_info},
                "compiler_marker_counts": markers,
                "limitations": [
                    "This bounded paired diagnostic never replaces the required TypeScript gate, including when complete and exit 0.",
                    "generateTrace is intentionally absent. No file counts, file progress, phase durations, or open spans are inferred.",
                    "Complete means an exit of 0/1/2, no cutoff, and a valid final extended-diagnostics Total time line. Compiler errors still retain exit 1/2.",
                    "GC unique-signature summaries are not asserted to be unique physical events when repeated keys, rounded timestamp collisions, missing identities, or unparsed lines are ambiguous.",
                    "Original compiler.log, the ordered GC ledger, and complete deduplication details retain all evidence; console previews explicitly declare truncation.",
                    "GC windows use the timestamp printed by V8, including fatal-history reprints; full reported pauses are assigned to that timestamp, and background GC cost is not included.",
                    "GC and controller clocks have slightly different startup origins. CPU deltas cover only the shown sampled intervals; wait4 retains whole-process totals.",
                    "RSS is sampled about once per second. elapsed_seconds retains the original controller definition, including its final summary-file inspection.",
                    "Removal of generateTrace changes instrumentation overhead; this experiment alone is not a pass of the required uninstrumented gate.",
                ],
            }
            ledger = sorted(gc_records + unparsed, key=lambda row: row["line_number"])
            return report, ledger, gc_detail

        def main():
            directory = Path(os.environ["PROFILE_DIR"])
            report, ledger, gc_detail = analyze(LocalCapture(directory), os.environ["GITHUB_SHA"])
            (directory / "paired-analysis.json").write_text(json.dumps(report, indent=2) + "\n")
            (directory / "gc-deduplication.json").write_text(json.dumps(gc_detail, indent=2) + "\n")
            with (directory / "gc-records.jsonl").open("w") as output:
                for record in ledger:
                    output.write(json.dumps(record, separators=(",", ":")) + "\n")
            print("TYPESCRIPT_PAIRED_DIAGNOSTIC " + json.dumps(report, separators=(",", ":")))
            with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                summary.write("\n## Paired TypeScript diagnostic without generateTrace\n\n")
                summary.write("This analysis does not replace the required TypeScript gate and does not change the compiler step's exit status.\n\n")
                summary.write(f"- Complete capture: {report['summary']['complete']}; compiler step exit: {report['summary']['exit_code']}\n")
                summary.write("- File progress and phase timing are unavailable because generateTrace was intentionally disabled.\n")
                for row in report["checkpoints"]:
                    summary.write(f"- At {row['requested_checkpoint_seconds']}s: reached={row['capture_reached_checkpoint']}; resource samples={row['resources']['samples']}\n")
                summary.write(f"- Parsed GC log lines: {gc_detail['log_lines']['observations']}; distinct signatures: {gc_detail['unique_signatures']['observations']}; confirmed fatal reprint lines: {len(gc_detail['confirmed_fatal_reprint_lines'])}\n")
                summary.write(f"- Ambiguous repeated signatures: {len(gc_detail['ambiguous_repeated_signature_groups'])}; timestamp/payload collision groups: {len(gc_detail['same_timestamp_different_payload_groups'])}; incomplete identities: {len(gc_detail['identity_incomplete_lines'])}; unparsed GC-like lines: {len(gc_detail['unparsed_gc_lines'])}\n")

        if __name__ == "__main__":
            main()
        PY
