name: TypeScript Type Coverage & Dead Code Check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Measure compiler input and available memory
        run: |
          free -h
          npm run --silent type-check -- --listFilesOnly > "$RUNNER_TEMP/typescript-inputs.txt"
          wc -l "$RUNNER_TEMP/typescript-inputs.txt"
          python3 - <<'PY'
          import collections, os, pathlib
          root = pathlib.Path.cwd()
          paths = pathlib.Path(os.environ["RUNNER_TEMP"], "typescript-inputs.txt").read_text().splitlines()
          counts = collections.Counter()
          for item in paths:
              rel = pathlib.Path(item)
              if rel.is_relative_to(root):
                  counts[rel.relative_to(root).parts[0]] += 1
          print(counts.most_common(12))
          PY
      - name: Run complete project type check
        env:
          NODE_OPTIONS: '--max-old-space-size=12288'
        run: /usr/bin/time -v npm run type-check -- --extendedDiagnostics
