permissions:
  contents: read
name: TypeScript Type Coverage & Dead Code Check
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 15 * * 1
  workflow_dispatch: null
concurrency:
  group: type-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-coverage:
    name: Type Coverage & Dead Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        # These checks read the complete current tree; no Git history is required.
        fetch-depth: 1
    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '20'
        cache: npm
    - name: Test workflow reliability regressions
      run: node tests/ci/test_type_coverage_workflow.cjs
    - name: Install dependencies
      run: npm ci
    - name: Run TypeScript Check
      id: type-check
      run: |
        check_status=0
        npm run type-check || check_status=$?
        echo "exit_code=$check_status" >> "$GITHUB_OUTPUT"
        exit "$check_status"
    - name: Run ESLint Check
      id: lint-check
      run: |
        check_status=0
        npm run lint:check || check_status=$?
        echo "exit_code=$check_status" >> "$GITHUB_OUTPUT"
        exit "$check_status"
    - name: Comment on PR if failed
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          const body = '🚨 **Type Coverage & Dead Code Workflow Failed**\n\n' +
            'Check the workflow logs for the failed setup, TypeScript, or ESLint step. ' +
            'A workflow failure does not by itself identify source-code errors.\n\n' +
            'After installing dependencies, reproduce the checks locally:\n' +
            '```sh\n' +
            'npm run type-check\n' +
            'npm run lint:check\n' +
            '```\n';
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          });
    - name: Open issue on main branch regression
      if: github.event_name == 'push' && failure() && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      with:
        script: |
          // Keep the existing title so open regression issues remain deduplicated.
          const title = '🚨 TypeScript Check Regression on Main';
          const body = '**Type Coverage & Dead Code workflow failed on `main`.**\n\n' +
            'Check the workflow logs for the failed setup, TypeScript, or ESLint step.\n\n' +
            'After installing dependencies, run `npm run type-check` and ' +
            '`npm run lint:check` locally to reproduce.\n\n' +
            `*Commit: ${context.sha?.slice(0, 7) || 'N/A'}*\n`;

          const existing = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['type-coverage', 'autonomous'],
            state: 'open'
          });
          const already = existing.data.find((issue) => issue.title === title);
          if (!already) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['type-coverage', 'autonomous', 'code-quality']
            });
          }
    - name: Notify Telegram on failure
      if: failure()
      run: |
        node automation/notify-telegram.js "🚨 TypeScript / ESLint workflow failed — review the failed workflow step." || true
    - name: Notify Telegram on success (weekly digest)
      if: success() && github.event_name == 'schedule'
      run: |
        node automation/notify-telegram.js "✅ Weekly TypeScript / ESLint Check — all clear." || true
    timeout-minutes: 10
