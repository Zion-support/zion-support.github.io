name: Trace Next.js entry construction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 54d5f76a6b6dd1814194f2951d1752fcebc4c6b2
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.23.5'
      - run: |
          test "$(git rev-parse HEAD)" = 54d5f76a6b6dd1814194f2951d1752fcebc4c6b2
          sha256sum next.config.mjs package-lock.json
          npm ci --prefer-offline --no-audit --fund=false
      - name: Measure the installed Next.js entry builder
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          
          def checked(path, expected):
              source = Path(path).read_bytes()
              assert hashlib.sha256(source).hexdigest() == expected, path
              return source.decode()
          
          def replace_one(text, marker, replacement):
              assert text.count(marker) == 1, marker
              return text.replace(marker, replacement)
          
          def before(text, marker, statement):
              return replace_one(text, marker, statement + "\n" + marker)
          
          prefix = r'''
          function zEntryTrace(stage, fields = {}) {
              const fs = require('node:fs');
              const mem = process.memoryUsage();
              fs.appendFileSync(process.env.ZION_BUILD_PHASE_FILE, JSON.stringify({
                  stage, pid: process.pid, compiler: process.env.NEXT_COMPILER_NAME || null,
                  heapMiB: Math.round(mem.heapUsed / 1048576), ...fields
              }) + '\n');
          }
          '''
          bp = Path('node_modules/next/dist/build/webpack-build/impl.js')
          ep = Path('node_modules/next/dist/build/entries.js')
          impl = checked(bp,'421731ea3b8122fb42321462bb8b0556b635976a14f163860449e4ce0f729f72')
          entries = checked(ep,'42bce6601be85db8019657324eba0ab5fa2a3cf0b62dd636705a4cc17a3d42ac')
          def prelude(t):
              return replace_one(t, '"use strict";', '"use strict";\n' + prefix)
          impl, entries = prelude(impl), prelude(entries)
          impl = replace_one(impl,'async function workerMain(workerData) {',
                             "async function workerMain(workerData) {\n    zEntryTrace('worker-start', {target: workerData.compilerName});")
          for needle, event in [
              ('    const entrypoints = await', 'before-entrypoints'),
              ('    // Create deferred entrypoints if configured','after-entrypoints'),
              ('    const configs = await', 'before-webpack-config'),
              ('    webpackBuildStart = process.hrtime();', 'after-webpack-config')
          ]:
              impl = before(impl, needle, '    zEntryTrace('+json.dumps(event)+');')
          entries = replace_one(entries,'async function createEntrypoints(params) {',
              "async function createEntrypoints(params) {\n    zEntryTrace('entry-function', {appPaths: Object.keys(params.appPaths || {}).length});")
          for marker, event in [
              ('        const { unmatchedAppPages, incompatibleParallelRouteSlots }', 'before-normalize'),
              ('        const appPagePathsPerRoute =', 'after-normalize'),
              ('    const promises = [];', 'before-route-scheduling')
          ]:
              entries = before(entries, marker, '    zEntryTrace('+json.dumps(event)+');')
          entry_wrapper = r'''
          let zAppEntryCount = 0;
          function getAppEntry(opts) {
              const entry = zUnobservedGetAppEntry(opts);
              zAppEntryCount++;
              if (zAppEntryCount <= 3 || zAppEntryCount % 250 === 0) {
                  zEntryTrace('app-entry-return', {count: zAppEntryCount,
                      pathCount: opts.allNormalizedAppPaths?.length,
                      importCharacters: entry.import.length});
              }
              return entry;
          }
          function zUnobservedGetAppEntry(opts) {'''
          entries = replace_one(entries, 'function getAppEntry(opts) {',entry_wrapper)
          bp.write_text(impl)
          ep.write_text(entries)
          PY
          node --check node_modules/next/dist/build/webpack-build/impl.js
          node --check node_modules/next/dist/build/entries.js
          export ZION_BUILD_PHASE_FILE="$RUNNER_TEMP/entry-observation-control.ndjson"
          node -e "const e = require('next/dist/build/entries').getAppEntry({page:'/control', allNormalizedAppPaths:['/control','/other']}); if (!e.import.includes('allNormalizedAppPaths')) process.exit(1);"
          python3 -c "import json,os; f=json.load(open(os.environ['ZION_BUILD_PHASE_FILE'])); assert f['stage']=='app-entry-return' and f['pathCount']==2; print('entry observer control passed')"
      - name: Run production build
        env:
          NODE_OPTIONS: '--max-old-space-size=12288'
        run: |
          ulimit -c 0
          export ZION_BUILD_PHASE_FILE="$RUNNER_TEMP/entry-observation.ndjson"
          /usr/bin/time -v npm run build
      - name: Report phase boundaries and sizes
        if: always()
        run: |
          test -s "$RUNNER_TEMP/entry-observation.ndjson"
          cat "$RUNNER_TEMP/entry-observation.ndjson"
