name: TypeScript Diagnostic Artifact Analysis
run-name: TypeScript artifact analysis — run 41156498780

"on":
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: typescript-artifact-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-existing-diagnostic:
    name: Analyze existing TypeScript diagnostic artifact
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify and read the fixed artifact inside GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          
          ARTIFACT = 13025442293
          RUN = 41156498780
          EXPECTED_SHA256 = "f76cd92fcc87ad084c3de1e74b2b68bf44f30983f7dca1a952563fc7d930e9a3"
          EXPECTED_BYTES = 5296634
          API = "https://api.github.com/repos/Zion-support/zion-support.github.io"
          HEAD = "e8dc480cc8a59915c2c8d8969cf0a14234aa94ce"
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          opener = urllib.request.build_opener(NoRedirect())
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zion-diagnostic-artifact-analysis",
          }
          def api_request(path):
              return opener.open(urllib.request.Request(API + path, headers=headers), timeout=60)
          
          try:
              with api_request(f"/actions/artifacts/{ARTIFACT}") as response:
                  meta = json.load(response)
          except Exception as exc:
              raise SystemExit(f"Artifact metadata request failed ({type(exc).__name__}, HTTP {getattr(exc, 'code', 'n/a')})") from None
          assert meta["id"] == ARTIFACT, "Wrong artifact"
          assert meta["name"] == "typescript-diagnostic-d3c73060-41156498780", "Wrong artifact name"
          assert meta["workflow_run"]["id"] == RUN, "Wrong source run"
          assert meta["workflow_run"]["head_sha"] == HEAD, "Wrong diagnostic workflow commit"
          assert meta["digest"] == "sha256:" + EXPECTED_SHA256, "Metadata digest mismatch"
          assert meta["size_in_bytes"] == EXPECTED_BYTES and not meta["expired"], "Wrong artifact size or expired artifact"
          
          try:
              response = api_request(f"/actions/artifacts/{ARTIFACT}/zip")
          except urllib.error.HTTPError as exc:
              if exc.code != 302:
                  raise SystemExit(f"Artifact redirect request failed (HTTP {exc.code})") from None
              location = exc.headers.get("Location", "")
              exc.close()
          except Exception as exc:
              raise SystemExit(f"Artifact redirect request failed ({type(exc).__name__})") from None
          else:
              response.close()
              raise SystemExit("Expected the authenticated API to return a download redirect")
          
          parsed = urllib.parse.urlsplit(location)
          assert parsed.scheme == "https" and parsed.username is None and parsed.password is None, "Unsafe artifact location"
          assert parsed.hostname and parsed.hostname.endswith((".blob.core.windows.net", ".githubusercontent.com")), "Unexpected artifact storage host"
          assert parsed.port in (None, 443), "Unexpected artifact storage port"
          destination = Path(os.environ["RUNNER_TEMP"]) / "typescript-diagnostic-41156498780.zip"
          digest = hashlib.sha256()
          received = 0
          try:
              # Fresh request: the GitHub API Authorization header is never forwarded to storage.
              request = urllib.request.Request(location, headers={"User-Agent": "zion-diagnostic-artifact-analysis"})
              with urllib.request.urlopen(request, timeout=60) as response, destination.open("wb") as target:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      received += len(chunk)
                      if received > EXPECTED_BYTES:
                          raise ValueError("Artifact exceeded its verified size")
                      digest.update(chunk)
                      target.write(chunk)
          except Exception as exc:
              destination.unlink(missing_ok=True)
              raise SystemExit(f"Artifact storage read failed ({type(exc).__name__}, HTTP {getattr(exc, 'code', 'n/a')})") from None
          assert received == EXPECTED_BYTES, "Incomplete artifact"
          assert digest.hexdigest() == EXPECTED_SHA256, "Downloaded ZIP digest mismatch"
          print(json.dumps({"artifact_id": ARTIFACT, "run_id": RUN, "bytes": received, "sha256": digest.hexdigest(), "integrity_verified": True}))
          
          PY
      - name: Print bounded diagnostic statistics
        run: |
          python3 - <<'PY'
          import bisect, collections, hashlib, heapq, json, os, re, zipfile
          from pathlib import Path
          
          archive = Path(os.environ["RUNNER_TEMP"]) / "typescript-diagnostic-41156498780.zip"
          expected_digest = "f76cd92fcc87ad084c3de1e74b2b68bf44f30983f7dca1a952563fc7d930e9a3"
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == expected_digest, "ZIP changed before analysis"
          repo_prefix = "/home/runner/work/zion-support.github.io/zion-support.github.io/"
          def relative(path):
              return path[len(repo_prefix):] if isinstance(path, str) and path.startswith(repo_prefix) else None
          def safe_event(event):
              result = {key: event[key] for key in ("cat", "name", "ph", "ts", "dur") if key in event}
              path = relative((event.get("args") or {}).get("path"))
              if path is not None:
                  result["path"] = path
              return result
          
          with zipfile.ZipFile(archive) as z:
              required = {"metadata.json", "summary.json", "resources.jsonl", "compiler.log", "trace/trace.json"}
              assert {x.filename for x in z.infolist() if not x.is_dir()} == required, "Unexpected artifact members"
              metadata = json.loads(z.read("metadata.json"))
              summary = json.loads(z.read("summary.json"))
              assert metadata["source_commit"] == "d3c73060d57fd984861123ee0bf784a33ae57a2c", "Source commit mismatch"
              assert metadata["source_tree"] == "900ee823a411b6fe813f26db6104b5cab6d85d00", "Source tree mismatch"
              assert metadata["workflow_commit"] == "e8dc480cc8a59915c2c8d8969cf0a14234aa94ce", "Workflow commit mismatch"
              assert metadata["typescript_version"] == "5.9.3" and metadata["node_version"].startswith("v20."), "Runtime mismatch"
              assert metadata["type_check_script"] == "tsc --noEmit", "Compiler command mismatch"
              assert metadata["node_options"] == "--max-old-space-size=12288", "Heap setting mismatch"
              assert metadata["input_blobs"] == {
                  "package.json": "8f572286b94f517a07f83fbddeba350653ded85e",
                  "package-lock.json": "e79ec8d8bf85ad622306cf39714ec3fbd56c9530",
                  "tsconfig.json": "c128011dc8f2ddb69da4f11dd57b09abe501dacb",
              }, "Compiler inputs differ from immutable source tree"
              assert metadata["counts_as_required_gate"] is False and summary["counts_as_required_gate"] is False
              assert summary["complete"] is False and summary["exit_code"] == 124 and summary["cutoff_reached"] is True
              assert summary["limit_seconds"] == 180
              resources = [json.loads(line) for line in z.read("resources.jsonl").splitlines() if line]
              stacks = collections.defaultdict(list)
              unions = collections.defaultdict(list)
              intervals = collections.Counter()
              events = collections.Counter()
              parsed_files = set()
              recent = collections.deque(maxlen=15)
              longest = []
              sequence = 0
              malformed = 0
          
              def add_interval(phase, begin, end, label, path):
                  global sequence
                  intervals[phase] += 1
                  values = unions[phase]
                  i = bisect.bisect_left(values, (begin, float("-inf")))
                  if i and values[i-1][1] >= begin:
                      i -= 1
                  j = i
                  merged_begin, merged_end = begin, end
                  while j < len(values) and values[j][0] <= merged_end:
                      merged_begin = min(merged_begin, values[j][0])
                      merged_end = max(merged_end, values[j][1])
                      j += 1
                  values[i:j] = [(merged_begin, merged_end)]
                  if phase in ("parse", "bind", "check", "checkTypes"):
                      sequence += 1
                      item = ((end - begin), sequence, {"phase": phase, "name": label, "milliseconds": (end-begin)/1000, "path": relative(path)})
                      if len(longest) < 20:
                          heapq.heappush(longest, item)
                      else:
                          heapq.heappushpop(longest, item)
          
              with z.open("trace/trace.json") as source:
                  for raw in source:
                      line = raw.decode(errors="replace").strip().strip(",")
                      if not line or line in ("[", "]"):
                          continue
                      try:
                          event = json.loads(line)
                      except ValueError:
                          malformed += 1
                          continue
                      if not isinstance(event, dict):
                          continue
                      phase, kind, stamp = event.get("cat"), event.get("ph"), event.get("ts", 0)
                      events[phase] += 1
                      if phase in ("parse", "bind", "check", "checkTypes", "program"):
                          recent.append(safe_event(event))
                      path = (event.get("args") or {}).get("path")
                      if phase == "parse" and path:
                          parsed_files.add(path)
                      key = (event.get("pid"), event.get("tid"), phase)
                      if kind == "B":
                          stacks[key].append(event)
                      elif kind == "E" and stacks[key]:
                          begin = stacks[key].pop()
                          add_interval(phase, begin["ts"], stamp, begin.get("name"), (begin.get("args") or {}).get("path"))
                      elif kind == "X" and "dur" in event:
                          add_interval(phase, stamp, stamp + event["dur"], event.get("name"), path)
          
              gc_count = collections.Counter()
              gc_pause = collections.Counter()
              gc_recent = collections.deque(maxlen=8)
              gc_unparsed = 0
              compiler_markers = collections.Counter()
              gc_pattern = re.compile(r"([0-9.]+) ms: (Scavenge|Mark-Compact|Mark-sweep|Minor Mark-Compact).*?([0-9.]+) \(([0-9.]+)\) -> ([0-9.]+) \(([0-9.]+)\) MB, (?:pooled: [0-9.]+ MB, )?([0-9.]+) / ([0-9.]+) ms")
              mu_pattern = re.compile(r"average mu\s*=\s*([0-9.]+), current mu\s*=\s*([0-9.]+)")
              with z.open("compiler.log") as source:
                  for raw in source:
                      line = raw.decode(errors="replace")
                      match = gc_pattern.search(line)
                      if match:
                          kind = match[2]
                          gc_count[kind] += 1
                          gc_pause[kind] += float(match[7])
                          point = {"elapsed_ms": float(match[1]), "kind": kind, "used_before_mb": float(match[3]), "capacity_before_mb": float(match[4]), "used_after_mb": float(match[5]), "capacity_after_mb": float(match[6]), "pause_ms": float(match[7])}
                          mu = mu_pattern.search(line)
                          if mu:
                              point.update({"average_mu": float(mu[1]), "current_mu": float(mu[2])})
                          gc_recent.append(point)
                      elif re.search(r"ms: (Scavenge|Mark-Compact|Mark-sweep|Minor Mark-Compact)", line):
                          gc_unparsed += 1
                      for key, pattern in {"typescript_errors": r"error TS[0-9]+", "fatal_errors": "FATAL ERROR", "heap_oom": "heap out of memory", "total_time_reported": r"^Total time:"}.items():
                          if re.search(pattern, line):
                              compiler_markers[key] += 1
          
          phase_stats = {}
          for phase in ("program", "parse", "bind", "check", "checkTypes"):
              ranges = unions[phase]
              phase_stats[phase] = {"completed_intervals": intervals[phase], "observed_union_seconds": sum(b-a for a,b in ranges)/1e6, "first_start_seconds": ranges[0][0]/1e6 if ranges else None, "last_end_seconds": ranges[-1][1]/1e6 if ranges else None}
          open_spans = [{"phase": key[2], "name": event.get("name"), "start_seconds": event.get("ts", 0)/1e6, "path": relative((event.get("args") or {}).get("path"))} for key, values in stacks.items() for event in values]
          summary_fields = ("complete", "counts_as_required_gate", "status", "limit_seconds", "grace_seconds", "elapsed_seconds", "compiler_exit_code", "exit_code", "cutoff_reached", "forced_kill_after_grace", "user_cpu_seconds", "system_cpu_seconds", "maximum_rss_kib", "trace_closed", "extended_diagnostics_total_time_reported")
          json_files = sorted(path for path in (relative(x) for x in parsed_files if x.endswith(".json")) if path is not None)
          report = {
              "analysis_only": True,
              "counts_as_required_gate": False,
              "artifact_id": 13025442293,
              "source_run_id": 41156498780,
              "artifact_sha256": digest,
              "target": {key: metadata[key] for key in ("source_commit", "source_tree", "workflow_commit", "node_version", "npm_version", "typescript_version", "type_check_script", "node_options", "input_blobs")},
              "summary": {key: summary.get(key) for key in summary_fields},
              "resources": {"samples": len(resources), "peak_sampled_rss_kib": max((x.get("VmRSS_kib", 0) for x in resources), default=0), "timeline": [{key: value for key, value in min(resources, key=lambda x: abs(x["elapsed_seconds"]-second)).items() if key in ("elapsed_seconds", "user_cpu_seconds", "system_cpu_seconds", "VmRSS_kib", "VmHWM_kib")} for second in (0, 30, 60, 90, 120, 150, 180)] if resources else []},
              "trace": {"phase_event_counts": dict(events), "phase_intervals": phase_stats, "open_spans": open_spans[-15:], "parsed_source_count": len(parsed_files), "parsed_by_extension": dict(collections.Counter("d.ts" if path.endswith(".d.ts") else Path(path).suffix for path in parsed_files)), "json_source_count": len(json_files), "json_source_paths": json_files[:20], "malformed_lines": malformed, "longest_completed_intervals": [x[2] for x in sorted(longest, reverse=True)], "recent_events": list(recent)},
              "gc": {"counts": dict(gc_count), "reported_pause_ms": dict(gc_pause), "unparsed_gc_lines": gc_unparsed, "recent": list(gc_recent)},
              "compiler_marker_counts": dict(compiler_markers),
              "limitations": ["Partial trace is not full type validation.", "Trace intervals include instrumentation overhead and exclude unfinished spans.", "Phase categories can overlap.", "GC pause sums do not capture every possible background GC cost."],
          }
          print("DIAGNOSTIC_ANALYSIS " + json.dumps(report, separators=(",", ":")))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("## Existing TypeScript diagnostic artifact analysis\n\n")
              out.write("Artifact integrity and target metadata verified. The compiler result remains incomplete with exit 124.\n\n")
              out.write("This job only analyzes the existing artifact and does not satisfy the TypeScript gate.\n")
          
          PY
