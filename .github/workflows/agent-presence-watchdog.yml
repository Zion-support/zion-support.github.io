name: Agent presence watchdog
# Pulse v3 owns the 5-minute roster (standing comment on #71361).
# This workflow stays as a manual fallback so we never double-post
# OFFLINE roster comments every 5 minutes.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Refresh standing roster (same as Pulse)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py
