name: Agent presence watchdog
# Manual backup only. The 5-min / comment helper is war-room-pulse.yml.
# Lucas 20:08: do not clone watchers.
on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: war-room-pulse
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: War room tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/war_room_pulse.py
