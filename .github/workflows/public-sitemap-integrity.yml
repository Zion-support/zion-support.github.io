name: Public Sitemap Integrity

on:
  schedule:
    - cron: '17 11 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-sitemap-integrity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate sitemap XML and sampled URLs
        shell: bash
        env:
          BASE_URL: https://ziontechgroup.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          base=os.environ['BASE_URL'].rstrip('/')
          origin=urllib.parse.urlsplit(base).netloc
          ua={'User-Agent':'Zion-Public-Sitemap-Integrity/1.0'}
          def get(url,method='GET'):
              req=urllib.request.Request(url,headers=ua,method=method)
              with urllib.request.urlopen(req,timeout=18) as response:
                  return response.status,response.read(4_000_000) if method=='GET' else b''
          try:
              status,body=get(base+'/sitemap.xml')
              root=ET.fromstring(body)
              ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              urls=[n.text.strip() for n in root.findall('.//sm:url/sm:loc') if n.text]
              if not urls:
                  raise ValueError('No URL entries found (sitemap index format requires separate handling)')
              invalid=[u for u in urls if urllib.parse.urlsplit(u).scheme!='https' or urllib.parse.urlsplit(u).netloc!=origin]
              if invalid:
                  raise ValueError('Found '+str(len(invalid))+' non-HTTPS or off-domain sitemap entries')
              sample=urls[:15]
              def check(u):
                  try:
                      status,_=get(u,'HEAD')
                      return (u,status,None)
                  except Exception as e:
                      return (u,None,str(e))
              with ThreadPoolExecutor(max_workers=4) as pool:
                  results=list(pool.map(check,sample))
              bad=[r for r in results if r[1] is None or r[1]>=400]
              print(f'Sitemap entries: {len(urls)}; sampled: {len(sample)}; failures: {len(bad)}')
              for u,status,error in bad:
                  print(f'::error title=Sitemap URL failure::{u} status={status} error={error}')
              if bad:
                  sys.exit(1)
          except Exception as e:
              print('::error title=Sitemap validation failed::'+str(e))
              sys.exit(1)
          PY
