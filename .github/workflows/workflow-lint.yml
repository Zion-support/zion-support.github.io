name: Workflow Lint

# actionlint (with shellcheck) on every workflow change. Read-only; never commits.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.9
  ACTIONLINT_SHA256: 233b280d05e100837f4af1433c7b40a5dcb306e3aa68fb4f17f8a7f45a7df7b4

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${tgz}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tgz}"
          echo "${ACTIONLINT_SHA256}  /tmp/${tgz}" | sha256sum -c -
          tar -xzf "/tmp/${tgz}" -C /tmp actionlint

      - name: Lint workflows
        run: /tmp/actionlint -color
