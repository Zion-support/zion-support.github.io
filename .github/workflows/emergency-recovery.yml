name: Emergency Recovery - Minimal Build
# Manual-only: this diagnostic workflow OOMs/timeouts on the 135k-file tree and must
# not run on every push (it was failing all jobs and spamming notifications).
# The production site deploys via GitHub Pages (.nojekyll), not via this workflow.
"on":
  workflow_dispatch: null
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BUILD_WORKER_COUNT: '1'
      NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
      NEXT_TURBOPACK: '1'

    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: npm
    - run: rm -rf node_modules .next node
    - run: npm ci --prefer-offline --no-audit --fund=false || npm install --force
    # Turbopack build (Next 16 default) uses a fraction of webpack's memory on this 135k-file tree;
    # webpack build OOMs even with 24GB heap + 16GB swap. Do NOT use `npm run build` (forces --webpack).
    - run: npx next build
      timeout-minutes: 25
