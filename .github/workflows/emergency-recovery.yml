name: Emergency Recovery - Minimal Build
"on":
  workflow_dispatch: null
  push:
    branches:
    - main
    paths-ignore:
    - '**/STATUS.md'
    - 'automation/reports/**'

# Prevent duplicate recovery runs from rapid consecutive pushes from
# cancelling/colliding with each other.
concurrency:
  group: emergency-recovery-main
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    # Next.js build on the 90k+ file tree regularly exceeds 20-25 min;
    # give the build enough headroom so it is not killed mid-compile.
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BUILD_WORKER_COUNT: '1'
      NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Add swap space (mitigate Next.js build OOM on 90k+ file tree)
      run: |
        # Ensure total swap >= 16G; runner image may already ship a small /swapfile
        SWAP_MB=$(swapon --show=SIZE --noheadings --bytes | awk '{s+=$1} END {print int(s/1048576)}')
        echo "existing swap: ${SWAP_MB} MB"
        if [ "${SWAP_MB:-0}" -lt 16384 ]; then
          sudo fallocate -l 16G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=16384
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
        fi
        free -h
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
    - run: rm -rf node_modules .next node
    - run: npm install --force
    - run: npm run build
