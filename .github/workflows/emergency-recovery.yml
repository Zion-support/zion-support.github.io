name: Emergency Recovery - Minimal Build
"on":
  workflow_dispatch: null
  push:
    branches:
    - main
    paths-ignore:
    - '**/STATUS.md'
    - 'automation/reports/**'
jobs:
  recovery:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BUILD_WORKER_COUNT: '1'
      NODE_OPTIONS: --max-old-space-size=15360 --max-semi-space-size=64
    steps:
    - uses: actions/checkout@v7
    - name: Add swap space (mitigate Next.js build OOM on 90k+ file tree)
      run: |
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - run: rm -rf node_modules .next node
    - run: npm install --force
    - run: npm run build
    timeout-minutes: 25
