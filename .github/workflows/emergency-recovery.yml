name: Emergency Recovery - Minimal Build
"on":
  workflow_dispatch: null
  push:
    branches:
    - main
    paths-ignore:
      - 'STATUS.md'
      - 'public/ops/**'
      - 'ops/**'
      - '*.md'
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=14336
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '22'
    - run: rm -rf node_modules .next node
    - run: npm install --force --no-audit --fund=false
    - name: Build (Turbopack default; 14GB heap; webpack build OOMed at 12GB)
      run: npx next build
