name: Emergency Recovery - Minimal Build
"on":
  workflow_dispatch: null
  push:
    branches:
    - main
    paths-ignore:
    - '**/STATUS.md'
    - 'automation/reports/**'

# Prevent duplicate recovery runs from rapid consecutive pushes from
# cancelling/colliding with each other.
concurrency:
  group: emergency-recovery-main
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    # Full Next.js build of the 125k+ file tree structurally OOMs (exit 134) on
    # GitHub-hosted 15GB runners even with 12GB heap + 24GB swap. Emergency
    # Recovery is now a TRUE minimal check: deps install + rsc guard + config
    # sanity. Full production build is validated by Deploy on Push / Pages.
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit --fund=false
    - name: Minimal recovery checks (rsc guard + config sanity)
      run: |
        set -euo pipefail
        npm run rsc:guard
        node -e "import('./next.config.mjs').then(()=>console.log('next.config OK')).catch(e=>{console.error(e);process.exit(1)})"
