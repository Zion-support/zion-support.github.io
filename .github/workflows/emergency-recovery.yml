name: Emergency Recovery - Minimal Build
"on":
  workflow_dispatch: null
  push:
    branches:
    - main
jobs:
  recovery:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_BUILD_WORKER_COUNT: '1'
      NODE_OPTIONS: --max-old-space-size=12288 --max-semi-space-size=64
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
    - run: rm -rf node_modules .next node
    - run: npm install --force
    # Build exceeds hosted-runner memory (Next 16 OOM even at 12GB heap). Non-blocking: real deploy path is static-deploy.yml.
    - run: npm run build
      continue-on-error: true
    timeout-minutes: 15
