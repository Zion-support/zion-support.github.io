name: AI GHA npm cache audit (PR)

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - '.github/workflows/**'

concurrency:
  group: ai-gha-npm-cache-audit-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: hashFiles('automation/gha-npm-cache-audit.cjs') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: hashFiles('automation/gha-npm-cache-audit.cjs') != ''
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Strict npm cache audit
        env:
          GHA_NPM_CACHE_AUDIT_STRICT: '1'
        run: |
          if [ -f automation/gha-npm-cache-audit.cjs ]; then
            node automation/gha-npm-cache-audit.cjs
          else
            echo "automation/gha-npm-cache-audit.cjs is not on this branch; skipping"
          fi
