name: Tracked credential filename guard (scoped PR and manual)

# Filename metadata only; no secret contents, external services, or scheduled runner.
"on":
  pull_request:
    paths:
      - '.ssh/**'
      - '**/.ssh/**'
      - '.env'
      - '.env.*'
      - '**/.env'
      - '**/.env.*'
      - '**/.aws/credentials'
      - '**/.kube/config'
      - '**/.netrc'
      - '**/.pypirc'
      - '**/.npmrc'
      - '**/*.pem'
      - '**/*.key'
      - '**/*.p12'
      - '**/*.pfx'
      - '**/*.tfstate*'
      - 'automation/check-tracked-credential-paths.cjs'
      - 'automation/check-tracked-credential-paths.test.cjs'
      - '.github/workflows/credential-filename-pr-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-filename-pr-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tracked-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout read-only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test classifier (Node built-ins only)
        run: node --test automation/check-tracked-credential-paths.test.cjs

      - name: Scan tracked filenames (no credential content access)
        id: scan
        continue-on-error: true
        run: node automation/check-tracked-credential-paths.cjs

      - name: Upload bounded filename metadata
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: credential-filename-pr-${{ github.run_id }}
          path: automation/reports/tracked-credential-paths-latest.json
          retention-days: 7
          if-no-files-found: error

      - name: Fail closed for credential path exposure
        if: always() && steps.scan.outcome == 'failure'
        run: |
          echo "::error::Tracked high-risk credential paths or invalid Git checkout. Release stays blocked; consult SecOps for credential revocation and history cleanup."
          exit 1
