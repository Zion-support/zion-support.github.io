name: Website Monitor Freshness Guard

on:
  schedule:
    - cron: '53 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check scheduled monitor freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,urllib.request,urllib.error,sys
          now=datetime.datetime.now(datetime.timezone.utc)
          repo=os.environ['GH_REPOSITORY']
          token=os.environ['GH_TOKEN']
          workflows={'public-site-smoke-check.yml':3,'dependency-security-baseline.yml':10,'public-sitemap-integrity.yml':10,'public-navigation-link-audit.yml':10,'public-tls-certificate-expiry.yml':7,'apps-production-content-canary.yml':3,'apps-rollback-readiness.yml':3,'apps-i18n-release-contract.yml':10,'apps-release-evidence-manifest.yml':10,'apps-deployed-source-drift.yml':3,'actions-queue-pressure.yml':2}
          failures=[]
          rows=['## Zion monitor freshness','','| Workflow | Latest completed run | Age | Status |','|---|---|---|---|']
          for filename,max_days in workflows.items():
              url='https://api.github.com/repos/'+repo+'/actions/workflows/'+filename+'/runs?per_page=10'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Zion-Monitor-Freshness-Guard'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      runs=json.load(response).get('workflow_runs',[])
                  completed=[r for r in runs if r.get('status')=='completed']
                  if not completed:
                      workflow_url='https://api.github.com/repos/'+repo+'/actions/workflows/'+filename
                      wreq=urllib.request.Request(workflow_url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'Zion-Monitor-Freshness-Guard'})
                      with urllib.request.urlopen(wreq,timeout=20) as wresponse:
                          workflow=json.load(wresponse)
                      created=workflow.get('created_at')
                      if created:
                          created_dt=datetime.datetime.fromisoformat(created.replace('Z','+00:00'))
                          if (now-created_dt).total_seconds()/86400 <= max_days:
                              rows.append('| '+filename+' | awaiting first run | n/a | GRACE |')
                              continue
                      raise ValueError('No completed runs found after startup grace')
                  latest=max(completed,key=lambda r:r.get('created_at',''))
                  when=datetime.datetime.fromisoformat(latest['created_at'].replace('Z','+00:00'))
                  age=(now-when).total_seconds()/86400
                  status='OK' if age<=max_days else 'STALE'
                  rows.append('| '+filename+' | [run]('+latest['html_url']+') | '+format(age,'.1f')+' days | '+status+' |')
                  if age>max_days: failures.append(filename+' stale for '+format(age,'.1f')+' days')
              except urllib.error.HTTPError as exc:
                  if exc.code==404:
                      history_url='https://api.github.com/repos/'+repo+'/commits?path=.github/workflows/'+filename+'&per_page=100'
                      hreq=urllib.request.Request(history_url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Zion-Monitor-Freshness-Guard'})
                      try:
                          with urllib.request.urlopen(hreq,timeout=20) as hresponse:
                              history=json.load(hresponse)
                          dates=[c.get('commit',{}).get('committer',{}).get('date') for c in history]
                          dates=[d for d in dates if d]
                          if dates:
                              oldest=min(datetime.datetime.fromisoformat(d.replace('Z','+00:00')) for d in dates)
                              age_days=(now-oldest).total_seconds()/86400
                              if age_days<=max_days:
                                  rows.append('| '+filename+' | file exists; awaiting Actions registration | '+format(age_days,'.1f')+' days | GRACE |')
                                  continue
                          rows.append('| '+filename+' | unregistered | n/a | ERROR |')
                          failures.append(filename+': workflow file exists but is not registered with GitHub Actions')
                      except Exception as history_exc:
                          rows.append('| '+filename+' | unavailable | n/a | ERROR |')
                          failures.append(filename+': 404 plus history lookup failed: '+str(history_exc))
                  else:
                      rows.append('| '+filename+' | unavailable | n/a | ERROR |')
                      failures.append(filename+': HTTP '+str(exc.code))
              except Exception as exc:
                  rows.append('| '+filename+' | unavailable | n/a | ERROR |')
                  failures.append(filename+': '+str(exc))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
              output.write(chr(10).join(rows)+chr(10))
          for failure in failures: print('::error title=Monitor freshness problem::'+failure)
          if failures: sys.exit(1)
          PY
