permissions:
  contents: read
name: AI Auto Fix Weekly
"on":
  schedule:
  - cron: 0 2 * * 0
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v6.0.2
    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci
    - name: Apply non-breaking dependency fixes
      # Set the exit threshold directly; never suppress an install/registry error.
      # Moderate/low advisories remain in the full audit report.
      run: npm audit fix --audit-level=high
    - name: Enforce high and critical dependency audit
      run: npm audit --audit-level=high
    - name: Run actual lint check
      run: npm run lint:check
    - name: Run type check
      run: npm run type-check
    - name: Commit changes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        node -e '
          const { execFileSync } = require("node:child_process");
          const status = execFileSync("git", ["status", "--porcelain=v1", "--untracked-files=all", "-z"]);
          if (status.length && !status.equals(Buffer.from(" M package-lock.json\0"))) {
            console.error("Unexpected workspace change; review manually. No branch or PR will be created.");
            process.exit(1);
          }
        '
        diff_status=0
        git diff --quiet -- package-lock.json || diff_status=$?
        case "$diff_status" in
          0) exit 0 ;;
          1) ;;
          *) exit "$diff_status" ;;
        esac
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout -b auto-fix/$(date +%Y-%m-%d)
        git add -- package-lock.json
        git commit -m "chore: auto-fix dependencies and lint"
        git push origin HEAD
        gh pr create --title "Auto-fix: dependencies and lint" --body "Automated fixes from the AI Auto Fix Weekly workflow." --base main --head "$(git rev-parse --abbrev-ref HEAD)"
    timeout-minutes: 10
