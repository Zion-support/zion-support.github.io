name: Continuous Pages Deploy

# Commercial Pages publisher on push to main. public/ is source of truth
# (scripts/prepare-pages-out.sh). Do NOT rebuild Next.js here.
# Shares the `pages` concurrency group with static-deploy.yml: one publish at
# a time, never cancelled mid-flight; GitHub keeps only the newest pending run.
# 2026-10-04 hardening: pinned actions, publish guard
# (scripts/pages-publish-guard.sh) strips ops/, internal *.md, .netrc and
# report JSONs from out/ and fails on missing/stub key pages.
# FIELD-SERVICES LOCK. No invented Stripe/prices. Apollo HOLD.

on:
  push:
    branches: [main]
    # GitHub forbids paths + paths-ignore on the same event.
    paths:
      - 'public/**'
      - '!public/ops/**'
      - 'index.html'
      - '_redirects'
      - 'scripts/prepare-pages-out.sh'
      - 'scripts/pages-publish-guard.sh'
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Guard main ref
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Continuous Pages Deploy is pinned to main only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Prepare pages from public/
        run: bash scripts/prepare-pages-out.sh

      - name: Publish guard (strip internal content, assert key pages)
        run: bash scripts/pages-publish-guard.sh out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
