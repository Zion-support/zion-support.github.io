name: Continuous Pages Deploy

# Commercial Pages publisher. public/ is source of truth (prepare-pages-out.sh).
# Do NOT rebuild Next.js here — that 30–70m job held the concurrency slot and
# let STATUS.md / CI / dispatch floods cancel the #71405 Family A publish.
#
# Hermes Monitor (ops/comms/STATUS.md) and war-room pulse outside public/
# never match `paths` below, so they never share the deploy slot.
# Avoid paths+paths-ignore together — GitHub rejects that combo (YAML fail).
# FIELD-SERVICES LOCK. No invented Stripe/prices. Apollo HOLD.

on:
  push:
    branches: [main]
    # GitHub forbids paths + paths-ignore on the same event (0s workflow failure).
    # Allowlist only commercial publish inputs. Negate war-room pulse under public/ops.
    # Hermes STATUS.md lives at ops/comms/STATUS.md and is not in this list.
    paths:
      - 'public/**'
      - '!public/ops/**'
      - 'index.html'
      - '_redirects'
      - 'scripts/prepare-pages-out.sh'
      - 'scripts/render-productivity-release.cjs'
      - 'scripts/render-field-evidence-release.cjs'
      - 'scripts/render-field-evidence-release-base.cjs'
      - 'scripts/automation/generate-automation-health-snapshot.cjs'
      - 'scripts/automation/pages-automation-health-artifact.cjs'
      - 'scripts/render-operational-tools.cjs'
      - 'scripts/render-roi-baseline.cjs'
      - 'scripts/test-roi-baseline.cjs'
      - 'content/roi-baseline.json'
      - 'scripts/test-operational-tools.cjs'
      - 'content/operational-tools.json'
      - 'content/operational-examples.json'
      - 'scripts/render-contact-pages.cjs'
      - 'content/contact-pages.json'
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # All production Pages publishers share this queue. Retain pending releases;
  # a late stale event must not replace the pending current-head publication.
  group: zion-production-pages-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check automatic Pages source
        id: release-source
        uses: actions/github-script@v7
        env:
          PAGES_CANDIDATE_SHA: ${{ github.sha }}
        with:
          script: |
            const candidate = process.env.PAGES_CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(candidate || '')) {
              throw new Error('Missing or invalid Pages source commit');
            }
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('publish', 'true');
              core.setOutput('state', 'manual');
              core.notice(`Preserving explicitly dispatched Pages source ${candidate}`);
              return;
            }
            if (!['push', 'workflow_run'].includes(context.eventName)) {
              throw new Error(`Unsupported automatic Pages event: ${context.eventName}`);
            }
            const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            const current = data.object?.sha;
            if (!/^[0-9a-f]{40}$/.test(current || '')) {
              throw new Error('Could not verify the current main commit');
            }
            const publish = candidate === current;
            core.setOutput('publish', String(publish));
            core.setOutput('state', publish ? 'current' : 'superseded');
            const message = publish
              ? `Current Pages source: ${candidate}`
              : `Superseded Pages source ${candidate}; current main is ${current}. Publication skipped.`;
            core.notice(message);
            await core.summary.addHeading('Pages source freshness').addRaw(message).write();

      - name: Checkout
        if: steps.release-source.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard main ref
        if: steps.release-source.outputs.publish == 'true'
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Continuous Pages Deploy is pinned to main only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Setup Node.js for health collection
        if: steps.release-source.outputs.publish == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Collect observed automation health before assembly
        id: automation-health
        if: steps.release-source.outputs.publish == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/automation/pages-automation-health-artifact.cjs collect

      - name: Prepare pages from public/
        if: steps.release-source.outputs.publish == 'true'
        run: bash scripts/prepare-pages-out.sh

      - name: Gate reviewed five-language productivity rendering
        if: steps.release-source.outputs.publish == 'true'
        run: node scripts/render-productivity-release.cjs out

      - name: Render field evidence release (adds data-field-evidence-release markers)
        if: steps.release-source.outputs.publish == 'true'
        run: node scripts/render-field-evidence-release.cjs out

      - name: Verify operational tools in the final Pages artifact
        if: steps.release-source.outputs.publish == 'true'
        run: node scripts/test-operational-tools.cjs out --artifact-only

      - name: Reject private operational files in final Pages artifact
        if: steps.release-source.outputs.publish == 'true'
        run: python3 scripts/assert-no-private-ops.py out

      - name: Validate collected automation health in final Pages artifact
        if: steps.release-source.outputs.publish == 'true'
        env:
          AUTOMATION_HEALTH_ARTIFACT_SHA256: ${{ steps.automation-health.outputs.snapshot_sha256 }}
        run: node scripts/automation/pages-automation-health-artifact.cjs verify

      - name: Upload Pages artifact
        if: steps.release-source.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Recheck source immediately before deployment
        id: deploy-source
        if: steps.release-source.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          PAGES_CANDIDATE_SHA: ${{ github.sha }}
        with:
          script: |
            const candidate = process.env.PAGES_CANDIDATE_SHA;
            if (!/^[0-9a-f]{40}$/.test(candidate || '')) {
              throw new Error('Missing or invalid Pages source commit');
            }
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('publish', 'true');
              core.setOutput('state', 'manual');
              core.notice(`Preserving explicitly dispatched Pages source ${candidate}`);
              return;
            }
            if (!['push', 'workflow_run'].includes(context.eventName)) {
              throw new Error(`Unsupported automatic Pages event: ${context.eventName}`);
            }
            const {data} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            const current = data.object?.sha;
            if (!/^[0-9a-f]{40}$/.test(current || '')) {
              throw new Error('Could not verify the current main commit');
            }
            const publish = candidate === current;
            core.setOutput('publish', String(publish));
            core.setOutput('state', publish ? 'current' : 'superseded');
            const message = publish
              ? `Current Pages source: ${candidate}`
              : `Superseded Pages source ${candidate}; current main is ${current}. Publication skipped.`;
            core.notice(message);
            await core.summary.addHeading('Pages source freshness').addRaw(message).write();

      - name: Deploy to GitHub Pages
        if: steps.deploy-source.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
