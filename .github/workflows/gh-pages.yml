name: Continuous Pages Deploy

# Commercial Pages publisher. public/ is source of truth (prepare-pages-out.sh).
# Do NOT rebuild Next.js here — that 30–70m job held the concurrency slot and
# let STATUS.md / CI / dispatch floods cancel the #71405 Family A publish.
#
# Only an ops/comms/STATUS.md-only push is excluded from this entrypoint.
# Other war-room/STATUS paths are conservatively treated as publication inputs.
# Avoid paths+paths-ignore together — GitHub rejects that combo (YAML fail).
# FIELD-SERVICES LOCK. No invented Stripe/prices. Apollo HOLD.

on:
  push:
    branches: [main]
    # Conservative input coverage: all source changes except the known non-published ops pulse.
    # public/STATUS files are artifacts and must still trigger publication.
    paths:
      - '**'
      - '!ops/comms/STATUS.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/canonical-pages.yml
  validate-production:
    needs: deploy
    if: ${{ github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && needs.deploy.outputs.source_sha == github.sha }}
    permissions:
      contents: read
    uses: ./.github/workflows/ai-production-deploy-validation.yml
    with:
      source_sha: ${{ needs.deploy.outputs.source_sha }}
