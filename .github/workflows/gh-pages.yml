name: Continuous Pages Deploy

# Commercial Pages publisher. public/ is source of truth (prepare-pages-out.sh).
# Do NOT rebuild Next.js here — that 30–70m job held the concurrency slot and
# let STATUS.md / CI / dispatch floods cancel the #71405 Family A publish.
#
# Hermes Monitor (ops/comms/STATUS.md) and war-room pulse outside public/
# never match `paths` below, so they never share the deploy slot.
# Avoid paths+paths-ignore together — GitHub rejects that combo (YAML fail).
# FIELD-SERVICES LOCK. No invented Stripe/prices. Apollo HOLD.

on:
  push:
    branches: [main]
    # GitHub forbids paths + paths-ignore on the same event (0s workflow failure).
    # Allowlist only commercial publish inputs. Negate war-room pulse under public/ops.
    # Hermes STATUS.md lives at ops/comms/STATUS.md and is not in this list.
    paths:
      - 'public/**'
      - '!public/ops/**'
      - 'index.html'
      - '_redirects'
      - 'scripts/prepare-pages-out.sh'
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep this group name so a merged commercial run can preempt the in-flight
  # Next.js Continuous Pages Deploy (same group). STATUS/Hermes never join
  # because they are filtered out of on.push paths above.
  # cancel-in-progress: latest commercial push wins (prepare is ~1m, not 60m).
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard main ref
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Continuous Pages Deploy is pinned to main only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Prepare pages from public/
        run: bash scripts/prepare-pages-out.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
