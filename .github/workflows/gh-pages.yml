name: Continuous Pages Deploy

# Commercial Pages publisher. public/ is source of truth (prepare-pages-out.sh).
# Do NOT rebuild Next.js here — that 30–70m job held the concurrency slot and
# let STATUS.md / CI / dispatch floods cancel the #71405 Family A publish.
#
# Hermes Monitor (ops/comms/STATUS.md) and war-room pulse outside public/
# never match `paths` below, so they never share the deploy slot.
# Avoid paths+paths-ignore together — GitHub rejects that combo (YAML fail).
# FIELD-SERVICES LOCK. No invented Stripe/prices. Apollo HOLD.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep this group name so a merged commercial run can preempt the in-flight
  # Next.js Continuous Pages Deploy (same group). STATUS/Hermes never join
  # because they are filtered out of on.push paths above.
  # cancel-in-progress: latest commercial push wins (prepare is ~1m, not 60m).
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard main ref
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA} event=${GITHUB_EVENT_NAME}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Continuous Pages Deploy is pinned to main only (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Prepare pages from public/
        run: bash scripts/prepare-pages-out.sh

      - name: Render translated Discovery and communications content
        run: node scripts/render-discovery-showcase.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify custom-domain deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://ziontechgroup.com"
          fetch_until() {
            local url="$1"
            local marker="$2"
            local tries=12
            local i
            for i in $(seq 1 "$tries"); do
              body="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?deploy_sha=${GITHUB_SHA}" || true)"
              if printf '%s' "$body" | grep -Fq "$marker"; then
                echo "OK ${url} marker=${marker}"
                return 0
              fi
              echo "waiting for ${url} (${i}/${tries})"
              sleep 10
            done
            echo "::error::${url} did not expose marker '${marker}' after deploy sha ${GITHUB_SHA}"
            return 1
          }

          fetch_until "${base}/" "~5 minutos"
          fetch_until "${base}/apps/network-batch75.html" "Logistics &amp; Supply Chain AI Suite"
          fetch_until "${base}/supplier-risk-radar/" "Supplier Risk Radar"
