name: AI lead gen contact route guard (read-only)

permissions:
  contents: read

"on":
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  pull_request:
    paths:
      - '.github/workflows/ai-lead-gen-contact-route-guard.yml'
      - 'scripts/automation/lead-gen-contact-route-guard.cjs'
      - 'scripts/automation/lead-gen-contact-route-guard.test.cjs'

concurrency:
  group: ai-lead-gen-contact-route-guard-${{ github.event_name == 'pull_request' && 'contract' || 'production' }}
  cancel-in-progress: false

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout (without credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test public route contract offline
        run: node --test scripts/automation/lead-gen-contact-route-guard.test.cjs

  live-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout (without credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: GET public Zion contact route and verify expected contact
        env:
          LEAD_GEN_BASE_URL: https://ziontechgroup.com
          LEAD_GEN_EXPECTED_EMAIL: kleber@ziontechgroup.com
        run: node scripts/automation/lead-gen-contact-route-guard.cjs
