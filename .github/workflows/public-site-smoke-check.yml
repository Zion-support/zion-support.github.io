name: Public Site Smoke Check

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-smoke-check
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public routes
        shell: bash
        env:
          BASE_URL: https://ziontechgroup.com
        run: |
          set -euo pipefail
          failures=0
          for path in / /apps/ /discovery/; do
            url="${BASE_URL}${path}"
            echo "::group::Checking ${url}"
            status="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 2 "${url}")" || status="000"
            echo "HTTP ${status}"
            if [[ ! "${status}" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error title=Public route unavailable::${path} returned HTTP ${status}"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if (( failures > 0 )); then
            echo "::error::${failures} public routes failed their availability checks"
            exit 1
          fi
          echo "All monitored routes returned HTTP 2xx"
