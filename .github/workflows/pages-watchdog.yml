name: Pages Watchdog

permissions:
  contents: read
  issues: write

concurrency:
  group: pages-watchdog
  cancel-in-progress: true

"on":
  schedule:
    # 2026-10-04: every 15 min -> hourly (noise/cost).
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: python -m pip install requests
      - name: Probe Pages
        run: python automation/scripts/pages_watchdog.py
      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-watchdog-report
          path: automation/reports/pages-watchdog-latest.json
          retention-days: 7
      - name: Create issue on regression
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = 'automation/reports/pages-watchdog-latest.json';
            let body = 'Pages watchdog failed.';
            try {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              body = `## Pages Watchdog Failure\n\n${data.routes_checked} checked, ${data.routes_broken} broken at ${data.checked_at}.\n\nReport: \`pages-watchdog-report\` artifact in this run.`;
            } catch {}
            await github.rest.issues.create({
              ...context.repo,
              title: `🔴 Pages Watchdog Failure - ${new Date().toISOString().split('T')[0]}`,
              body,
              labels: ['production-incident', 'bug']
            });
