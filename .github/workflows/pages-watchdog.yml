name: Pages Watchdog

permissions:
  contents: read
  issues: write

concurrency:
  group: pages-watchdog-${{ github.event_name == 'pull_request' && 'contract' || 'production' }}
  cancel-in-progress: true

"on":
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pages-watchdog.yml'
      - 'scripts/automation/pages-watchdog-incident.cjs'
      - 'scripts/automation/pages-watchdog-incident.test.cjs'

jobs:
  incident-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test incident decision and redacted issue text (offline)
        run: node --test scripts/automation/pages-watchdog-incident.test.cjs

  watchdog:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: python -m pip install requests
      - name: Probe Pages
        id: probe
        continue-on-error: true
        run: python automation/scripts/pages_watchdog.py
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-watchdog-report
          path: automation/reports/pages-watchdog-latest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Create one deduplicated issue only for confirmed page failures
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const file = 'automation/reports/pages-watchdog-latest.json';
            if (!fs.existsSync(file)) {
              core.warning('Probe failed before producing a page report; no outage issue created.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const {isFreshVerifiedRegression, decideIncident, buildIssueBody, INCIDENT_TITLE} =
              require(process.env.GITHUB_WORKSPACE + '/scripts/automation/pages-watchdog-incident.cjs');
            if (!isFreshVerifiedRegression(report)) {
              core.warning('Probe failure does not have a fresh verified >=2-route regression; no outage issue created.');
              return;
            }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'production-incident', per_page: 100
            });
            const decision = decideIncident(report, openIssues);
            if (decision.action === 'existing') {
              core.info('Reusing open Pages incident #' + decision.issueNumber + '; no duplicate created.');
              return;
            }
            if (decision.action !== 'create') return;
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY +
              '/actions/runs/' + process.env.GITHUB_RUN_ID;
            const body = buildIssueBody(report, runUrl);
            const created = await github.rest.issues.create({
              ...context.repo, title: INCIDENT_TITLE, body, labels: ['production-incident', 'bug']
            });
            core.info('Created one Pages incident #' + created.data.number);
      - name: Preserve failed status for a confirmed or inconclusive probe failure
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::Pages Watchdog probe failed; review the Actions artifact."
          exit 1
