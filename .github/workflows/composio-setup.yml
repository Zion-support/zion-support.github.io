name: Composio Account Setup
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/composio-setup.yml'
    branches:
      - main

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Composio API key and list active account count
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMPOSIO_API_KEY:-}" ]; then
            echo "::error::COMPOSIO_API_KEY secret is not set."
            exit 1
          fi
          code=$(curl --silent --show-error --output /tmp/composio-accounts.json --write-out "%{http_code}"             --header "X-API-Key: ${COMPOSIO_API_KEY}"             "https://backend.composio.dev/api/v3/connected_accounts?statuses=ACTIVE&limit=100")
          echo "Composio connected_accounts HTTP status: $code"
          case "$code" in
            2*) ;;
            401|403)
              echo "::error::Composio credential is invalid, expired or unauthorized (HTTP $code)."
              exit 1
              ;;
            *)
              echo "::error::Composio API returned unexpected HTTP $code."
              head -c 500 /tmp/composio-accounts.json || true
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import json
          with open('/tmp/composio-accounts.json', encoding='utf-8') as fh:
              data=json.load(fh)
          items=data.get('items') or data.get('connected_accounts') or data.get('connectedAccounts') or []
          print(f"Active connected accounts: {len(items)}")
          PY

      - name: Summary
        run: echo "Composio account validation completed at $(date -u)"
