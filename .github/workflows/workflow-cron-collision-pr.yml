name: Workflow cron collision report (PR / main)

"on":
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'automation/ai-cron-collision-tuner.cjs'
      - 'automation/ai-cron-collision-tuner.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

# PR runs do not cancel the existing weekly main-branch evidence.
concurrency:
  group: cron-collision-pr-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'manual' }}
  cancel-in-progress: true

jobs:
  collision-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (no persisted token)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Offline cron model tests
        run: node --test automation/ai-cron-collision-tuner.test.cjs

      - name: Analyze theoretical cron collisions (read-only)
        run: node automation/ai-cron-collision-tuner.cjs

      - name: Upload sanitized cron evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cron-collision-pr-${{ github.run_id }}
          path: |
            automation/reports/cron-collision-latest.json
            automation/reports/cron-collision-latest.md
          if-no-files-found: error
          retention-days: 14
