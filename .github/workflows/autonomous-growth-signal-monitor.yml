name: Autonomous Growth Signal Monitor

# Read-only public acquisition-funnel evidence; no mailing, payments, issue mutation or CRM writes.
"on":
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/autonomous-growth-signal-monitor.yml'
      - 'automation/growth-signal-verifier.cjs'
      - 'automation/growth-signal-verifier.test.cjs'

permissions:
  contents: read

concurrency:
  group: growth-signal-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Offline regression tests
        run: node --test automation/growth-signal-verifier.test.cjs

      - name: Probe public conversion funnel (read-only)
        if: github.event_name != 'pull_request'
        run: node automation/growth-signal-verifier.cjs

      - name: Publish sanitized evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: autonomous-growth-signal-${{ github.run_id }}
          path: |
            automation/reports/autonomous-growth-signal-latest.json
            automation/reports/autonomous-growth-signal-latest.md
          if-no-files-found: error
          retention-days: 14
