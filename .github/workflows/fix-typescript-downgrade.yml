name: One-shot — downgrade TypeScript 7 to 5.9.x

permissions:
  contents: write

"on":
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Downgrade typescript and regenerate lockfile
        run: |
          set -euo pipefail
          sed -i 's/"typescript": "7.0.2"/"typescript": "^5.9.3"/' package.json
          npm install --package-lock-only --legacy-peer-deps --no-audit --fund=false
          node -e "const l=require('./package-lock.json');console.log('lock ts:', l.packages['node_modules/typescript'].version)"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "fix(deps): downgrade typescript 7.0.2 -> ^5.9.3 (typescript-estree crash 'Cjs' in lint:check / AI Content Burst Ultra)"
          git push origin main
