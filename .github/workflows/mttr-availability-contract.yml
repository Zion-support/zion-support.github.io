name: MTTR availability contract

"on":
  pull_request:
    paths:
      - '.github/workflows/mttr-availability-contract.yml'
      - '.github/workflows/ai-automation-issue-index-weekly.yml'
      - '.github/workflows/ai-mttr-*.yml'
      - 'automation/generate-automation-issue-index.cjs'
      - 'automation/ai-mttr-fingerprint-regression-guard.cjs'
      - 'automation/ai-mttr-slo-guard.cjs'
      - 'automation/mttr-fingerprint-arbitration-digest.cjs'
      - 'automation/lib/mttr-unavailable.cjs'
      - 'tests/ci/test_mttr_unavailable.cjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
      - name: Verify unavailable MTTR components fail with truthful diagnostics
        run: node --test tests/ci/test_mttr_unavailable.cjs
