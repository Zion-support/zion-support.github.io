name: Catalog health watchdog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "public/index.html"
      - "public/data/zion-catalog.json"
      - "public/assets/js/zion-catalog.js"
      - ".github/workflows/catalog-health.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Probe homepage advertising + catalog JS
        env:
          PROBE_LIVE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          html_file=public/index.html
          js_file=public/assets/js/zion-catalog.js
          if [ "${PROBE_LIVE}" = "true" ]; then
            html_file=$(mktemp)
            js_file=$(mktemp)
            curl -fsSL https://ziontechgroup.com/ -o "$html_file"
            curl -fsSL https://ziontechgroup.com/assets/js/zion-catalog.js -o "$js_file"
          fi
          must=(
            "Catálogo vivo"
            "Diagnóstico rápido"
            "Telegram"
            "Discovery"
            "CPA"
            "Agentes"
            "Ferramentas"
            "Academia"
            "FinOps"
            "WhatsApp"
          )
          fail=0
          for s in "${must[@]}"; do
            if ! grep -Fq -- "$s" "$html_file"; then
              echo "MISSING on homepage: $s"
              fail=1
            else
              echo "OK: $s"
            fi
          done
          js_must=(
            'Discovery $99'
            "Agentes Telegram"
            "Estimador FinOps"
            "ensureFinops"
            "finops-form"
          )
          for s in "${js_must[@]}"; do
            if ! grep -Fq -- "$s" "$js_file"; then
              echo "MISSING in catalog JS: $s"
              fail=1
            else
              echo "OK JS: $s"
            fi
          done
          if [ "${PROBE_LIVE}" = "true" ]; then
            routes=(
              https://ziontechgroup.com/
              https://ziontechgroup.com/services/
              https://ziontechgroup.com/agents/
              https://ziontechgroup.com/plans/
              https://ziontechgroup.com/discovery/
              https://ziontechgroup.com/booking/
              https://ziontechgroup.com/cpa/
              https://ziontechgroup.com/free-ai-it-tools/
              https://ziontechgroup.com/academy/
              https://ziontechgroup.com/blog/
              https://ziontechgroup.com/telegram/
              https://ziontechgroup.com/pricing/
              https://ziontechgroup.com/finops-consulting/
              https://ziontechgroup.com/assets/js/zion-catalog.js
            )
            for u in "${routes[@]}"; do
              code=$(curl -sI -o /dev/null -w "%{http_code}" "$u")
              echo "$code $u"
              case "$code" in
                200|301|302) ;;
                *) echo "BAD STATUS $code $u"; fail=1 ;;
              esac
            done
          else
            for rel in \
              public/index.html \
              public/services/index.html \
              public/agents/index.html \
              public/plans/index.html \
              public/discovery/index.html \
              public/booking/index.html \
              public/cpa/index.html \
              public/free-ai-it-tools/index.html \
              public/academy/index.html \
              public/blog/index.html \
              public/telegram/index.html \
              public/pricing/index.html \
              public/finops-consulting/index.html \
              public/assets/js/zion-catalog.js
            do
              if [ ! -e "$rel" ]; then
                echo "MISSING FILE $rel"
                fail=1
              else
                echo "OK FILE $rel"
              fi
            done
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Watchdog found gaps."
            exit 1
          fi
          echo "Watchdog green."
