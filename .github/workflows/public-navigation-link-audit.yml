name: Public Navigation Link Audit

# Same weekly schedule; broader deterministic rotation instead of first 25 sorted links.
# All network checks are HTTP GET only and never run on pull_request.
"on":
  schedule:
    - cron: '37 12 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/public-navigation-link-audit.yml'
      - 'scripts/automation/public_navigation_rotation.py'
      - 'scripts/automation/test_public_navigation_rotation.py'

permissions:
  contents: read

concurrency:
  group: public-navigation-link-audit-\${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: \${{ github.event_name == 'pull_request' }}

jobs:
  offline-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout only the audit source and fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/automation/public_navigation_rotation.py
            /scripts/automation/test_public_navigation_rotation.py
          sparse-checkout-cone-mode: false
      - name: Verify URL safety, rotation, coverage and failure cases (offline)
        run: python3 -m unittest discover -s scripts/automation -p 'test_public_navigation_rotation.py' -v

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout only the audit source and fixtures
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/automation/public_navigation_rotation.py
            /scripts/automation/test_public_navigation_rotation.py
          sparse-checkout-cone-mode: false
      - name: Verify offline audit invariants
        run: python3 -m unittest discover -s scripts/automation -p 'test_public_navigation_rotation.py' -v
      - name: Audit essential pages and rotating internal navigation sample
        run: python3 scripts/automation/public_navigation_rotation.py
      - name: Upload bounded route-health evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: public-navigation-audit-\${{ github.run_id }}
          path: public-navigation-audit.json
          if-no-files-found: warn
          retention-days: 14
