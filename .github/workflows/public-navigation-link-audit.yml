name: Public Navigation Link Audit

on:
  schedule:
    - cron: '37 12 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-navigation-link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check key public internal links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html.parser, urllib.request, urllib.parse, urllib.error, sys
          from concurrent.futures import ThreadPoolExecutor
          base='https://ziontechgroup.com'
          seeds=['/','/apps/','/discovery/']
          headers={'User-Agent':'Zion-Public-Link-Audit/1.0'}
          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag!='a': return
                  value=dict(attrs).get('href')
                  if value: self.links.append(value)
          def fetch(url):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=18) as response:
                  return response.status,response.read(2_000_000).decode('utf-8','replace')
          discovered=set()
          for path in seeds:
              url=base+path
              try:
                  status,body=fetch(url)
                  parser=Links(); parser.feed(body)
                  for href in parser.links:
                      target=urllib.parse.urljoin(url,href)
                      parts=urllib.parse.urlsplit(target)
                      if parts.scheme=='https' and parts.netloc=='ziontechgroup.com':
                          clean=urllib.parse.urlunsplit((parts.scheme,parts.netloc,parts.path,parts.query,''))
                          discovered.add(clean)
                  print(f'{path}: HTTP {status}, internal links collected')
              except Exception as exc:
                  print(f'::error title=Navigation source unavailable::{path}: {exc}')
                  sys.exit(1)
          candidates=sorted(discovered)[:35]
          if not candidates:
              print('::error::No internal navigation links discovered')
              sys.exit(1)
          def check(url):
              try:
                  status,_=fetch(url)
                  return (url,status,'')
              except Exception as exc:
                  return (url,0,str(exc))
          with ThreadPoolExecutor(max_workers=4) as pool:
              results=list(pool.map(check,candidates))
          failures=[x for x in results if x[1]<200 or x[1]>=400]
          print(f'Checked {len(candidates)} of {len(discovered)} unique internal links; failed: {len(failures)}')
          for url,status,error in failures:
              print(f'::error title=Broken internal link::{url} status={status} {error}')
          if failures: sys.exit(1)
          PY
