name: CodeQL Security Analysis

permissions:
  contents: read
  security-events: write
  actions: read

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Bound CodeQL extractor/analyze resources so the 90k+ file repo
      # does not exhaust runner memory during 'Perform CodeQL Analysis'.
      CODEQL_THREADS: '2'
      CODEQL_RAM: '10240'

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free disk space (remove generated content trees)
        # The repo ships a 90k+ file generated tree (public/, out/, reports).
        # CodeQL only analyzes first-party source (see codeql-config paths-ignore),
        # but the checkout alone can exhaust the runner disk before analysis.
        run: |
          rm -rf public out dist build coverage gh-pages automation/reports
          df -h .

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: ${{ matrix.language }}
          # security-extended instead of security-and-quality: the latter
          # produced 30,333 SARIF results, above GitHub's 25,000 upload limit,
          # which failed every 'Perform CodeQL Analysis' step.
          queries: security-extended
          # Repo ships a 90k+ file tree of generated pages/assets; the config
          # narrows analysis to first-party source so the analyze step does not
          # run out of resources.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: "/language:${{ matrix.language }}"

      - name: Summary
        if: always()
        run: |
          echo "## CodeQL Security Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Language:** ${{ matrix.language }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Queries:** security-extended" >> "$GITHUB_STEP_SUMMARY"
