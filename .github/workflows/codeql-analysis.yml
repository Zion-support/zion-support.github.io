name: CodeQL Security Analysis

permissions:
  contents: read
  security-events: write
  actions: read

# 2026-10-04: push/PR triggers removed (full JS CodeQL on this 135k-file tree
# timed out/failed on almost every bot push). Weekly + manual only.
"on":
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60


    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1


      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c10b8064de6f491fea524254123dbe5e09572f13 # v4.35.1
        with:
          category: "/language:${{ matrix.language }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## CodeQL Security Analysis"
            echo ""
            echo "- **Language:** ${{ matrix.language }}"
            echo "- **Status:** Completed"
            echo "- **Queries:** security-and-quality"
          } >> "$GITHUB_STEP_SUMMARY"
