name: Lockfile resync (manual)

permissions:
  contents: write

"on":
  workflow_dispatch:

jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ github.token }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --no-audit --fund=false

      - name: Verify npm ci now passes
        run: npm ci --no-audit --fund=false

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "Lockfile already in sync - nothing to commit"
            exit 0
          fi
          git commit -m "fix(deps): resync package-lock.json with package.json (npm ci EUSAGE fix)"
          git push origin main
