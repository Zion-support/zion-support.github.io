name: First Workflow - Offline Contract

# Review-only fixture validation. Never publishes a Pages artifact.
on:
  pull_request:
    paths:
      - 'scripts/first-workflow-copy.json'
      - 'scripts/first-workflow-navigation.cjs'
      - 'scripts/render-first-workflow.cjs'
      - 'scripts/test-first-workflow.cjs'
      - '.github/workflows/first-workflow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-workflow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read four bounded sources from the exact workflow candidate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const paths = [
              'scripts/first-workflow-copy.json',
              'scripts/first-workflow-navigation.cjs',
              'scripts/render-first-workflow.cjs',
              'scripts/test-first-workflow.cjs'
            ];
            // PR events use GitHub's synthetic merge candidate, not an untested head.
            // Bounded source export avoids unrelated invalid repository gitlinks.
            core.info(`candidate=${context.sha} event=${context.eventName}`);
            fs.mkdirSync('scripts', {recursive: true});
            for (const path of paths) {
              const {data} = await github.rest.repos.getContent({
                ...context.repo, path, ref: context.sha
              });
              if (Array.isArray(data) || data.type !== 'file' ||
                  data.encoding !== 'base64' || data.size > 100000 ||
                  typeof data.content !== 'string') {
                throw new Error(`Invalid bounded source: ${path}`);
              }
              const bytes = Buffer.from(data.content, 'base64');
              const crypto = require('node:crypto');
              const oid = crypto.createHash('sha1')
                .update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
              if (oid !== data.sha) throw new Error(`Git blob mismatch: ${path}`);
              fs.writeFileSync(path, bytes);
              core.info(`${path} blob=${oid}`);
            }
      - name: Syntax and isolated multilingual preservation contracts
        run: |
          node --version
          node --check scripts/first-workflow-navigation.cjs
          node --check scripts/render-first-workflow.cjs
          node --check scripts/test-first-workflow.cjs
          node scripts/test-first-workflow.cjs
