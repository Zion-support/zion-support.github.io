name: ROI Calculator locale and math quality

on:
  pull_request:
    paths:
      - 'public/**/roi-calc/index.html'
      - 'public/roi-calc/index.html'
      - 'public/assets/js/roi-calculator.js'
      - 'public/assets/css/roi-calculator.css'
      - 'scripts/test-roi-calculator.cjs'
      - '.github/workflows/roi-calculator-quality.yml'
  push:
    branches: [main, 'fix/roi-calculator-five-locales-20261115']
    paths:
      - 'public/**/roi-calc/index.html'
      - 'public/roi-calc/index.html'
      - 'public/assets/js/roi-calculator.js'
      - 'public/assets/css/roi-calculator.css'
      - 'scripts/test-roi-calculator.cjs'
      - '.github/workflows/roi-calculator-quality.yml'
permissions:
  contents: read

jobs:
  roi-locales-math:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate ROI math and all 5 localized routes (no deploy)
        run: node --test scripts/test-roi-calculator.cjs
