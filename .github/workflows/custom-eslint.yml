permissions:
  contents: read
name: Autonomous Custom ESLint Rules
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 16 * * 1
  workflow_dispatch: null
jobs:
  custom-eslint:
    name: Custom ESLint Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Test autonomous lint configuration and reporting
      run: node --test tests/ci/test_autonomous_eslint.cjs tests/ci/test_eslint_report_summary.cjs tests/ci/test_custom_eslint_workflow.cjs
    - name: Run Autonomous ESLint
      id: eslint
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      shell: bash
      run: |
        set +e
        npx eslint -c .eslintrc-autonomous.cjs . \
          --ignore-pattern ".next/**" \
          --ignore-pattern "out/**" \
          --ignore-pattern "dist/**" \
          --ignore-pattern "build/**" \
          --ignore-pattern "coverage/**" \
          --ignore-pattern ".hermes/**" \
          --ignore-pattern "automation/reports/**" \
          --max-warnings 0 --format json > /tmp/eslint-report.json
        status=$?
        set -e
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Upload ESLint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eslint-autonomous-report
        path: /tmp/eslint-report.json
        retention-days: 7
    - name: Check for errors
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      shell: bash
      run: |
        if [ "${ESLINT_EXIT_CODE:-}" != "0" ]; then
          echo "::error::ESLint failed or did not return a valid result. See the lint step and report."
          exit 1
        fi
    - name: Report lint failure
      if: failure() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      uses: actions/github-script@v7
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      with:
        script: |
          const fs = require('node:fs');
          const { summarize } = require('./scripts/checks/eslint-report-summary.cjs');
          const code = process.env.ESLINT_EXIT_CODE;
          const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const sections = [];
          if (code === '0') {
            sections.push('ESLint exited successfully. A different workflow step failed.');
          } else {
            let report = '';
            try { report = fs.readFileSync('/tmp/eslint-report.json', 'utf8'); }
            catch {}
            sections.push(summarize(report, code));
          }
          sections.push(`[Workflow run](${run}) · Commit \`${context.sha}\``);
          const body = sections.join('\n\n');
          const { owner, repo } = context.repo;
          if (context.eventName === 'pull_request') {
            await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
          } else {
            const title = '🚨 Custom ESLint Rules Violations on Main';
            const labels = ['eslint-autonomous', 'code-quality'];
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: labels.join(','), state: 'open' });
            if (!open.some(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [...labels, 'autonomous', 'blocker'] });
            }
          }
    - name: Notify Telegram on failure
      if: failure()
      run: "node automation/notify-telegram.js \"\U0001F6A8 Custom ESLint check found\
        \ violations. Fix code hygiene issues. See GitHub issues.\"\n"
    - name: Notify Telegram on success (weekly digest)
      if: success() && github.event_name == 'schedule'
      run: "node automation/notify-telegram.js \"\u2705 Weekly ESLint hygiene scan\
        \ passed \u2014 no violations found.\"\n"
    timeout-minutes: 10
