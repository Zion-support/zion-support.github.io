permissions:
  contents: read
name: Autonomous Custom ESLint Rules
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 16 * * 1
  workflow_dispatch: null
jobs:
  custom-eslint:
    name: Custom ESLint Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run Autonomous ESLint
      id: eslint
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      shell: bash
      run: |
        set +e
        npx eslint . \
          --ignore-pattern ".next/**" \
          --ignore-pattern "out/**" \
          --ignore-pattern "dist/**" \
          --ignore-pattern "build/**" \
          --ignore-pattern "coverage/**" \
          --ignore-pattern ".hermes/**" \
          --ignore-pattern "automation/reports/**" \
          --max-warnings 0 --format json > /tmp/eslint-report.json
        status=$?
        set -e
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Upload ESLint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eslint-autonomous-report
        path: /tmp/eslint-report.json
        retention-days: 7
    - name: Check for errors
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      shell: bash
      run: |
        if [ "${ESLINT_EXIT_CODE:-}" != "0" ]; then
          echo "::error::ESLint failed or did not return a valid result. See the lint step and report."
          exit 1
        fi
    - name: Report lint failure
      if: failure() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
      uses: actions/github-script@v7
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const code = process.env.ESLINT_EXIT_CODE;
          const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const sections = [];
          if (code === '1') {
            try {
              const files = JSON.parse(fs.readFileSync('/tmp/eslint-report.json', 'utf8'));
              if (!Array.isArray(files)) throw new Error('Expected an ESLint file list');
              const details = [];
              let errors = 0;
              let warnings = 0;
              function oneLine(value) {
                return String(value).replace(/[\r\n\t]+/g, ' ').replace(/`/g, "'").replace(/@/g, '@\u200b').slice(0, 180);
              }
              for (const file of files) {
                if (typeof file.filePath !== 'string' || !Array.isArray(file.messages)) {
                  throw new Error('Invalid ESLint file result');
                }
                for (const message of file.messages) {
                  if (message.severity !== 1 && message.severity !== 2) continue;
                  if (message.severity === 2) errors++;
                  else warnings++;
                  if (details.length < 25) {
                    const location = oneLine(path.relative(process.env.GITHUB_WORKSPACE, file.filePath));
                    const rule = oneLine(message.ruleId || (message.fatal ? 'fatal' : 'lint'));
                    details.push(`- \`${location}:${Number(message.line) || 0}:${Number(message.column) || 0}\` ${message.severity === 2 ? 'error' : 'warning'} \`${rule}\` — \`${oneLine(message.message)}\``);
                  }
                }
              }
              if (errors + warnings === 0) throw new Error('No diagnostics for exit 1');
              sections.push(`ESLint reported **${errors} ${errors === 1 ? 'error' : 'errors'}** and **${warnings} ${warnings === 1 ? 'warning' : 'warnings'}**. The workflow allows zero warnings.`);
              sections.push(details.join('\n'));
              if (errors + warnings > details.length) sections.push('The artifact contains the remaining diagnostics.');
            } catch {
              sections.push('ESLint exited with code 1, but its JSON report was unavailable or invalid. See the lint step.');
            }
          } else if (code === '0') {
            sections.push('ESLint exited successfully. A different workflow step failed.');
          } else {
            sections.push(code ? `ESLint could not complete (exit ${code}). See the lint step for the configuration or execution error.` : 'The lint step did not return an exit code. Check setup and execution logs.');
          }
          sections.push(`[Workflow run](${run}) · Commit \`${context.sha}\``);
          const body = sections.join('\n\n');
          const { owner, repo } = context.repo;
          if (context.eventName === 'pull_request') {
            await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
          } else {
            const title = '🚨 Custom ESLint Rules Violations on Main';
            const labels = ['eslint-autonomous', 'code-quality'];
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, labels: labels.join(','), state: 'open' });
            if (!open.some(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [...labels, 'autonomous', 'blocker'] });
            }
          }
    - name: Notify Telegram on failure
      if: failure()
      run: "node automation/notify-telegram.js \"\U0001F6A8 Custom ESLint check found\
        \ violations. Fix code hygiene issues. See GitHub issues.\"\n"
    - name: Notify Telegram on success (weekly digest)
      if: success() && github.event_name == 'schedule'
      run: "node automation/notify-telegram.js \"\u2705 Weekly ESLint hygiene scan\
        \ passed \u2014 no violations found.\"\n"
    timeout-minutes: 10
