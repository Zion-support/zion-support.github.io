permissions:
  contents: read
name: Autonomous Custom ESLint Rules
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 16 * * 1
  workflow_dispatch: null
concurrency:
  group: autonomous-custom-eslint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  custom-eslint:
    name: Custom ESLint Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6.0.2
      with:
        # ESLint inspects the complete current tree and does not compare commits.
        fetch-depth: 1
        persist-credentials: false
    - name: Verify checkout and lint-exit regression cases
      run: python3 tests/ci/test_workflow_checkout_scope.py
    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '22'
        cache: npm
    - name: Verify ESLint report script fixtures
      run: node tests/ci/test_eslint_report_scripts.cjs
    - name: Install dependencies
      run: npm ci
    - name: Test autonomous lint configuration and reporting
      run: node --test tests/ci/test_autonomous_eslint.cjs tests/ci/test_eslint_report_summary.cjs tests/ci/test_custom_eslint_workflow.cjs
    - name: Run Autonomous ESLint
      id: eslint
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        eslint_status=0
        npx eslint -c .eslintrc-autonomous.cjs . \
          --ignore-pattern ".next/**" \
          --ignore-pattern "out/**" \
          --ignore-pattern "dist/**" \
          --ignore-pattern "build/**" \
          --ignore-pattern "coverage/**" \
          --ignore-pattern ".hermes/**" \
          --ignore-pattern "automation/reports/**" \
          --max-warnings 0 \
          --format json > /tmp/eslint-report.json || eslint_status=$?
        echo "exit_code=$eslint_status" >> "$GITHUB_OUTPUT"
        exit "$eslint_status"
    - name: Upload ESLint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eslint-autonomous-report
        path: /tmp/eslint-report.json
        retention-days: 7
    - name: Check for errors
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      run: |
        if [ "${ESLINT_EXIT_CODE:-}" != "0" ]; then
          echo "ESLint failed or did not report a successful exit code"
          exit 1
        fi
    - name: Parse and comment on PR
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      with:
        script: |
          const fs = require('fs');
          const { summarize } = require('./scripts/checks/eslint-report-summary.cjs');
          let report = '';
          try { report = fs.readFileSync('/tmp/eslint-report.json', 'utf8'); } catch {}
          const summary = summarize(report, process.env.ESLINT_EXIT_CODE);
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = summary + '\n\nWorkflow: ' + runUrl;
          await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
    - name: Open GitHub issue on main branch violations
      if: github.event_name == 'push' && failure() && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      with:
        script: |
          const fs = require('fs');
          const { summarize } = require('./scripts/checks/eslint-report-summary.cjs');
          let report = '';
          try { report = fs.readFileSync('/tmp/eslint-report.json', 'utf8'); } catch {}
          const summary = summarize(report, process.env.ESLINT_EXIT_CODE);
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = summary + '\n\nWorkflow: ' + runUrl;
          const title = '🚨 Custom ESLint Rules Violations on Main';
          const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, labels: ['eslint-autonomous', 'code-quality'], state: 'open' });
          if (!existing.data.some(item => item.title === title)) {
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['eslint-autonomous', 'autonomous', 'code-quality', 'blocker'] });
          }
    - name: Notify Telegram on failure
      if: failure()
      run: "node automation/notify-telegram.js \"\U0001F6A8 Custom ESLint check found\
        \ violations. Fix code hygiene issues. See GitHub issues.\"\n"
    - name: Notify Telegram on success (weekly digest)
      if: success() && github.event_name == 'schedule'
      run: "node automation/notify-telegram.js \"\u2705 Weekly ESLint hygiene scan\
        \ passed \u2014 no violations found.\"\n"
    # GitHub check 124518079601 hit the previous 10-minute job limit.
    timeout-minutes: 20
