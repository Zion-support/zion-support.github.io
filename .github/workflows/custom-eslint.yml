permissions:
  contents: read
name: Autonomous Custom ESLint Rules
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 16 * * 1
  workflow_dispatch: null
jobs:
  custom-eslint:
    name: Custom ESLint Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checkout public candidate without stored credentials
      env:
        CANDIDATE_SHA: ${{ github.sha }}
        GIT_TERMINAL_PROMPT: '0'
      run: |
        set -euo pipefail
        if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Invalid checkout candidate SHA."
          exit 1
        fi
        if [[ -n "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
          echo "::error::Checkout requires an empty workspace; existing files were not changed."
          exit 1
        fi
        git init --quiet
        git remote add origin https://github.com/Zion-support/zion-support.github.io.git
        git -c credential.helper= fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
        git checkout --detach FETCH_HEAD
        if [[ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]]; then
          echo "::error::Checked out revision differs from publication candidate."
          exit 1
        fi
    - name: Setup Node.js
      uses: actions/setup-node@v6.3.0
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Test autonomous lint configuration and reporting
      run: node --test tests/ci/test_autonomous_eslint.cjs tests/ci/test_eslint_report_summary.cjs tests/ci/test_apps_directory.cjs tests/ci/test_communications_planner.cjs tests/ci/test_guide_restorer.cjs tests/ci/test_scoped_page_parser.cjs tests/ci/test_search_jsonld.cjs
    - name: Run Autonomous ESLint
      id: eslint
      continue-on-error: true
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        set +e
        npx eslint -c .eslintrc-autonomous.cjs . \
          --ignore-pattern ".next/**" \
          --ignore-pattern "out/**" \
          --ignore-pattern "dist/**" \
          --ignore-pattern "build/**" \
          --ignore-pattern "coverage/**" \
          --ignore-pattern ".hermes/**" \
          --ignore-pattern "automation/reports/**" \
          --max-warnings 0 --format json > /tmp/eslint-report.json
        status=$?
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit "$status"
    - name: Upload ESLint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: eslint-autonomous-report
        path: /tmp/eslint-report.json
        retention-days: 7
    - name: Check for errors
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
      run: |
        if [ "$ESLINT_EXIT_CODE" != "0" ]; then
          echo "::error::ESLint failed or did not return a valid result. See the lint step and report."
          exit 1
        fi
    - name: Parse and comment on PR
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: 'const fs = require(''fs'');

          const { summarize } = require(''./scripts/checks/eslint-report-summary.cjs'');

          let report = '''';

          try { report = fs.readFileSync(''/tmp/eslint-report.json'', ''utf8''); }
          catch {}

          const summary = summarize(report, process.env.ESLINT_EXIT_CODE);

          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          const body = summary + ''\n\nWorkflow: '' + runUrl;

          await github.rest.issues.createComment({ owner: context.repo.owner, repo:
          context.repo.repo, issue_number: context.issue.number, body });

          '
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
    - name: Open GitHub issue on main branch violations
      if: github.event_name == 'push' && failure() && github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      with:
        script: "const fs = require('fs');\nconst { summarize } = require('./scripts/checks/eslint-report-summary.cjs');\n\
          let report = '';\ntry { report = fs.readFileSync('/tmp/eslint-report.json',\
          \ 'utf8'); } catch {}\nconst summary = summarize(report, process.env.ESLINT_EXIT_CODE);\n\
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;\n\
          const body = summary + '\\n\\nWorkflow: ' + runUrl;\nconst title = '\U0001F6A8\
          \ Custom ESLint Rules Violations on Main';\nconst existing = await github.rest.issues.listForRepo({\
          \ owner: context.repo.owner, repo: context.repo.repo, labels: ['eslint-autonomous',\
          \ 'code-quality'], state: 'open' });\nif (!existing.data.some(item => item.title\
          \ === title)) {\n  await github.rest.issues.create({ owner: context.repo.owner,\
          \ repo: context.repo.repo, title, body, labels: ['eslint-autonomous', 'autonomous',\
          \ 'code-quality', 'blocker'] });\n}\n"
      env:
        ESLINT_EXIT_CODE: ${{ steps.eslint.outputs.exit_code }}
    - name: Notify Telegram on failure
      if: failure()
      run: "node automation/notify-telegram.js \"\U0001F6A8 Custom ESLint check found\
        \ violations. Fix code hygiene issues. See GitHub issues.\"\n"
    - name: Notify Telegram on success (weekly digest)
      if: success() && github.event_name == 'schedule'
      run: "node automation/notify-telegram.js \"\u2705 Weekly ESLint hygiene scan\
        \ passed \u2014 no violations found.\"\n"
    timeout-minutes: 10
