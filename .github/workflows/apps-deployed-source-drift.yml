name: Apps deployed-source drift guard

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/apps-deployed-source-drift.yml'
  workflow_run:
    # Both publishers can update the same live site. Audit every successful publish.
    workflows:
      - Continuous Pages Deploy
      - Simple Static Deploy
    types: [completed]
  schedule:
    - cron: '7 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  # An ignored publisher completion must not cancel a pending production comparison.
  group: apps-deployed-source-drift-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'eligible' }}
  cancel-in-progress: true

jobs:
  compare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve release SHA from an executed Pages deployment
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // A successful run does not prove that its deployment step ran.
            // Scheduled/manual audits must not silently substitute current main.
            const owner=context.repo.owner, repo=context.repo.repo;
            const publishers=[
              {name:'Continuous Pages Deploy',file:'gh-pages.yml',step:'Deploy to GitHub Pages'},
              {name:'Simple Static Deploy',file:'static-deploy.yml',step:'Run actions/deploy-pages@v4'}
            ];
            async function verify(run,publisher) {
              if(run.status!=='completed' || run.conclusion!=='success' || run.head_branch!=='main') return null;
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{
                owner,repo,run_id:run.id,filter:'latest',per_page:100
              });
              const deployJobs=jobs.filter(job=>job.name==='deploy');
              if(deployJobs.length!==1) throw new Error('Missing/ambiguous deploy job evidence: '+run.id);
              const job=deployJobs[0];
              if(job.status==='completed' && job.conclusion==='skipped') return null;
              if(job.status!=='completed' || job.conclusion!=='success')
                throw new Error('Deploy job did not succeed: '+run.id);
              if(!Array.isArray(job.steps)) throw new Error('Missing deploy steps: '+run.id);
              const steps=job.steps.filter(step=>step.name===publisher.step);
              if(steps.length!==1) throw new Error('Missing/ambiguous deploy step: '+run.id);
              const step=steps[0];
              if(step.status==='completed' && step.conclusion==='skipped') return null;
              if(step.status!=='completed' || step.conclusion!=='success')
                throw new Error('Deployment step not executed successfully: '+run.id);
              if(!/^[0-9a-f]{40}$/.test(run.head_sha||'') || job.head_sha!==run.head_sha)
                throw new Error('Unverified deployed SHA: '+run.id);
              if(!Number.isFinite(Date.parse(step.completed_at)))
                throw new Error('Missing deployment completion timestamp: '+run.id);
              return {sha:run.head_sha,run_id:run.id,completed_at:step.completed_at};
            }
            let candidates=[];
            if(context.eventName==='workflow_run') {
              const run=context.payload.workflow_run;
              const publisher=publishers.find(p=>p.name===run?.name);
              if(!publisher) throw new Error('Unknown workflow_run publisher');
              candidates=[{run,publisher}];
            }
            // Always reconcile against the latest executed publisher, even if a
            // delayed workflow_run event was triggered by an older deployment.
            for(const publisher of publishers){
              const {data}=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:publisher.file,branch:'main',per_page:30
              });
              candidates.push(...(data.workflow_runs||[])
                .filter(run=>run.status==='completed' && run.conclusion==='success')
                .map(run=>({run,publisher})));
            }
            const seen=new Set();
            candidates=candidates.filter(item=>{
              if(seen.has(item.run.id)) return false;
              seen.add(item.run.id);
              return true;
            });
            candidates.sort((a,b)=>Date.parse(b.run.updated_at)-Date.parse(a.run.updated_at));
            const verified=[];
            for(const item of candidates.slice(0,20)){
              const evidence=await verify(item.run,item.publisher);
              if(evidence) verified.push(evidence);
            }
            verified.sort((a,b)=>Date.parse(b.completed_at)-Date.parse(a.completed_at));
            if(!verified.length) throw new Error('No verified executed Pages deployment');
            core.setOutput('sha',verified[0].sha);
            core.setOutput('deploy_run_id',String(verified[0].run_id));
            core.setOutput('deploy_completed_at',verified[0].completed_at);

      - name: Checkout release source
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Rebuild exact Pages artifact used by production deploy
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          # Both production publishers run exactly this recipe (no extra renderers).
          bash scripts/prepare-pages-out.sh

      - name: Record failed rebuild as validator error
        if: ${{ failure() && (steps.release.outcome == 'failure' || steps.checkout.outcome == 'failure' || steps.rebuild.outcome == 'failure') }}
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.deploy_run_id }}
          RELEASE_COMPLETED_AT: ${{ steps.release.outputs.deploy_completed_at }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
        run: |
          mkdir -p automation/reports
          python3 - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          import json,os
          report={
            'schema':'zion.apps.deployed-source-drift.v1',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'classification':'VALIDATOR_ERROR',
            'reason':'Release selection, checkout, or artifact rebuild failed; comparison not executed',
            'release_sha':os.getenv('RELEASE_SHA',''),
            'deployment_run_id':os.getenv('RELEASE_RUN_ID',''),
            'deployment_completed_at':os.getenv('RELEASE_COMPLETED_AT',''),
            'stage_outcomes':{k:os.getenv(k+'_OUTCOME','') for k in ('RELEASE','CHECKOUT','REBUILD')},
            'checks':[],
            'failure_count':None,
          }
          Path('automation/reports/apps-deployed-source-drift.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Compare production bodies with deployed artifact
        id: drift
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.deploy_run_id }}
          RELEASE_COMPLETED_AT: ${{ steps.release.outputs.deploy_completed_at }}
        run: |
          set -euo pipefail
          mkdir -p automation/reports
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys,time,urllib.request
          from urllib.error import HTTPError
          from datetime import datetime,timezone

          def read_complete_response(resp, max_bytes=52_428_800):
            # Read to EOF; never hash a silently truncated prefix.
            chunks=[]
            received=0
            declared=resp.headers.get('Content-Length')
            expected=int(declared) if declared is not None else None
            if expected is not None and (expected < 0 or expected > max_bytes):
              raise ValueError('response_size_limit_or_invalid_length')
            while True:
              chunk=resp.read(min(65_536, max_bytes-received+1))
              if not chunk:
                break
              received+=len(chunk)
              if received > max_bytes:
                raise ValueError('response_size_limit_exceeded')
              chunks.append(chunk)
            if expected is not None and received != expected:
              raise ValueError('response_incomplete_content_length')
            return b''.join(chunks)

          base='https://ziontechgroup.com'
          pairs={
            '/':'out/index.html',
            '/apps/':'out/apps/index.html',
            '/pt/apps/':'out/pt/apps/index.html',
            '/es/apps/':'out/es/apps/index.html',
            '/fr/apps/':'out/fr/apps/index.html',
            '/de/apps/':'out/de/apps/index.html',
            '/discovery/':'out/discovery/index.html',
            '/pt/discovery/':'out/pt/discovery/index.html',
            '/es/discovery/':'out/es/discovery/index.html',
            '/fr/discovery/':'out/fr/discovery/index.html',
            '/de/discovery/':'out/de/discovery/index.html',
            '/apps/operations-reliability-ai-2026.html':'out/apps/operations-reliability-ai-2026.html',
            '/apps/operations-reliability-ai-2026-pt.html':'out/apps/operations-reliability-ai-2026-pt.html',
            '/apps/operations-reliability-ai-2026-es.html':'out/apps/operations-reliability-ai-2026-es.html',
            '/apps/operations-reliability-ai-2026-fr.html':'out/apps/operations-reliability-ai-2026-fr.html',
            '/apps/operations-reliability-ai-2026-de.html':'out/apps/operations-reliability-ai-2026-de.html',
            '/sitemap.xml':'out/sitemap.xml',
            '/sitemap-0.xml':'out/sitemap-0.xml',
            '/apps/apps-sitemap.xml':'out/apps/apps-sitemap.xml',
            '/robots.txt':'out/robots.txt',
          }
          headers={'User-Agent':'Zion-Apps-Deployed-Source-Drift/1.0','Cache-Control':'no-cache'}
          rows=[]
          failures=[]
          for route,path in pairs.items():
            p=Path(path)
            if not p.is_file():
              row={'route':route,'source_path':path,'reason':'SOURCE_MISSING','match':False}
              rows.append(row)
              failures.append(row)
              continue
            source=p.read_bytes()
            source_sha=hashlib.sha256(source).hexdigest()
            live=None
            error=None
            status=0
            for attempt in range(3):
              try:
                req=urllib.request.Request(base+route+'?zion_drift='+os.environ.get('GITHUB_RUN_ID','manual')+f'-{attempt}',headers=headers)
                with urllib.request.urlopen(req,timeout=20) as resp:
                  status=resp.status
                  live=read_complete_response(resp)
                error=None
                if status==200: break
              except HTTPError as exc:
                live=None
                status=exc.code
                error=str(exc)
                if status==404: break
                time.sleep(2)
              except Exception as exc:
                live=None
                status=0
                error=str(exc)
                time.sleep(2)
            live_sha=hashlib.sha256(live).hexdigest() if live is not None else None
            if route=='/':
              # The root homepage can be transformed by the production edge while
              # preserving the approved content contract. Avoid a false positive
              # on byte drift, but still require the semantic release markers.
              body=(live or b'').decode('utf-8','replace')
              markers=['Zion Tech Group','Apps','Discovery']
              missing=[m for m in markers if m not in body]
              match=status==200 and not missing
              mode='semantic'
            else:
              missing=[]
              match=status==200 and live_sha==source_sha
              mode='exact'
            reason=(None if match else
              'HTTP_UNAVAILABLE' if status!=200 else
              'CONTENT_MISMATCH' if missing else 'BYTE_MISMATCH')
            row={'route':route,'source_path':path,'http_status':status,'source_sha256':source_sha,'live_sha256':live_sha,'match':match,'mode':mode,'missing_markers':missing,'error':error,'reason':reason}
            rows.append(row)
            if not match:
              failures.append(row)
              print(f'::error::{route} drift/status mismatch mode={mode} source={source_sha} live={live_sha} status={status} missing={missing} error={error}')
            elif mode=='semantic':
              print(f'OK {route} semantic contract HTTP 200 markers={len(markers)}')
            else:
              print(f'OK {route} exact body match {source_sha[:12]}')

          report={
            'schema':'zion.apps.deployed-source-drift.v1',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'release_sha':os.environ.get('RELEASE_SHA',''),
            'deployment_run_id':os.environ.get('RELEASE_RUN_ID',''),
            'deployment_completed_at':os.environ.get('RELEASE_COMPLETED_AT',''),
            'classification':'PASS' if not failures else 'COMPARISON_FAILED',
            'expected_route_count':len(pairs),
            'checks':rows,
            'failure_count':len(failures),
          }
          out=Path('automation/reports/apps-deployed-source-drift.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if failures:
            Path('automation/reports/apps-deployed-source-drift-failures.txt').write_text(
              '\n'.join(f"{x.get('route')} status={x.get('http_status')} reason={x.get('reason','UNKNOWN')}" for x in failures)+'\n',
              encoding='utf-8'
            )
            sys.exit(1)
          PY

      - name: Classify unexpected comparison failure
        # A failed Python process without a complete mismatch report is a
        # validator error, not evidence of source-to-production drift.
        if: ${{ failure() && steps.drift.outcome == 'failure' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.deploy_run_id }}
          RELEASE_COMPLETED_AT: ${{ steps.release.outputs.deploy_completed_at }}
        run: |
          python3 - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          import json,os,sys
          out=Path('automation/reports/apps-deployed-source-drift.json')
          try:
            report=json.loads(out.read_text(encoding='utf-8'))
            valid=(report.get('classification')=='COMPARISON_FAILED'
                   and isinstance(report.get('checks'),list)
                   and isinstance(report.get('expected_route_count'),int)
                   and report['expected_route_count']>0
                   and len(report['checks'])==report['expected_route_count']
                   and isinstance(report.get('failure_count'),int)
                   and report['failure_count']>0
                   and report.get('release_sha')==os.getenv('RELEASE_SHA','')
                   and report.get('deployment_run_id')==os.getenv('RELEASE_RUN_ID',''))
            if valid:
              print('Completed comparison mismatch evidence exists; retain COMPARISON_FAILED')
              sys.exit(0)
          except (OSError,ValueError,TypeError,AttributeError):
            pass
          out.parent.mkdir(parents=True,exist_ok=True)
          report={
            'schema':'zion.apps.deployed-source-drift.v1',
            'generated_at_utc':datetime.now(timezone.utc).isoformat(),
            'classification':'VALIDATOR_ERROR',
            'reason':'Comparison process failed without a complete route-level mismatch report',
            'release_sha':os.getenv('RELEASE_SHA',''),
            'deployment_run_id':os.getenv('RELEASE_RUN_ID',''),
            'deployment_completed_at':os.getenv('RELEASE_COMPLETED_AT',''),
            'checks':[],
            'failure_count':None,
          }
          out.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print('::error::Comparison validator failed; source drift NOT established')
          sys.exit(1)
          PY

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apps-deployed-source-drift-${{ github.run_id }}
          path: |
            automation/reports/apps-deployed-source-drift.json
            automation/reports/apps-deployed-source-drift-failures.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update deduped drift issue
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title='Apps deployed/source verification failed';
            const legacyTitle='Apps deployed/source drift detected';
            const marker='<!-- apps-deployed-source-drift -->';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title || i.title===legacyTitle || (i.body||'').includes(marker));
            const body=marker+'\nDeployed/source verification failed. A validator/rebuild error does NOT prove production drift. Inspect artifact classification and compare-step outcome before changes or rollback.\n\nRun: '+context.serverUrl+'/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId;
            if(existing){
              if(existing.title!==title) await github.rest.issues.update({...context.repo,issue_number:existing.number,title});
              await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body});
            } else {
              await github.rest.issues.create({...context.repo,title,body});
            }

      - name: Close prior drift issue on recovery
        if: success() && steps.drift.outcome == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title='Apps deployed/source verification failed';
            const legacyTitle='Apps deployed/source drift detected';
            const {data:issues}=await github.rest.issues.listForRepo({...context.repo,state:'open',per_page:100});
            for(const issue of issues.filter(i=>i.title===title || i.title===legacyTitle || (i.body||'').includes('<!-- apps-deployed-source-drift -->'))){
              await github.rest.issues.createComment({...context.repo,issue_number:issue.number,body:'Recovered: deployed/source drift guard is green on run '+context.runId+'.'});
              await github.rest.issues.update({...context.repo,issue_number:issue.number,state:'closed'});
            }
