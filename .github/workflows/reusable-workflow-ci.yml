name: Reusable workflow CI (validate + optional contracts)

permissions:
  contents: read

"on":
  workflow_call:
    inputs:
      run_contracts:
        description: 'Run workflow contracts when the npm script exists'
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Static Pages site — skip npm ci
        run: |
          echo "zion-support.github.io serves public/ as static HTML."
          echo "Skipping npm ci: package.json still lists Next.js scripts, but"
          echo "workflows:contracts:node is not defined and .nvmrc is absent."
          echo "run_contracts=${{ inputs.run_contracts }}"
          python3 -c "
from pathlib import Path
files = list(Path('.github/workflows').glob('*.yml'))
assert files, 'no workflow files'
for p in files:
    text = p.read_text()
    assert text.strip(), p
    assert 'on:' in text or '\"on\":' in text, p
print('workflow files present:', len(files))
"
