name: Apps i18n release contract

"on":
  pull_request:
    paths:
      - 'public/apps/**'
      - 'public/pt/apps/**'
      - 'public/es/apps/**'
      - 'public/fr/apps/**'
      - 'public/de/apps/**'
      - 'public/discovery/**'
      - 'public/pt/discovery/**'
      - 'public/es/discovery/**'
      - 'public/fr/discovery/**'
      - 'public/de/discovery/**'
      - 'apps/operations-reliability-ai-2026*.html'
      - 'public/sitemap.xml'
      - 'public/apps/apps-sitemap.xml'
      - 'public/robots.txt'
      - '.github/workflows/apps-i18n-release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'public/apps/**'
      - 'public/pt/apps/**'
      - 'public/es/apps/**'
      - 'public/fr/apps/**'
      - 'public/de/apps/**'
      - 'public/discovery/**'
      - 'public/pt/discovery/**'
      - 'public/es/discovery/**'
      - 'public/fr/discovery/**'
      - 'public/de/discovery/**'
      - 'apps/operations-reliability-ai-2026*.html'
      - 'public/sitemap.xml'
      - 'public/apps/apps-sitemap.xml'
      - 'public/robots.txt'
      - '.github/workflows/apps-i18n-release-contract.yml'
  schedule:
    - cron: '23 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-i18n-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify localized Apps contract and mirror parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root=Path('.')
          errors=[]

          locale_hubs={
            'en': Path('public/apps/index.html'),
            'pt-BR': Path('public/pt/apps/index.html'),
            'es': Path('public/es/apps/index.html'),
            'fr': Path('public/fr/apps/index.html'),
            'de': Path('public/de/apps/index.html'),
          }
          expected_hreflang={
            'en':'https://ziontechgroup.com/apps/',
            'pt-BR':'https://ziontechgroup.com/pt/apps/',
            'es':'https://ziontechgroup.com/es/apps/',
            'fr':'https://ziontechgroup.com/fr/apps/',
            'de':'https://ziontechgroup.com/de/apps/',
          }

          for locale,path in locale_hubs.items():
            if not path.is_file():
              errors.append(f'missing localized Apps hub: {path}')
              continue
            text=path.read_text(encoding='utf-8')
            for lang,url in expected_hreflang.items():
              token=f'hreflang="{lang}" href="{url}"'
              if token not in text:
                errors.append(f'{path}: missing reciprocal {token}')
            if 'hreflang="x-default" href="https://ziontechgroup.com/apps/"' not in text:
              errors.append(f'{path}: missing x-default Apps hreflang')
            if 'discovery' not in text.lower():
              errors.append(f'{path}: missing Discovery navigation')

          discovery_pages={
            'en':('public/discovery/index.html','https://ziontechgroup.com/discovery/'),
            'pt-BR':('public/pt/discovery/index.html','https://ziontechgroup.com/pt/discovery/'),
            'es':('public/es/discovery/index.html','https://ziontechgroup.com/es/discovery/'),
            'fr':('public/fr/discovery/index.html','https://ziontechgroup.com/fr/discovery/'),
            'de':('public/de/discovery/index.html','https://ziontechgroup.com/de/discovery/'),
          }
          expected_discovery={
            'en':'https://ziontechgroup.com/discovery/',
            'pt-BR':'https://ziontechgroup.com/pt/discovery/',
            'es':'https://ziontechgroup.com/es/discovery/',
            'fr':'https://ziontechgroup.com/fr/discovery/',
            'de':'https://ziontechgroup.com/de/discovery/',
          }
          for locale,(path_s,canonical) in discovery_pages.items():
            path=Path(path_s)
            if not path.is_file():
              errors.append(f'missing localized Discovery page: {path}')
              continue
            text=path.read_text(encoding='utf-8')
            if f'<link rel="canonical" href="{canonical}"' not in text:
              errors.append(f'{path}: canonical mismatch, expected {canonical}')
            for lang,url in expected_discovery.items():
              token=f'hreflang="{lang}" href="{url}"'
              if token not in text:
                errors.append(f'{path}: missing reciprocal Discovery {token}')
            if 'hreflang="x-default" href="https://ziontechgroup.com/discovery/"' not in text:
              errors.append(f'{path}: missing Discovery x-default hreflang')

          variants=['','-pt','-es','-fr','-de']
          for suffix in variants:
            src=Path(f'apps/operations-reliability-ai-2026{suffix}.html')
            pub=Path(f'public/apps/operations-reliability-ai-2026{suffix}.html')
            if not src.is_file() or not pub.is_file():
              errors.append(f'missing Operations mirror pair: {src} / {pub}')
              continue
            if src.read_bytes()!=pub.read_bytes():
              errors.append(f'Operations source/public mirror drift: {src} != {pub}')

          sitemap=Path('public/apps/apps-sitemap.xml')
          if not sitemap.is_file():
            errors.append('missing public/apps/apps-sitemap.xml')
          else:
            text=sitemap.read_text(encoding='utf-8')
            required=[
              '/apps/','/pt/apps/','/es/apps/','/fr/apps/','/de/apps/',
              '/discovery/','/pt/discovery/','/es/discovery/','/fr/discovery/','/de/discovery/',
              '/apps/operations-reliability-ai-2026.html',
              '/apps/operations-reliability-ai-2026-pt.html',
              '/apps/operations-reliability-ai-2026-es.html',
              '/apps/operations-reliability-ai-2026-fr.html',
              '/apps/operations-reliability-ai-2026-de.html',
              '/zion-app-network/app-network-operations-evidence-checklist-2026.html',
            ]
            for route in required:
              if f'https://ziontechgroup.com{route}' not in text:
                errors.append(f'apps sitemap missing {route}')

          # The canonical sitemap may be a valid URL set (growth generator)
          # or a sitemap index (sharded publisher). Both are standards-compliant.
          # robots.txt separately advertises the Apps sitemap in either case.
          index=Path('public/sitemap.xml')
          if not index.is_file() or index.stat().st_size < 100:
            errors.append('public/sitemap.xml missing or unexpectedly empty')
          else:
            import xml.etree.ElementTree as ET
            ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
            try:
              root_node=ET.parse(index).getroot()
              if root_node.tag==ns+'sitemapindex':
                # The generator emits numbered shards above 50k URLs.
                # Apps sitemap is separately advertised by robots.txt.
                from urllib.parse import urlsplit
                children=[str(el.text or '').strip() for el in root_node.findall(ns+'sitemap/'+ns+'loc')]
                if not children:
                  errors.append('sitemap index contains no child sitemaps')
                seen=set()
                found_home=False
                for child in children:
                  uri=urlsplit(child)
                  name=uri.path.removeprefix('/')
                  if (uri.scheme!='https' or uri.netloc!='ziontechgroup.com' or
                      uri.query or uri.fragment or not name.startswith('sitemap-') or
                      not name.endswith('.xml') or not name[8:-4].isdigit()):
                    errors.append(f'invalid sitemap child URL {child}')
                    continue
                  if child in seen:
                    errors.append(f'duplicate sitemap child {child}')
                    continue
                  seen.add(child)
                  file=Path('public')/name
                  if not file.is_file() or file.stat().st_size>50_000_000:
                    errors.append(f'missing or oversized sitemap child {name}')
                    continue
                  try:
                    child_root=ET.parse(file).getroot()
                    if child_root.tag!=ns+'urlset':
                      errors.append(f'sitemap child is not URL set: {name}')
                      continue
                    locs=[str(e.text or '').strip() for e in child_root.findall(ns+'url/'+ns+'loc')]
                    if not locs or len(locs)>50_000:
                      errors.append(f'sitemap child has invalid URL count: {name}')
                    if 'https://ziontechgroup.com/' in locs:
                      found_home=True
                  except ET.ParseError as exc:
                    errors.append(f'invalid child sitemap XML {name}: {exc}')
                if not found_home:
                  errors.append('indexed sitemaps missing canonical homepage')
              elif root_node.tag==ns+'urlset':
                urls=[str(el.text or '').strip() for el in root_node.findall(ns+'url/'+ns+'loc')]
                if 'https://ziontechgroup.com/' not in urls:
                  errors.append('sitemap URL set missing canonical homepage')
                if not urls:
                  errors.append('sitemap URL set contains no URLs')
                if len(urls)>50000 or index.stat().st_size>50_000_000:
                  errors.append('sitemap URL set exceeds 50k URLs or 50MB; shard before release')
              else:
                errors.append(f'unsupported sitemap XML root: {root_node.tag}')
            except ET.ParseError as exc:
              errors.append(f'invalid sitemap XML: {exc}')

          robots=Path('public/robots.txt')
          if not robots.is_file():
            errors.append('public/robots.txt missing')
          else:
            text=robots.read_text(encoding='utf-8')
            for child in ['Sitemap: https://ziontechgroup.com/sitemap.xml','Sitemap: https://ziontechgroup.com/apps/apps-sitemap.xml']:
              if child not in text:
                errors.append(f'robots.txt missing {child}')

          if errors:
            for e in errors:
              print(f'::error::{e}')
            sys.exit(1)
          print('Apps i18n release contract: PASS')
          PY
