name: Apps i18n release contract

"on":
  pull_request:
    paths:
      - 'public/apps/**'
      - 'public/pt/apps/**'
      - 'public/es/apps/**'
      - 'public/fr/apps/**'
      - 'public/de/apps/**'
      - 'public/discovery/**'
      - 'public/en/discovery/**'
      - 'public/pt/discovery/**'
      - 'public/es/discovery/**'
      - 'public/fr/discovery/**'
      - 'public/de/discovery/**'
      - 'apps/operations-reliability-ai-2026*.html'
      - 'public/sitemap.xml'
      - 'public/apps/apps-sitemap.xml'
      - 'public/robots.txt'
      - '.github/workflows/apps-i18n-release-contract.yml'
  push:
    branches: [main]
    paths:
      - 'public/apps/**'
      - 'public/pt/apps/**'
      - 'public/es/apps/**'
      - 'public/fr/apps/**'
      - 'public/de/apps/**'
      - 'public/discovery/**'
      - 'public/en/discovery/**'
      - 'public/pt/discovery/**'
      - 'public/es/discovery/**'
      - 'public/fr/discovery/**'
      - 'public/de/discovery/**'
      - 'apps/operations-reliability-ai-2026*.html'
      - 'public/sitemap.xml'
      - 'public/apps/apps-sitemap.xml'
      - 'public/robots.txt'
      - '.github/workflows/apps-i18n-release-contract.yml'
  schedule:
    - cron: '23 10 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-i18n-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify localized Apps contract and mirror parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          root=Path('.')
          errors=[]

          class HeadLinks(HTMLParser):
            def __init__(self):
              super().__init__()
              self.languages=[]
              self.canonicals=[]
              self.alternates=[]
            def handle_starttag(self,tag,attrs):
              d={k.lower():v for k,v in attrs}
              if tag.lower()=='html':
                self.languages.append(d.get('lang'))
              if tag.lower()!='link':
                return
              rel=(d.get('rel') or '').lower()
              href=d.get('href')
              if not href:
                return
              if rel=='canonical':
                self.canonicals.append(href)
              elif rel=='alternate' and d.get('hreflang'):
                self.alternates.append((d['hreflang'],href))

          def validate_locale(path,locale,canonical,expected):
            text=path.read_text(encoding='utf-8')
            parser=HeadLinks(); parser.feed(text)
            if parser.languages != [locale]:
              errors.append(f'{path}: html lang={parser.languages!r}, expected exactly [{locale!r}]')
            if parser.canonicals != [canonical]:
              errors.append(f'{path}: canonical={parser.canonicals!r}, expected exactly [{canonical!r}]')
            alternates=sorted([*expected.items(),('x-default',expected['en'])])
            if sorted(parser.alternates) != alternates:
              errors.append(f'{path}: hreflang={parser.alternates!r}, expected exactly {alternates!r}')
            return text

          locale_hubs={
            'en': Path('public/apps/index.html'),
            'pt-BR': Path('public/pt/apps/index.html'),
            'es': Path('public/es/apps/index.html'),
            'fr': Path('public/fr/apps/index.html'),
            'de': Path('public/de/apps/index.html'),
          }
          expected_hreflang={
            'en':'https://ziontechgroup.com/apps/',
            'pt-BR':'https://ziontechgroup.com/pt/apps/',
            'es':'https://ziontechgroup.com/es/apps/',
            'fr':'https://ziontechgroup.com/fr/apps/',
            'de':'https://ziontechgroup.com/de/apps/',
          }

          for locale,path in locale_hubs.items():
            if not path.is_file():
              errors.append(f'missing localized Apps hub: {path}')
              continue
            text=validate_locale(path,locale,expected_hreflang[locale],expected_hreflang)
            if 'discovery' not in text.lower():
              errors.append(f'{path}: missing Discovery navigation')

          discovery_pages={
            'en':('public/en/discovery/index.html','https://ziontechgroup.com/en/discovery/'),
            'pt-BR':('public/discovery/index.html','https://ziontechgroup.com/discovery/'),
            'es':('public/es/discovery/index.html','https://ziontechgroup.com/es/discovery/'),
            'fr':('public/fr/discovery/index.html','https://ziontechgroup.com/fr/discovery/'),
            'de':('public/de/discovery/index.html','https://ziontechgroup.com/de/discovery/'),
          }
          expected_discovery={
            'en':'https://ziontechgroup.com/en/discovery/',
            'pt-BR':'https://ziontechgroup.com/discovery/',
            'es':'https://ziontechgroup.com/es/discovery/',
            'fr':'https://ziontechgroup.com/fr/discovery/',
            'de':'https://ziontechgroup.com/de/discovery/',
          }
          for locale,(path_s,canonical) in discovery_pages.items():
            path=Path(path_s)
            if not path.is_file():
              errors.append(f'missing localized Discovery page: {path}')
              continue
            validate_locale(path,locale,canonical,expected_discovery)

          canonical_pt=Path('public/discovery/index.html')
          alias_pt=Path('public/pt/discovery/index.html')
          if not canonical_pt.is_file() or not alias_pt.is_file():
            errors.append('missing canonical Portuguese Discovery or its /pt/discovery/ compatibility alias')
          elif canonical_pt.read_bytes()!=alias_pt.read_bytes():
            errors.append('Portuguese Discovery compatibility alias must match the canonical /discovery/ page')

          variants=['','-pt','-es','-fr','-de']
          for suffix in variants:
            src=Path(f'apps/operations-reliability-ai-2026{suffix}.html')
            pub=Path(f'public/apps/operations-reliability-ai-2026{suffix}.html')
            if not src.is_file() or not pub.is_file():
              errors.append(f'missing Operations mirror pair: {src} / {pub}')
              continue
            if src.read_bytes()!=pub.read_bytes():
              errors.append(f'Operations source/public mirror drift: {src} != {pub}')

          sitemap=Path('public/apps/apps-sitemap.xml')
          if not sitemap.is_file():
            errors.append('missing public/apps/apps-sitemap.xml')
          else:
            text=sitemap.read_text(encoding='utf-8')
            required=[
              '/apps/','/pt/apps/','/es/apps/','/fr/apps/','/de/apps/',
              '/discovery/','/en/discovery/','/pt/discovery/','/es/discovery/','/fr/discovery/','/de/discovery/',
              '/apps/operations-reliability-ai-2026.html',
              '/apps/operations-reliability-ai-2026-pt.html',
              '/apps/operations-reliability-ai-2026-es.html',
              '/apps/operations-reliability-ai-2026-fr.html',
              '/apps/operations-reliability-ai-2026-de.html',
              '/zion-app-network/app-network-operations-evidence-checklist-2026.html',
            ]
            for route in required:
              if f'https://ziontechgroup.com{route}' not in text:
                errors.append(f'apps sitemap missing {route}')

          index=Path('public/sitemap.xml')
          if not index.is_file() or index.stat().st_size < 100:
            errors.append('public/sitemap.xml missing or unexpectedly empty')
          else:
            text=index.read_text(encoding='utf-8')
            for child in ['https://ziontechgroup.com/sitemap-0.xml','https://ziontechgroup.com/apps/apps-sitemap.xml']:
              if child not in text:
                errors.append(f'sitemap index missing {child}')

          robots=Path('public/robots.txt')
          if not robots.is_file():
            errors.append('public/robots.txt missing')
          else:
            text=robots.read_text(encoding='utf-8')
            for child in ['Sitemap: https://ziontechgroup.com/sitemap.xml','Sitemap: https://ziontechgroup.com/apps/apps-sitemap.xml']:
              if child not in text:
                errors.append(f'robots.txt missing {child}')

          if errors:
            for e in errors:
              print(f'::error::{e}')
            sys.exit(1)
          print('Apps i18n release contract: PASS')
          PY
