name: Agents alias contract

on:
  pull_request:
    paths:
      - 'public/agents/**'
      - 'public/autonomous-ai-agents/**'
      - 'scripts/check-agents-alias.py'
      - 'scripts/tests/test_agents_alias.py'
      - 'scripts/prepare-pages-out.sh'
      - '.github/workflows/agents-alias-contract.yml'
  push:
    branches: [main]
    paths:
      - 'public/agents/**'
      - 'public/autonomous-ai-agents/**'
      - 'scripts/check-agents-alias.py'
      - 'scripts/tests/test_agents_alias.py'
      - 'scripts/prepare-pages-out.sh'
      - '.github/workflows/agents-alias-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alias-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The public repository has an orphan .pageploy gitlink. Fetch without
      # credentials or submodule traversal; never suppress a checkout failure.
      - name: Checkout public candidate
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid candidate SHA'; exit 1; }
          [[ -z "$(find . -mindepth 1 -maxdepth 1 -print -quit)" ]] || { echo 'Workspace is not empty'; exit 1; }
          git init --quiet
          git remote add origin https://github.com/Zion-support/zion-support.github.io.git
          git -c credential.helper= fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git checkout --detach FETCH_HEAD
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version-file: '.nvmrc'
      - name: Test alias contract offline
        run: python3 scripts/tests/test_agents_alias.py
      - name: Assemble the real Pages artifact
        run: bash scripts/prepare-pages-out.sh
      - name: Check alias in assembled artifact
        run: python3 scripts/check-agents-alias.py out
