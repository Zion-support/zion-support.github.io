name: AI Incident Suppression Registry

permissions:
  contents: write
  issues: read

"on":
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Persist measured report on main'
        type: boolean
        default: false

concurrency:
  group: ai-incident-suppression-registry
  cancel-in-progress: false

jobs:
  suppression-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ github.token }}
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Generate read-only incident registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/generate-incident-suppression-registry.cjs


      - name: Persist measured report
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation/persist-observation.cjs automation/reports/incident-suppression-registry-latest.json

      - name: Upload incident registry
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: incident-registry-${{ github.run_id }}
          path: automation/reports/incident-suppression-registry-latest.json
          if-no-files-found: error
