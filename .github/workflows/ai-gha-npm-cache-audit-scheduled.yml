name: AI GHA npm cache audit

"on":
  workflow_dispatch:
  schedule:
    - cron: '35 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ai-gha-npm-cache-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent token
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Offline inventory regression tests
        run: node --test automation/gha-npm-cache-audit.test.cjs

      - name: Inventory npm cache configuration (advisory, read-only)
        run: node automation/gha-npm-cache-audit.cjs

      - name: Upload bounded inventory evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gha-npm-cache-audit-${{ github.run_id }}
          path: automation/reports/gha-npm-cache-audit-latest.json
          if-no-files-found: error
          retention-days: 30
