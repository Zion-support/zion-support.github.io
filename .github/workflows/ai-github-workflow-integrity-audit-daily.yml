name: GitHub workflow integrity audit (read-only)

permissions:
  contents: read

"on":
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/github-workflow-integrity-auditor.cjs'
      - 'automation/github-workflow-integrity-auditor.test.cjs'
      - '.github/workflows/ai-github-workflow-integrity-audit-daily.yml'

concurrency:
  group: ai-github-integrity-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Inspect only the auditor's inputs; unrelated malformed gitlinks must
          # not break checkout credential cleanup or expand the scan's scope.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /automation/
            /scripts/automation/
            /.nvmrc

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Test auditor (offline)
        run: node --test automation/github-workflow-integrity-auditor.test.cjs

      - name: Audit local GitHub Actions workflows
        run: node automation/github-workflow-integrity-auditor.cjs

      - name: Summarize audit evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('automation/reports/github-workflow-integrity-audit-latest.json', 'utf8'));
          const summary = [
            '## Workflow integrity evidence',
            '',
            `Status: **${report.status}**`,
            `Workflows inspected: ${report.workflowCount}`,
            `Static findings: ${report.counts.totalFindings}`,
            `Findings omitted from the bounded report: ${report.truncatedFindings}`,
            '',
            'Download the JSON artifact for details. Findings require review; this static audit does not attest runtime health.',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workflow-integrity-audit-${{ github.run_id }}
          path: automation/reports/github-workflow-integrity-audit-latest.json
          if-no-files-found: error
          retention-days: 14
