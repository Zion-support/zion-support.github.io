name: GitHub workflow integrity audit (read-only)

permissions:
  contents: read

"on":
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/github-workflow-integrity-auditor.cjs'
      - 'automation/github-workflow-integrity-auditor.test.cjs'
      - '.github/workflows/ai-github-workflow-integrity-audit-daily.yml'

concurrency:
  group: ai-github-integrity-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reuse the public acquisition from agent-presence-retirement-test.yml.
      # No credentials or submodule auth cleanup; preserve unrelated gitlinks.
      - name: Acquire exact public revision without credentials
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" EXPECTED_SHA="$EXPECTED_SHA" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=/bin/false SSH_ASKPASS=/bin/false \
            bash --noprofile --norc <<'ACQUIRE'
          set -euo pipefail
          test "${#EXPECTED_SHA}" -eq 40
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test ! -e .git
          git init
          git remote add origin https://github.com/Zion-support/zion-support.github.io.git
          git sparse-checkout set --no-cone '/.github/workflows/' '/automation/' '/scripts/automation/' '/.nvmrc'
          git -c credential.helper= fetch --depth=1 --filter=blob:none --no-tags --no-recurse-submodules origin "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git -c credential.helper= checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          ACQUIRE

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Test auditor (offline)
        run: node --test automation/github-workflow-integrity-auditor.test.cjs

      - name: Audit local GitHub Actions workflows
        run: node automation/github-workflow-integrity-auditor.cjs

      - name: Summarize audit evidence
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('automation/reports/github-workflow-integrity-audit-latest.json', 'utf8'));
          const summary = [
            '## Workflow integrity evidence',
            '',
            `Status: **${report.status}**`,
            `Workflows inspected: ${report.workflowCount}`,
            `Static findings: ${report.counts.totalFindings}`,
            `Findings omitted from the bounded report: ${report.truncatedFindings}`,
            '',
            'Download the JSON artifact for details. Findings require review; this static audit does not attest runtime health.',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workflow-integrity-audit-${{ github.run_id }}
          path: automation/reports/github-workflow-integrity-audit-latest.json
          if-no-files-found: error
          retention-days: 14
