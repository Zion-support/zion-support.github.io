name: GitHub workflow integrity audit (read-only)

permissions:
  contents: read

"on":
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

concurrency:
  group: ai-github-workflow-integrity-audit-daily
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test auditor (offline)
        run: node --test automation/github-workflow-integrity-auditor.test.cjs

      - name: Audit local GitHub Actions workflows
        run: node automation/github-workflow-integrity-auditor.cjs

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: workflow-integrity-audit-${{ github.run_id }}
          path: automation/reports/github-workflow-integrity-audit-latest.json
          if-no-files-found: error
          retention-days: 14
