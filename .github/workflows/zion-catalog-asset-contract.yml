name: Zion catalog asset contract

on:
  pull_request:
    paths:
      - "public/assets/js/zion-catalog.js"
      - "scripts/ci/test-zion-catalog-asset.cjs"
      - ".github/workflows/zion-catalog-asset-contract.yml"

permissions:
  contents: read

jobs:
  static-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Validate first-party catalog asset without network
        run: node scripts/ci/test-zion-catalog-asset.cjs
