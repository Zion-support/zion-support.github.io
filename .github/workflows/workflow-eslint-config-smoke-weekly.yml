# Ensures eslint.config.mjs exists, parses as ESM, and retains its core imports/export.

name: eslint.config.mjs smoke (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '25 7 * * 5' # Fridays 07:25 UTC
  workflow_dispatch:

concurrency:
  group: workflow-eslint-config-smoke-weekly
  cancel-in-progress: true

jobs:
  eslint-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'

      - name: eslint.config.mjs exists and parses as ESM
        run: |
          set -euo pipefail
          test -f eslint.config.mjs
          test -s eslint.config.mjs
          node --check eslint.config.mjs
          grep -Fq "import js from '@eslint/js';" eslint.config.mjs
          grep -Fq "import typescript from '@typescript-eslint/eslint-plugin';" eslint.config.mjs
          grep -Fq 'export default [' eslint.config.mjs
          echo 'ok: eslint.config.mjs syntax and anchors'
