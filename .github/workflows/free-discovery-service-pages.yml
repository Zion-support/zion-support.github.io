name: Free Discovery commercial copy consistency

on:
  pull_request:
    paths:
      - "public/discovery/index.html"
      - "public/autonomous-ai-agents/index.html"
      - "public/finops-consulting/index.html"
      - "finops-consulting/index.html"
      - "scripts/ci/test-free-discovery-service-pages.cjs"
      - ".github/workflows/free-discovery-service-pages.yml"

permissions:
  contents: read

jobs:
  evidence-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
      - name: Reject conflicting paid Discovery claims
        run: node scripts/ci/test-free-discovery-service-pages.cjs
