name: onepassword-sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  onepassword-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts/composio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/scripts/composio/package-lock.json

      - name: Install Composio SDK
        run: npm ci

      - name: List 1Password vaults and items
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          ONEPASSWORD_VAULT_ID: qvoxujxka43fr3kyzmb3qsidpi
        run: node onepassword-list-vault.mjs

      - name: Comment summary
        if: always()
        run: |
          {
            echo "onepassword-sync listed vault qvoxujxka43fr3kyzmb3qsidpi via Composio."
            echo "Set COMPOSIO_1PASSWORD_CONNECTION_ID to _1password_winful-mast (alias zion-teams-write)."
          } >> "$GITHUB_STEP_SUMMARY"
