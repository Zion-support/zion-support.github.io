name: composio-1password-sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  onepassword-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: List 1Password vaults and items
        id: onepassword
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          ONEPASSWORD_VAULT_ID: qvoxujxka43fr3kyzmb3qsidpi
        run: |
          cat > sync.mjs <<'EOF'
          import { Composio } from '@composio/core';

          const apiKey = process.env.COMPOSIO_API_KEY;
          const connectionId = process.env.COMPOSIO_1PASSWORD_CONNECTION_ID;
          const vaultId = process.env.ONEPASSWORD_VAULT_ID;
          if (!apiKey) throw new Error('COMPOSIO_API_KEY is missing');
          if (!connectionId) throw new Error('COMPOSIO_1PASSWORD_CONNECTION_ID is missing');

          const composio = new Composio({ apiKey });
          const vaults = await composio.tools.execute('_1PASSWORD_LIST_VAULTS', {
            connectedAccountId: connectionId,
            arguments: {},
          });
          const items = await composio.tools.execute('_1PASSWORD_LIST_ITEMS', {
            connectedAccountId: connectionId,
            arguments: { vault_id: vaultId },
          });

          const vaultData = vaults?.data || vaults;
          const itemData = items?.data || items;
          const vaultList = vaultData?.vaults || [];
          const itemList = itemData?.items || [];
          console.log(JSON.stringify({
            connectionId,
            vaultCount: vaultList.length,
            vaults: vaultList.map((v) => ({ id: v.id, name: v.name })),
            itemCount: itemList.length,
            titles: itemList.map((i) => i.title),
          }, null, 2));
          EOF
          node sync.mjs

      - name: Comment summary
        run: |
          echo "1Password vault qvoxujxka43fr3kyzmb3qsidpi listed via Composio." >> "$GITHUB_STEP_SUMMARY"
          echo "Set COMPOSIO_1PASSWORD_CONNECTION_ID to _1password_winful-mast (alias zion-teams-write)." >> "$GITHUB_STEP_SUMMARY"
