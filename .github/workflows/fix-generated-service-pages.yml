name: Fix generated service pages (one-off codemod)

permissions:
  contents: write

concurrency:
  group: fix-generated-service-pages
  cancel-in-progress: false

"on":
  workflow_dispatch:

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Apply fixes to generated pages (python)
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, pathlib
          roots = ['app', 'components']
          exts = ('.tsx',)
          f1 = f2 = f3 = 0
          for root in roots:
              r = pathlib.Path(root)
              if not r.exists():
                  continue
              for p in r.rglob('*.tsx'):
                  try:
                      t = p.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  o = t
                  # Fix 1: path=`...` -> path={`...`}
                  t = re.sub(r'(path=)(`[^`]*`)', r'\1{\2}', t)
                  if t != o:
                      f1 += 1; o = t
                  # Fix 2: raw JSON object inside JSX script tag -> template literal expression
                  t = re.sub(r'(<script type="application/ld\+json">)(\{.*?\})(</script>)',
                             lambda m: m.group(1) + '{`' + m.group(2) + '`}' + m.group(3),
                             t, flags=re.DOTALL)
                  if t != o:
                      f2 += 1; o = t
                  # Fix 3: dangerouslySetInnerHTML={__html: X} -> {{ __html: X }}
                  t = re.sub(r'dangerouslySetInnerHTML=\{__html: (.*?)\}',
                             r'dangerouslySetInnerHTML={{ __html: \1 }}', t)
                  if t != o:
                      f3 += 1
                  if t != o or True:
                      pass
                  if t != pathlib.Path(p).read_text(encoding='utf-8'):
                      p.write_text(t, encoding='utf-8')
          print(f"fix1 files: {f1}, fix2 files: {f2}, fix3 files: {f3}")
          # verify no remaining broken patterns
          import subprocess
          for pat in [r'path=`', r'dangerouslySetInnerHTML=\{__html:']:
              out = subprocess.run(['grep','-rlE',pat,'app','components','--include=*.tsx'],
                                   capture_output=True, text=True).stdout.strip()
              print(pat, 'remaining:', 0 if not out else len(out.splitlines()))
          PYEOF

      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "Zion Bot"
          git config user.email "kleber@ziontechgroup.com"
          git add app components
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(pages): repair JSX syntax in auto-generated pages (template-literal path attr + JSON-LD wrapping + dangerouslySetInnerHTML braces)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break || sleep 5
          done
