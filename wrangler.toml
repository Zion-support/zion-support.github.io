name = "ziontechgroup"
compatibility_date = "2026-09-15"
pages_build_output_dir = "./public"

# Cloudflare Workers Builds: static assets only. Do not run Next.js.
# Production public site is GitHub Pages via .github/workflows/static-deploy.yml.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
