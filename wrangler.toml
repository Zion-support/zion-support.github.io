# Cloudflare Workers Builds: production site is static HTML in public/.
# Do not run Next.js. package.json lists next for other repo tooling only.
name = "ziontechgroup"
compatibility_date = "2026-09-15"
pages_build_output_dir = "./public"

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
