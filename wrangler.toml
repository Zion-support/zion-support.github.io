# Production site is static HTML in public/ (GitHub Pages via static-deploy.yml).
# Workers Builds must deploy those files as assets — never detect Next.js
# from package.json or run `npm run build`.
name = "ziontechgroup"
compatibility_date = "2024-09-23"
workers_dev = false

[assets]
directory = "./public"
not_found_handling = "404-page"
